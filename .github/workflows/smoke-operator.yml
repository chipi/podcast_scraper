# Post-deploy live smoke for the public operator viewer (#43). Runs the Playwright live smoke
# (web/gi-kg-viewer/e2e/live) against the DEPLOYED operator.closelistening.app after a successful
# "Deploy operator — PUBLIC surface" run — and on demand via workflow_dispatch. Read-only vs prod
# (passes the coming-soon gate with the preview basic-auth; never mutates data). Mirrors
# smoke-player.yml.
name: Smoke operator (live)

on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force a failure AFTER the smoke passes, to exercise the GlitchTip alert path (leaves prod untouched).'
        type: boolean
        default: false
  workflow_run:
    # Must match the deploy workflow's ``name:`` EXACTLY, else this never auto-fires (the
    # 2026-08-09 gap: was "Deploy operator (public)").
    workflows: ["Deploy operator — PUBLIC surface"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: smoke-operator
  cancel-in-progress: false

jobs:
  smoke:
    # Manual runs always fire; auto runs only when the deploy actually succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/gi-kg-viewer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/gi-kg-viewer/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Live smoke vs operator.closelistening.app
        env:
          LIVE_BASE_URL: https://${{ vars.OPERATOR_DOMAIN || 'operator.closelistening.app' }}
          OPERATOR_PREVIEW_USER: ${{ vars.PLAYER_PREVIEW_USER || 'marko' }}
          # The operator doorman reuses the player's basic-auth. Without it the gated specs skip;
          # the public coming-soon assertion still runs.
          OPERATOR_PREVIEW_PASS: ${{ secrets.PLAYER_PREVIEW_PASS }}
          # Authed operator plane (account.live): mints a session for the seeded CREATOR test account.
          # Absent → the authed block skips. Mirrors deploy-operator.yml's smoke job so an on-demand
          # dispatch validates the same surface without a redeploy.
          PLAYER_APP_SESSION_SECRET: ${{ secrets.PLAYER_APP_SESSION_SECRET }}
          OPERATOR_SMOKE_CREATOR_USER_ID: ${{ vars.OPERATOR_SMOKE_CREATOR_USER_ID }}
        run: npm run test:e2e:live
      - name: Simulate failure (GlitchTip alert-path test)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}
        run: |
          echo "simulate_failure=true → forcing a non-zero exit AFTER a passing smoke to exercise"
          echo "the failure() alert path below. Prod was untouched; the real smoke already passed."
          exit 1
      - name: Alert GlitchTip on smoke failure
        if: failure()
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.PROD_SENTRY_DSN_PLAYER_API }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then echo "no GlitchTip DSN — skipping alert"; exit 0; fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SIM="${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure }}"
          MSG="Live smoke FAILED — operator prod (sha ${GITHUB_SHA::7}) — ${RUN_URL}"
          [ "$SIM" = "true" ] && MSG="[ALERT-PATH TEST] ${MSG}"
          npx --yes @sentry/cli@2 send-event \
            --level error \
            --message "$MSG" \
            --tag surface:operator \
            --tag stage:standalone-smoke \
            --tag alert_test:"$SIM" || echo "GlitchTip alert failed (non-fatal)"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-report-operator
          path: web/gi-kg-viewer/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
