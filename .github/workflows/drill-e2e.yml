name: DR drill — smoke (post_deploy_smoke)

# GitHub #752 / #799 — read-only smoke against the Hetzner **drill** stack from GHA.
# Joins the tailnet as tag:gha-deployer, resolves dr-podcast MagicDNS (suffix
# drift), then runs scripts/ops/post_deploy_smoke.sh over HTTPS (same probes as
# prod make smoke-prod).
#
# Prerequisites:
#   secrets: TS_OAUTH_CLIENT_ID + TS_OAUTH_SECRET, DRILL_DEPLOY_SSH_PRIVATE_KEY (deploy@ PEM, same as drill-deploy)
#   vars:    DRILL_TAILNET_FQDN (e.g. dr-podcast.tail-xxxx.ts.net)
#
# Tailscale ACL must allow tag:gha-deployer → tag:dr-drill:443 for HTTPS in
# addition to :22 for SSH-heavy jobs. Apply **prod** infra (`infra-apply.yml`) so
# the ACL reaches the tailnet before expecting this workflow to pass.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DRILL_SMOKE" to confirm read-only drill smoke'
        required: true
        default: ''
  workflow_call:
    secrets:
      TS_OAUTH_CLIENT_ID:
        required: true
      TS_OAUTH_SECRET:
        required: true
      DRILL_DEPLOY_SSH_PRIVATE_KEY:
        required: true
    inputs:
      confirm:
        description: 'Must be DRILL_SMOKE (orchestrator passes this after DRILL_EXERCISE gate)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: drill-e2e
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: drill
    steps:
      - name: "DR drill — confirm: DRILL_SMOKE"
        run: |
          if [ "${{ inputs.confirm }}" != "DRILL_SMOKE" ]; then
            echo "::error::Must type DRILL_SMOKE to confirm. Got: '${{ inputs.confirm }}'"
            exit 1
          fi

      - name: "DR drill — pre-flight: secrets and variables"
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DRILL_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DRILL_DEPLOY_SSH_PRIVATE_KEY }}
          DRILL_TAILNET_FQDN:          ${{ vars.DRILL_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${TS_OAUTH_CLIENT_ID:-}" ] && MISSING="$MISSING TS_OAUTH_CLIENT_ID"
          [ -z "${TS_OAUTH_SECRET:-}" ]    && MISSING="$MISSING TS_OAUTH_SECRET"
          [ -z "${DRILL_DEPLOY_SSH_PRIVATE_KEY:-}" ] && MISSING="$MISSING DRILL_DEPLOY_SSH_PRIVATE_KEY"
          [ -z "${DRILL_TAILNET_FQDN:-}" ]          && MISSING="$MISSING DRILL_TAILNET_FQDN"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing prereqs:$MISSING Stage per workflow header and infra/README.md (#752)."
            exit 1
          fi

      - name: "DR drill — checkout: shallow (smoke + resolver scripts)"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "DR drill — SSH: install identity (deploy@, DRILL_DEPLOY_SSH_PRIVATE_KEY)"
        uses: ./.github/actions/prod-ssh-key
        with:
          ssh_private_key:   ${{ secrets.DRILL_DEPLOY_SSH_PRIVATE_KEY }}
          identity_env_name: SSH_DRILL_IDENTITY

      - name: "DR drill — join: tailnet (tag:gha-deployer)"
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags:    tag:gha-deployer
          # Pinned — `version: latest` broke sha256 verification in GHA (May 2026).
          version: 1.96.4

      - name: "DR drill — resolve: tailnet host (MagicDNS)"
        id: ts_host
        env:
          DRILL_TAILNET_FQDN: ${{ vars.DRILL_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          R=$(bash scripts/ops/resolve_drill_tailnet_host.sh)
          echo "resolved_fqdn=$R" >> "$GITHUB_OUTPUT"
          WANT="${{ vars.DRILL_TAILNET_FQDN }}"
          if [ "$(printf '%s' "$R" | tr '[:upper:]' '[:lower:]')" != "$(printf '%s' "$WANT" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::notice::Tailscale live host ($R) differs from vars.DRILL_TAILNET_FQDN ($WANT). Using $R for probes."
          fi

      - name: "DR drill — smoke: post_deploy_smoke.sh (HTTPS + corpus path)"
        env:
          DRILL_FQDN: ${{ steps.ts_host.outputs.resolved_fqdn }}
          # The /api/corpus/episodes ``path=`` is validated against the api's
          # configured corpus root, which is the IN-CONTAINER path (CLI
          # ``serve --output-dir /app/output``; PODCAST_DEFAULT_CORPUS_PATH=/app/output).
          # The host path /srv/podcast-scraper/corpus is the bind-mount SOURCE and
          # is rejected ("path must be the configured corpus root..."). deploy-prod.yml
          # passes the in-container path the same way (--corpus-path $CONTAINER_CORPUS).
          SMOKE_CORPUS_PATH: /app/output
          # COLD HOST (#2002). A drill machine is minutes old and must obtain an HTTPS cert
          # via `tailscale serve` before anything can be probed, so it needs far longer than
          # prod, where the only delay is a container restart.
          #
          # An earlier version of this comment claimed the cert was merely "still minting" and
          # raised the budget twice. That was WRONG: Certificate Transparency shows the cert is
          # never issued at all on 1.102.x (see the pin in infra/cloud-init/prod.user-data).
          # No budget fixes that. This budget exists so a genuine cold start has room, NOT as a
          # remedy for the cert bug.
          #
          # PROBE_CURL_TIMEOUT_S is deliberately generous. Aborting a handshake early can cancel
          # tailscaled's in-flight ACME attempt, so a short per-attempt timeout risks preventing
          # a HEALTHY cold host from ever completing its first mint — the green July drills
          # succeeded precisely because curl blocked through it.
          PROBE_ATTEMPTS: "8"
          PROBE_CURL_TIMEOUT_S: "90"
        run: |
          set -euo pipefail
          # --allow-missing-search (#1999): this stack was built by RESTORING a snapshot, and
          # backup-corpus-prod.yml deliberately prunes `search/` from snapshots (the LanceDB index
          # is regenerable via `make index-two-tier`). So topic-clusters 404s CORRECTLY here, and
          # without this flag the smoke fails on an artifact the backup is designed not to carry.
          #
          # verify-backup-restore.yml hit exactly this and was fixed in 03da946a6; the drill has
          # the same shape (restore -> smoke) and never got the flag, because `restore` has failed
          # ahead of it on every run since the drill was written — so this stage has never once
          # executed and the defect was unobservable. Added here from the same reasoning rather
          # than waiting for the first green restore to surface it.
          #
          # Every other assertion stays strict: the restore must still prove episodes and
          # artifacts came back.
          bash scripts/ops/post_deploy_smoke.sh "$DRILL_FQDN" \
            --corpus-path "$SMOKE_CORPUS_PATH" \
            --allow-missing-search

      # The drill host is DESTROYED at teardown, so a failure that is not captured here is
      # gone forever. That is why #2002 had to be diagnosed from Certificate Transparency
      # rather than from a log. `journalctl -u tailscaled` names the actual ACME error —
      # a control-side `SetDNS ... 500` reads very differently from a client-side fault.
      # The SSH identity is already installed above and was otherwise unused.
      - name: "DR drill — capture tailscaled journal (why the cert never landed)"
        if: failure()
        env:
          DRILL_FQDN: ${{ steps.ts_host.outputs.resolved_fqdn }}
        run: |
          set +e
          ssh -i "$SSH_DRILL_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            -o ConnectTimeout=20 "deploy@${DRILL_FQDN}" \
            'sudo -n /usr/bin/journalctl -u tailscaled --no-pager -n 400' \
            2>&1 | grep -iE "acme|cert|setdns|serve|error" | tail -60
          echo "::notice::journal capture exit=$? (non-fatal — this step only reports)"
