name: Deploy ALL prod surfaces at ONE sha

# ┌─────────────────────────────────────────────────────────────────────────────────────────┐
# │ DEPLOYING AND SOMETHING IS RED? READ docs/guides/DEPLOY_GOTCHAS.md FIRST.                  │
# │ A 401 is almost never a wrong key — do NOT re-mint prod keys. Verify on the box first.     │
# └─────────────────────────────────────────────────────────────────────────────────────────┘
#
# WHY THIS EXISTS (2026-08-19).
#
# Prod has three surfaces and three standalone deploy workflows: the tailnet control plane
# (deploy-prod), the public player (deploy-player), and the public operator viewer
# (deploy-operator). Nothing ever tied them together, so they drifted — and nobody noticed until
# the operator asked why a week of player work was not live:
#
#     control plane   sha-cd22625   deployed 2026-08-18
#     player          sha-1c6b3de   deployed 2026-08-11   <- 8 days behind
#     operator        sha-1c6b3de   deployed 2026-08-11   <- 8 days behind
#
# Aligning by hand means three dispatches, three confirm strings, and remembering to type the
# same sha into each. This does it once.
#
# CALLED, NOT DISPATCHED — and the difference is not stylistic:
#
#   * `gh workflow run` from a job would need a PAT. The default GITHUB_TOKEN CANNOT trigger a
#     workflow_dispatch: GitHub blocks token-triggered events from starting new runs, to prevent
#     recursion. The first version of this file used `gh workflow run` with GITHUB_TOKEN and
#     would have silently dispatched NOTHING.
#   * Dispatching also produces three SEPARATE runs, each hitting the `prod` environment gate on
#     its own — three approval clicks.
#
#   As reusable workflows these become three JOBS OF THIS RUN, so they reach the `prod`
#   environment together and a single "Review pending deployments" click releases all three.
#
# NO ORDERING, DELIBERATELY — and that is only safe because the guard resolves the sha.
#
# The public surfaces are not downstream of the control plane at RUNTIME: both
# docker-compose.player-public.yml and docker-compose.operator-public.yml run their OWN `api`
# container against the shared read-only corpus volume. Chaining them with `needs:` would buy
# nothing and cost a second approval prompt, because a job that becomes ready later prompts
# again.
#
# They WERE coupled at DEPLOY time, though, which this comment used to miss. With no
# image_sha, deploy-operator and deploy-player pin to the sha RUNNING ON THE BOX, so running
# them unordered alongside a control plane that is mid-recreate is a read-before-write race
# they lose every time. The guard resolving one sha up front is what makes "no ordering"
# actually true: every surface is handed its tag and none of them look at the box.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY_ALL" to deploy every prod surface'
        required: true
      image_sha:
        description: >-
          The sha-<7> every surface will run. Leave EMPTY to resolve "newest published from
          main" ONCE in the guard and pin all three surfaces to that — empty no longer means
          "each surface figures it out for itself". An explicit sha from the Stack test run
          summary is still the clearest choice.
        default: ""
      skip_control_plane:
        description: "Skip the control plane (use when it is already on this sha)"
        type: boolean
        default: false

concurrency:
  # One coordinator at a time, and NOT cancel-in-progress: interrupting midway is exactly how
  # surfaces end up on different shas, which is the problem this exists to fix.
  group: deploy-all-prod
  cancel-in-progress: false

permissions:
  contents: read
  # A caller must grant AT LEAST what its called reusable workflows request, or GitHub rejects the
  # run at load (startup_failure). deploy-player/operator need `packages: read` (pull GHCR images);
  # deploy-prod needs `actions: read`. The pre-rewrite dispatch-based version used `actions: write`
  # for `gh workflow run`; the reusable-workflow rewrite dropped these two by mistake.
  packages: read
  actions: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # The ONE sha. Every surface consumes this; nothing downstream re-derives it.
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Confirm and resolve the ONE sha BEFORE anything deploys
        id: resolve
        env:
          SHA: ${{ inputs.image_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: chipi
          PKG: podcast-scraper-stack-api
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "DEPLOY_ALL" ]; then
            echo "::error::confirm must be exactly DEPLOY_ALL (got '${{ inputs.confirm }}')"
            exit 1
          fi
          S="${SHA#sha-}"
          # An empty image_sha used to mean "each surface resolves its own", and the three
          # children do NOT resolve alike: deploy-prod takes the newest PUBLISHED image, while
          # deploy-operator and deploy-player read whatever is RUNNING ON THE BOX. Those are
          # different answers, and the box answer is read while the control plane is still
          # deploying, so it is also a race. 2026-09-14 run 34808548789: operator pinned
          # sha-377222c at 05:11:22 and player at 05:11:27, both from stale box state, while
          # control-plane recreated onto sha-080403f at 05:12:25 — 63s later. All seven jobs
          # reported success and prod ran two shas for a day.
          #
          # So resolve it HERE, once, and hand the same string to all three.
          if [ -z "$S" ]; then
            TAG=$(gh api "/users/${OWNER}/packages/container/${PKG}/versions?per_page=100" \
              --jq '[.[].metadata.container.tags[]? | select(test("^sha-[0-9a-f]{7,40}$"))] | .[0] // empty')
            S="${TAG#sha-}"
            if [ -z "$S" ]; then
              echo "::error::no published sha-<7> image for ${PKG}. Has any stack-test build succeeded?"
              exit 1
            fi
            echo "::notice::no image_sha given — resolved newest published to sha-${S}"
          fi
          if ! printf '%s' "$S" | grep -qE '^[a-f0-9]{7,40}$'; then
            echo "::error::image_sha must match ^[a-f0-9]{7,40}$ after an optional sha- prefix (got: ${SHA})"
            exit 1
          fi
          echo "sha=$S" >> "$GITHUB_OUTPUT"
          echo "::notice::all surfaces will be pinned to sha-${S}"

  control-plane:
    needs: guard
    if: ${{ inputs.skip_control_plane != true }}
    uses: ./.github/workflows/deploy-prod.yml
    with:
      override_image_sha: ${{ needs.guard.outputs.sha }}
    secrets: inherit

  player:
    needs: guard
    uses: ./.github/workflows/deploy-player.yml
    with:
      override_image_sha: ${{ needs.guard.outputs.sha }}
    secrets: inherit

  operator:
    needs: guard
    uses: ./.github/workflows/deploy-operator.yml
    with:
      override_image_sha: ${{ needs.guard.outputs.sha }}
    secrets: inherit

  report:
    needs: [guard, control-plane, player, operator]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Did every surface actually land on the same sha?
        env:
          SHA: ${{ needs.guard.outputs.sha }}
          CP: ${{ needs.control-plane.result }}
          PL: ${{ needs.player.result }}
          OP: ${{ needs.operator.result }}
        run: |
          set -euo pipefail
          {
            echo "## Deploy ALL — target \`sha-${SHA}\`"
            echo
            echo "| surface | result |"
            echo "| --- | --- |"
            echo "| control plane | ${CP} |"
            echo "| player | ${PL} |"
            echo "| operator | ${OP} |"
            echo
            echo "Every surface was handed \`sha-${SHA}\` explicitly, so no surface resolves its own."
            echo "To confirm on the box:"
            echo
            echo '```'
            echo "  ssh deploy@prod-podcast docker ps --format '{{.Names}} {{.Image}}'"
            echo "  # every podcast-scraper image tag should read sha-${SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # A partial deploy is the drift this workflow exists to prevent, so it must NOT report
          # green. skipped is fine (skip_control_plane); anything else is not.
          FAILED=0
          for r in "$CP" "$PL" "$OP"; do
            case "$r" in success|skipped) ;; *) FAILED=1 ;; esac
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error::surfaces are NOT aligned — control-plane=${CP} player=${PL} operator=${OP}. Re-run the failed ones at the SAME sha before leaving prod in this state."
            exit 1
          fi
          echo "::notice::all surfaces aligned"
