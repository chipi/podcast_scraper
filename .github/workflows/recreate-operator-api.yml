# Apply a rotated APP_OPERATOR_API_KEY to the running CONTROL-plane operator api WITHOUT a
# rebuild. deploy.sh uses ``docker compose up -d`` (no --force-recreate), so a secret-only
# rotation (the tmpfs file changes but the image/compose config does not) is NOT picked up by a
# plain re-deploy — the running container keeps the env it started with. This workflow overwrites
# only the ``app_operator_api_key`` tmpfs secret in place (the other 8 secrets are untouched) and
# force-recreates ONLY the api container from the already-pinned image, so the secrets-shim
# re-reads the new key. Tailnet-only SSH; typed confirm; prod environment gate.
name: Recreate operator api (apply rotated APP_OPERATOR_API_KEY)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RECREATE_OPERATOR to confirm'
        required: true

concurrency:
  # Share deploy-prod's group so this never races a control-plane deploy.
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recreate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    steps:
      - name: Confirm RECREATE_OPERATOR
        run: |
          if [ "${{ inputs.confirm }}" != "RECREATE_OPERATOR" ]; then
            echo "::error::Must type RECREATE_OPERATOR to confirm. Got: '${{ inputs.confirm }}'"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-deployer
          version: 1.96.4

      - name: Install SSH identity for deploy@ (PROD_SSH_PRIVATE_KEY)
        uses: ./.github/actions/prod-ssh-key
        with:
          ssh_private_key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Resolve prod MagicDNS host
        id: ts_host
        env:
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          R=$(bash scripts/ops/resolve_prod_tailnet_host.sh)
          echo "resolved_fqdn=$R" >> "$GITHUB_OUTPUT"

      - name: Overwrite app_operator_api_key tmpfs secret + force-recreate api
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
          PROD_APP_OPERATOR_API_KEY: ${{ secrets.PROD_APP_OPERATOR_API_KEY }}
        run: |
          set -euo pipefail
          SSH=(ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes)
          if [ -z "${PROD_APP_OPERATOR_API_KEY:-}" ]; then
            echo "::error::PROD_APP_OPERATOR_API_KEY secret is empty — refusing to stage an empty key."
            exit 1
          fi
          # 1) Overwrite ONLY app_operator_api_key IN PLACE (same inode; leaves the other 8
          #    provider/DSN secrets in /dev/shm/podcast-secrets intact). Value via stdin so it
          #    never appears in argv/process list. GH masks it in logs regardless.
          printf '%s' "$PROD_APP_OPERATOR_API_KEY" | "${SSH[@]}" "$SSH_TARGET" \
            'set -euo pipefail; test -d /dev/shm/podcast-secrets || { echo "secrets dir missing — run deploy-prod first" >&2; exit 5; }; umask 377; cat > /dev/shm/podcast-secrets/app_operator_api_key; chmod 400 /dev/shm/podcast-secrets/app_operator_api_key'
          # 2) Force-recreate ONLY the api container from the pinned image (.env PODCAST_IMAGE_TAG);
          #    the entrypoint secrets-shim re-reads /run/secrets/app_operator_api_key -> env.
          "${SSH[@]}" "$SSH_TARGET" \
            'set -euo pipefail; cd /srv/podcast-scraper; docker compose --env-file .env -f compose/docker-compose.stack.yml -f compose/docker-compose.prod.yml -f compose/docker-compose.vps-prod.yml -f compose/docker-compose.secrets.yml up -d --force-recreate --no-deps api'
          echo "::notice::api force-recreated; APP_OPERATOR_API_KEY re-read from tmpfs secret."
