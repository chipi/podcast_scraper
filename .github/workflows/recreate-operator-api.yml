# Apply a rotated APP_OPERATOR_API_KEY to the running CONTROL-plane operator api WITHOUT a
# rebuild. deploy.sh uses ``docker compose up -d`` (no --force-recreate), so a secret-only
# rotation (the tmpfs file changes but the image/compose config does not) is NOT picked up by a
# plain re-deploy — the running container keeps the env it started with. This workflow overwrites
# only the ``app_operator_api_key`` tmpfs secret in place (the other 8 secrets are untouched) and
# force-recreates ONLY the api container from the already-pinned image, so the secrets-shim
# re-reads the new key. Tailnet-only SSH; typed confirm; prod environment gate.
name: Recreate operator api (apply rotated APP_OPERATOR_API_KEY)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RECREATE_OPERATOR to confirm'
        required: true

concurrency:
  # Share deploy-prod's group so this never races a control-plane deploy.
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recreate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    steps:
      - name: Confirm RECREATE_OPERATOR
        run: |
          if [ "${{ inputs.confirm }}" != "RECREATE_OPERATOR" ]; then
            echo "::error::Must type RECREATE_OPERATOR to confirm. Got: '${{ inputs.confirm }}'"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-deployer
          version: 1.96.4

      - name: Install SSH identity for deploy@ (PROD_SSH_PRIVATE_KEY)
        uses: ./.github/actions/prod-ssh-key
        with:
          ssh_private_key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Resolve prod MagicDNS host
        id: ts_host
        env:
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          R=$(bash scripts/ops/resolve_prod_tailnet_host.sh)
          echo "resolved_fqdn=$R" >> "$GITHUB_OUTPUT"

      # The host tmpfs dir (/dev/shm/podcast-secrets, RAM) does not persist — Docker copied the
      # secrets into the api at create-time, so the container keeps running off its copy even
      # after the host dir is cleaned. To recreate the api and have it re-read the rotated key,
      # the WHOLE dir must be re-staged first, then the api force-recreated.
      #
      # This MUST go through the canonical action, never an inline copy of the file list. Until
      # 2026-09-16 this step inlined NINE files and its comment claimed that was all of them.
      # The action stages ELEVEN — the inline copy was missing deepgram_api_key and
      # litellm_api_key. Because staging is `rm -rf` then swap, running this workflow REPLACED a
      # complete directory with an incomplete one and then force-recreated the api on top of it:
      # an operator-key rotation would have taken out the LiteLLM gateway as a side effect, which
      # is exactly the 401 that DEPLOY_GOTCHAS §2 calls the most expensive mistake in this repo's
      # history. See #2087.
      - name: Re-stage tmpfs secrets (canonical action — all 11 files)
        uses: ./.github/actions/stage-prod-secrets
        with:
          ssh_target: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
          ssh_identity: ${{ env.SSH_PROD_IDENTITY }}
          openai_api_key:       ${{ secrets.PROD_OPENAI_API_KEY }}
          anthropic_api_key:    ${{ secrets.PROD_ANTHROPIC_API_KEY }}
          gemini_api_key:       ${{ secrets.PROD_GEMINI_API_KEY }}
          mistral_api_key:      ${{ secrets.PROD_MISTRAL_API_KEY }}
          deepseek_api_key:     ${{ secrets.PROD_DEEPSEEK_API_KEY }}
          grok_api_key:         ${{ secrets.PROD_GROK_API_KEY }}
          deepgram_api_key:     ${{ secrets.PROD_DEEPGRAM_API_KEY }}
          litellm_api_key:      ${{ secrets.LITELLM_PROJ_PODCAST_PROD_KEY }}
          sentry_dsn_api:       ${{ secrets.PROD_SENTRY_DSN_API }}
          sentry_dsn_pipeline:  ${{ secrets.PROD_SENTRY_DSN_PIPELINE }}
          app_operator_api_key: ${{ secrets.PROD_APP_OPERATOR_API_KEY }}

      - name: Force-recreate the api
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
        run: |
          set -euo pipefail
          SSHF=(-i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes)
          # Force-recreate ONLY the api container from the pinned image; the secrets-shim re-reads
          # /run/secrets/app_operator_api_key -> APP_OPERATOR_API_KEY.
          ssh "${SSHF[@]}" "$SSH_TARGET" "set -euo pipefail; cd /srv/podcast-scraper; docker compose --env-file .env -f compose/docker-compose.stack.yml -f compose/docker-compose.prod.yml -f compose/docker-compose.vps-prod.yml -f compose/docker-compose.secrets.yml up -d --force-recreate --no-deps api"
          echo "::notice::api force-recreated against the freshly staged secrets."
