# Deploy the PUBLIC consumer player (#1163 / ADR-116) to the always-on VPS.
#
# DEPLOYING AND SOMETHING IS RED? READ docs/guides/DEPLOY_GOTCHAS.md FIRST — esp. the shared
# git-refresh lock (deploy-all runs surfaces in parallel against ONE /srv/podcast-scraper/.git).
#
# Standalone from deploy-prod.yml: brings up compose/docker-compose.player-public.yml
# (a low-privilege app-only backend — no docker.sock, no keys — + the player PWA) and
# drops the player.caddy vhost into the shared Caddy edge (ADR-114). The operator/kg-gi
# surface is untouched. Manual (workflow_dispatch); typed confirm; tailnet-only SSH.
#
# Prereqs (stage once, like deploy-prod #714):
#   secrets: TS_OAUTH_CLIENT_ID + TS_OAUTH_SECRET, PROD_SSH_PRIVATE_KEY, PLAYER_APP_SESSION_SECRET,
#            PLAYER_GOOGLE_CLIENT_SECRET
#            (optional, remote MCP RFC-112) PLAYER_INTERNAL_MCP_TOKEN — unset = MCP off
#   vars:    PROD_TAILNET_FQDN, PLAYER_DOMAIN, PODCAST_CORPUS_VOLUME, PLAYER_GOOGLE_CLIENT_ID
#            (optional) PLAYER_MCP_ALLOWED_ORIGINS
# The Caddy edge + firewall 80/443 must already be live on the box, and DNS for
# PLAYER_DOMAIN must point at the VPS (see docs/guides/PLAYER_PUBLIC_LAUNCH.md). When MCP is
# enabled, add a DNS A record for mcp.<PLAYER_DOMAIN> → the VPS, and register the claude.ai
# connector redirect at claude.ai (DCR is automatic; no manual client provisioning).

name: Deploy player — PUBLIC surface

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PLAYER_DEPLOY to confirm'
        required: true
      override_image_sha:
        description: 'Optional api image sha-<7> to deploy (blank = newest published from main)'
        required: false
      services:
        description: >-
          Optional space-separated compose services to deploy individually (e.g. "obs" for just
          the observability MCP, "mcp" for the content MCP, "mcp obs" for both). Blank = the whole
          player stack (api + both MCPs + app + scheduler). A scoped deploy still re-stages
          .env/config + vhosts, then recreates only the listed services (--no-deps, no
          --remove-orphans), so the rest keep running.
        required: false
        default: ""

  # Callable by deploy-all-prod.yml so every surface can be put on ONE sha in one run.
  # Reusable rather than dispatched: the GITHUB_TOKEN cannot trigger workflow_dispatch (GitHub
  # blocks it to prevent recursion), so a dispatch-based coordinator would need a PAT AND would
  # produce three separate runs needing three separate approvals. As a called workflow this
  # becomes a job of the caller's run, so all three wait on the `prod` environment together and
  # one "Review pending deployments" click releases them.
  #
  # `confirm` is not an input here: the caller already typed DEPLOY_ALL. The typed-confirm gate
  # below therefore only applies to a direct dispatch.
  workflow_call:
    inputs:
      override_image_sha:
        description: "Image :sha-<7> tag to deploy (blank = newest published from main)"
        type: string
        required: false
        default: ""
      services:
        description: "Space-separated compose services to deploy individually (blank = whole stack)."
        type: string
        required: false
        default: ""

concurrency:
  group: deploy-player
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    steps:
      - name: Confirm PLAYER_DEPLOY
        run: |
          # A called reusable workflow inherits the TOP-LEVEL dispatch's inputs, so when deploy-all
          # (dispatched with confirm=DEPLOY_ALL) calls this, inputs.confirm is "DEPLOY_ALL", not empty
          # — and github.event_name is the caller's (workflow_dispatch) too. So accept BOTH the
          # surface confirm (direct dispatch) and DEPLOY_ALL (deploy-all already gated that value).
          if [ "${{ inputs.confirm }}" != "PLAYER_DEPLOY" ] && \
             [ "${{ inputs.confirm }}" != "DEPLOY_ALL" ]; then
            echo "::error::Must type PLAYER_DEPLOY to confirm. Got: '${{ inputs.confirm }}'"
            exit 1
          fi

      - name: Pre-flight — required secrets/variables present?
        id: preflight
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
          PLAYER_DOMAIN: ${{ vars.PLAYER_DOMAIN }}
          PODCAST_CORPUS_VOLUME: ${{ vars.PODCAST_CORPUS_VOLUME }}
          # Coming-soon gate cookie secret (host-side; substituted into player.caddy at
          # deploy). Required — an empty value would ship a guessable gate.
          PLAYER_PREVIEW_COOKIE: ${{ secrets.PLAYER_PREVIEW_COOKIE }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${TS_OAUTH_CLIENT_ID:-}" ] && MISSING="$MISSING TS_OAUTH_CLIENT_ID"
          [ -z "${TS_OAUTH_SECRET:-}" ]    && MISSING="$MISSING TS_OAUTH_SECRET"
          [ -z "${PROD_SSH_PRIVATE_KEY:-}" ] && MISSING="$MISSING PROD_SSH_PRIVATE_KEY"
          [ -z "${PROD_TAILNET_FQDN:-}" ] && MISSING="$MISSING PROD_TAILNET_FQDN"
          [ -z "${PLAYER_DOMAIN:-}" ] && MISSING="$MISSING PLAYER_DOMAIN"
          [ -z "${PODCAST_CORPUS_VOLUME:-}" ] && MISSING="$MISSING PODCAST_CORPUS_VOLUME"
          [ -z "${PLAYER_PREVIEW_COOKIE:-}" ] && MISSING="$MISSING PLAYER_PREVIEW_COOKIE"
          if [ -n "$MISSING" ]; then
            echo "::warning::Missing prereqs:$MISSING — stage them then re-run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (resolver scripts)
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Join the tailnet
        if: steps.preflight.outputs.skip != 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-deployer
          version: 1.96.4

      - name: Install SSH identity for deploy@ (PROD_SSH_PRIVATE_KEY)
        if: steps.preflight.outputs.skip != 'true'
        uses: ./.github/actions/prod-ssh-key
        with:
          ssh_private_key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Resolve prod MagicDNS host
        id: ts_host
        if: steps.preflight.outputs.skip != 'true'
        env:
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          R=$(bash scripts/ops/resolve_prod_tailnet_host.sh)
          echo "resolved_fqdn=$R" >> "$GITHUB_OUTPUT"

      - name: Refresh repo on the box to this ref
        if: steps.preflight.outputs.skip != 'true'
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
          # Deploy the ref the workflow was dispatched on — NOT a hardcoded branch. The edge
          # / player work lives on `production`; hardcoding origin/main silently deployed the
          # wrong commit (chmod + conf.d fixes on production never reached the box; 2026-07-23).
          # Via env (not inline ${{ }}) to keep the ref out of the shell-injection surface.
          DEPLOY_REF: ${{ github.ref_name }}
        run: |
          # SHARED-REPO LOCK (2026-08-21): deploy-all runs player/operator/control-plane in
          # PARALLEL, and all three git-refresh the SAME /srv/podcast-scraper/.git — they collided
          # on git's own .git/shallow.lock and one surface failed ("Unable to create shallow.lock:
          # File exists"). Serialize the refresh across surfaces with an flock on a shared lockfile
          # (FD-based so it releases when the ssh shell exits). A refresh is ~seconds, so waiting is cheap.
          ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "set -euo pipefail; cd /srv/podcast-scraper; \
             exec 9>/tmp/podcast-scraper-git-refresh.lock; \
             flock -w 180 9 || { echo 'could not acquire the shared git-refresh lock in 180s' >&2; exit 1; }; \
             git fetch --depth=50 origin '+refs/heads/*:refs/remotes/origin/*'; \
             git reset --hard 'origin/$DEPLOY_REF'"

      - name: Resolve api image tag
        id: imgsha
        if: steps.preflight.outputs.skip != 'true'
        env:
          OVERRIDE: ${{ inputs.override_image_sha }}
        run: |
          set -euo pipefail
          # "One engine, two surfaces" (ADR-116): by DEFAULT the player runs the EXACT same
          # api image the operator stack is currently running — resolved on the box by
          # deploy-player.sh from the live operator api container. So the default here is to
          # emit an EMPTY tag and let the script pin it. An explicit override_image_sha still
          # wins (validated below + staged). Never the literal :main tag (CI stopped updating
          # it 2026-05-28 -> pre-ADR-116, no /api/app/* surface -> the player 404s).
          SHA_SHORT="${OVERRIDE:-}"; SHA_SHORT="${SHA_SHORT#sha-}"
          if [ -n "$SHA_SHORT" ]; then
            if ! [[ "$SHA_SHORT" =~ ^[a-f0-9]{7,40}$ ]]; then
              echo "::error::override_image_sha must match ^[a-f0-9]{7,40}$ (got: ${SHA_SHORT})"; exit 1
            fi
            echo "tag=sha-$SHA_SHORT" >> "$GITHUB_OUTPUT"
            echo "::notice::Player api image pinned to override sha-$SHA_SHORT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "::notice::No override — deploy-player.sh will pin the player to the operator stack's running engine sha"
          fi

      - name: Validate GHCR api image manifest exists (override only, pre-SSH)
        if: steps.preflight.outputs.skip != 'true' && steps.imgsha.outputs.tag != ''
        env:
          TAG: ${{ steps.imgsha.outputs.tag }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker manifest inspect "ghcr.io/chipi/podcast-scraper-stack-api:${TAG}" >/dev/null

      - name: Stage .env.player (secrets via /dev/shm scp, never inline over ssh)
        if: steps.preflight.outputs.skip != 'true'
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
          PLAYER_DOMAIN: ${{ vars.PLAYER_DOMAIN }}
          PODCAST_CORPUS_VOLUME: ${{ vars.PODCAST_CORPUS_VOLUME }}
          # Empty by default -> deploy-player.sh pins to the operator's running engine sha.
          PODCAST_IMAGE_TAG: ${{ steps.imgsha.outputs.tag }}
          GOOGLE_CLIENT_ID: ${{ vars.PLAYER_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PLAYER_GOOGLE_CLIENT_SECRET }}
          APP_SESSION_SECRET: ${{ secrets.PLAYER_APP_SESSION_SECRET }}
          # Delivery seam (#1412/#1415): shared token the infra worker presents on
          # /internal/outbox/* (X-Internal-Token) — a runtime SECRET (tmpfs under Option A).
          # APP_VAPID_PUBLIC_KEY is the PUBLIC half of the worker's VAPID key (served to the
          # browser by /api/app/push/vapid-key) — not secret, always written to .env.player.
          INTERNAL_OUTBOX_TOKEN: ${{ secrets.PLAYER_INTERNAL_OUTBOX_TOKEN }}
          APP_VAPID_PUBLIC_KEY: ${{ secrets.PLAYER_APP_VAPID_PUBLIC_KEY }}
          # Player error DSNs → self-hosted GlitchTip project 5. SPLIT per surface (like the
          # operator's _API / _VIEWER) for flexibility: _WEB is the BROWSER DSN (dashless key,
          # via the public telemetry edge, baked into the bundle); _API is the BACKEND DSN
          # (server-side). Both point at project 5 today but are independently repointable
          # (e.g. a distinct backend project, or the tailnet host for _API). Empty → no-op.
          PROD_SENTRY_DSN_PLAYER_WEB: ${{ secrets.PROD_SENTRY_DSN_PLAYER_WEB }}
          PROD_SENTRY_DSN_PLAYER_API: ${{ secrets.PROD_SENTRY_DSN_PLAYER_API }}
          # MCP-surface backend DSN (#1505). Its own GlitchTip project (per-surface split);
          # empty until the project + secret exist → GlitchTip no-op for the MCP, traces + logs
          # still flow.
          PROD_SENTRY_DSN_PLAYER_MCP: ${{ secrets.PROD_SENTRY_DSN_PLAYER_MCP }}
          # Umami website UUID (public — ships in the bundle; a var, not a secret).
          PLAYER_UMAMI_WEBSITE_ID: ${{ vars.PLAYER_UMAMI_WEBSITE_ID }}
          # ADR-115 Option A: when '1', the RUNTIME secrets (client secret, session secret,
          # backend DSN) are delivered as tmpfs files + exported by the shim, so they are
          # DROPPED from .env.player. Default empty = today's env behaviour. Cutover = set
          # the GH var. Mirrors the operator's PODCAST_SECRETS_VIA_FILES.
          PLAYER_SECRETS_VIA_FILES: ${{ vars.PLAYER_SECRETS_VIA_FILES }}
          # Coming-soon gate cookie secret. Consumed HOST-SIDE by deploy-player.sh (sed'd
          # into player.caddy) — it never enters the container, so it lives in .env.player
          # (0600, scp'd, never inline over ssh), not the tmpfs container-secret set.
          PLAYER_PREVIEW_COOKIE: ${{ secrets.PLAYER_PREVIEW_COOKIE }}
          # Backend sign-in access policy (server/app_access.py). Non-secret (emails/domains
          # + mode) → GH vars. Unset APP_SIGNUP_MODE defaults to `allowlist`; with an empty
          # email/domain list that is DEFAULT-DENY, so these must be set for anyone to sign in.
          APP_SIGNUP_MODE: ${{ vars.PLAYER_SIGNUP_MODE }}
          APP_ALLOWED_EMAILS: ${{ vars.PLAYER_ALLOWED_EMAILS }}
          APP_ALLOWED_DOMAINS: ${{ vars.PLAYER_ALLOWED_DOMAINS }}
          # Bootstrap admins (CSV of emails) — the accounts granted `admin` on login (gates the
          # operator surfaces + `mcp_access` grants). Non-secret → GH var.
          APP_ADMIN_EMAILS: ${{ vars.PLAYER_ADMIN_EMAILS }}
          # Remote MCP (RFC-112). The shared secret that gates the internal verify seam + the mcp
          # service. EMPTY (secret unset) = MCP stays inert (verify 503 → every connect 401) and the
          # mcp vhost is skipped — a safe default. Set PLAYER_INTERNAL_MCP_TOKEN to turn MCP on.
          # Issuer/resource URLs are derived from the domain host-side (deploy-player.sh); no secret.
          INTERNAL_MCP_TOKEN: ${{ secrets.PLAYER_INTERNAL_MCP_TOKEN }}
          # Optional browser DNS-rebind allow-list (claude.ai is server-side → no Origin, so empty
          # is fine). e.g. "https://claude.ai".
          APP_MCP_ALLOWED_ORIGINS: ${{ vars.PLAYER_MCP_ALLOWED_ORIGINS }}
          # Observability MCP (#56, the SECOND MCP — obs vhost). It reuses INTERNAL_MCP_TOKEN above
          # (same admin verify seam), so it turns on with the content MCP. These are the read tokens
          # its probes need; each is OPTIONAL — an empty one just makes that source report
          # "not configured". GlitchTip reuses the existing SENTRY_AUTH_TOKEN; Grafana needs its own
          # homelab SA token; GitHub (deploy history) needs an Actions:read PAT.
          PODCAST_OBS_GRAFANA_TOKEN: ${{ secrets.PODCAST_OBS_GRAFANA_TOKEN }}
          PODCAST_OBS_GITHUB_TOKEN: ${{ secrets.PODCAST_OBS_GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          ENVTMP="$(mktemp -p /dev/shm)"
          {
            echo "PLAYER_DOMAIN=${PLAYER_DOMAIN}"
            echo "PODCAST_CORPUS_VOLUME=${PODCAST_CORPUS_VOLUME}"
            # Host-side gate cookie secret (sed'd into player.caddy by deploy-player.sh).
            echo "PLAYER_PREVIEW_COOKIE=${PLAYER_PREVIEW_COOKIE}"
            # Tags backend Sentry events (+ any env-gated behaviour) as prod — matches the
            # operator api. Without it the backend defaults to environment=dev (sentry_init).
            echo "PODCAST_ENV=prod"
            # Backend sign-in access policy. Default (unset) is allowlist; with an empty
            # email/domain list that denies EVERYONE ("This account is not allowed to sign
            # in"). Set PLAYER_ALLOWED_EMAILS (or _DOMAINS, or PLAYER_SIGNUP_MODE=open).
            echo "APP_SIGNUP_MODE=${APP_SIGNUP_MODE:-allowlist}"
            echo "APP_ALLOWED_EMAILS=${APP_ALLOWED_EMAILS}"
            echo "APP_ALLOWED_DOMAINS=${APP_ALLOWED_DOMAINS}"
            echo "APP_ADMIN_EMAILS=${APP_ADMIN_EMAILS}"
            # OTEL distributed tracing (ADR-119) → the SAME homelab VictoriaTraces OTLP
            # ingest the operator uses (deploy-prod.yml). Turns player API request spans on
            # so a user-triggered error on the player surface pivots to its trace. The
            # homelab tailnet IP for extra_hosts is resolved on the box by deploy-player.sh.
            echo "OTEL_TRACES_EXPORTER=otlp"
            echo "OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://homelab:10428/insert/opentelemetry/v1/traces"
            # Env-tag every span (api + mcp) so staging (laptop) and prod (VPS) split in Grafana —
            # parity with the GlitchTip `environment` tag (#1505 staging↔prod separation).
            echo "OTEL_RESOURCE_ATTRIBUTES=deployment.environment=prod"
            # Pin the api image to the resolved newest-published sha (never stale :main).
            echo "PODCAST_IMAGE_TAG=${PODCAST_IMAGE_TAG}"
            echo "APP_OAUTH_PROVIDER=google"
            echo "APP_OAUTH_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
            # VAPID PUBLIC key — not secret (the browser fetches it); always written.
            echo "APP_VAPID_PUBLIC_KEY=${APP_VAPID_PUBLIC_KEY}"
            # Runtime secrets (ADR-115 Option A): under PLAYER_SECRETS_VIA_FILES=1 these are
            # delivered as /run/secrets files + exported by the shim, so DROPPED from
            # .env.player (no secrets at rest on disk). Flag off = today's env behaviour.
            if [ "${PLAYER_SECRETS_VIA_FILES:-}" != "1" ]; then
              echo "APP_OAUTH_GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}"
              echo "APP_SESSION_SECRET=${APP_SESSION_SECRET}"
              echo "INTERNAL_OUTBOX_TOKEN=${INTERNAL_OUTBOX_TOKEN}"
            fi
            echo "PLAYER_PORT=8092"
            # Build-time BROWSER DSN for the player bundle (compose build-arg reads this from
            # --env-file .env.player). Empty = Sentry no-op.
            # ⚠ Use the DASHLESS GlitchTip key in PROD_SENTRY_DSN_PLAYER_WEB — the browser
            # @sentry SDK rejects dashed-UUID keys ("Invalid Dsn") and silently drops errors
            # (GlitchTip ingest accepts both, so a curl test misleads). See the same note in
            # stack-test.yml (viewer). 2026-07-22.
            echo "VITE_SENTRY_DSN_PLAYER=${PROD_SENTRY_DSN_PLAYER_WEB}"
            # Player BACKEND (server-side) errors -> GlitchTip project 5 (same as the browser
            # today; independently repointable via PROD_SENTRY_DSN_PLAYER_API). RUNTIME secret
            # -> delivered as a file under Option A, so DROPPED from .env.player when
            # PLAYER_SECRETS_VIA_FILES=1. (VITE_SENTRY_DSN_PLAYER above is a build-time FRONTEND
            # var, baked public into the bundle — always kept.)
            if [ "${PLAYER_SECRETS_VIA_FILES:-}" != "1" ]; then
              echo "PODCAST_SENTRY_DSN_API=${PROD_SENTRY_DSN_PLAYER_API}"
            fi
            # MCP-surface backend DSN (#1505). Falls back to the player API DSN so MCP errors land
            # in the shared GlitchTip project tagged `component=mcp` + `environment` (no new project
            # / UI needed) until a dedicated PROD_SENTRY_DSN_PLAYER_MCP is set to repoint it.
            echo "PODCAST_SENTRY_DSN_MCP=${PROD_SENTRY_DSN_PLAYER_MCP:-${PROD_SENTRY_DSN_PLAYER_API}}"
            # Umami analytics build args. website-id from a GH var; the tracking
            # script URL is derived from the player domain (analytics.<domain>).
            # Both empty -> the bundle's Umami injection stays a no-op.
            echo "VITE_UMAMI_WEBSITE_ID=${PLAYER_UMAMI_WEBSITE_ID}"
            echo "VITE_UMAMI_SRC=${PLAYER_UMAMI_WEBSITE_ID:+https://analytics.${PLAYER_DOMAIN}/script.js}"
            # MCP server-side analytics (#1505): reuse the player Umami site — MCP events are named
            # `mcp_tool:<tool>` (distinct from page views), POSTed to the public beacon collect API.
            # A dedicated MCP site can be split later; env split comes from deployment.environment.
            echo "PODCAST_MCP_UMAMI_WEBSITE_ID=${PLAYER_UMAMI_WEBSITE_ID}"
            echo "PODCAST_MCP_UMAMI_URL=${PLAYER_UMAMI_WEBSITE_ID:+https://analytics.${PLAYER_DOMAIN}/api/send}"
            # Remote MCP (RFC-112). The shared verify-seam secret (empty → MCP inert + mcp vhost
            # skipped by deploy-player.sh). Issuer = the player apex (hosts the OAuth AS); resource
            # = the mcp subdomain (its own vhost). MCP_PORT is the loopback the Caddy mcp vhost
            # proxies to. Origins guard is optional (claude.ai is server-side → sends no Origin).
            echo "INTERNAL_MCP_TOKEN=${INTERNAL_MCP_TOKEN}"
            echo "APP_MCP_ISSUER_URL=https://${PLAYER_DOMAIN}"
            echo "APP_MCP_RESOURCE_URL=https://mcp.${PLAYER_DOMAIN}"
            echo "APP_MCP_ALLOWED_ORIGINS=${APP_MCP_ALLOWED_ORIGINS}"
            echo "MCP_PORT=8009"
            # Observability MCP (#56): its own vhost (obs.) + loopback port; reuses INTERNAL_MCP_TOKEN
            # + APP_MCP_ISSUER_URL above (same admin verify seam). Config is staged beside the compose
            # file (the scp below). Read tokens are optional — empty just degrades that source.
            echo "OBS_MCP_RESOURCE_URL=https://obs.${PLAYER_DOMAIN}"
            echo "OBS_MCP_PORT=8848"
            # Relative to the compose file's dir (compose/); ../ reaches the box root where the
            # config is scp'd (/srv/podcast-scraper/observability.yaml). MUST match the compose default.
            echo "OBS_CONFIG_HOST_PATH=../observability.yaml"
            echo "PODCAST_OBS_GRAFANA_TOKEN=${PODCAST_OBS_GRAFANA_TOKEN}"
            echo "PODCAST_OBS_GITHUB_TOKEN=${PODCAST_OBS_GITHUB_TOKEN}"
            echo "SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}"
          } > "$ENVTMP"
          scp -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "$ENVTMP" "${SSH_TARGET}:/srv/podcast-scraper/.env.player.staged"
          rm -f "$ENVTMP"
          ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "set -euo pipefail; cd /srv/podcast-scraper; \
             mv .env.player.staged .env.player; chmod 600 .env.player"
          # Observability MCP config (#56): mounted read-only into the `obs` service at
          # /config/observability.yaml (OBS_CONFIG_HOST_PATH=./observability.yaml). No secrets in
          # it — tokens come from .env.player via <field>_env: indirection.
          scp -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            config/observability.prod.yaml "${SSH_TARGET}:/srv/podcast-scraper/observability.yaml"

      - name: Stage tmpfs secret files (ADR-115 Option A)
        # When PLAYER_SECRETS_VIA_FILES=1, write the player runtime secrets to HOST tmpfs
        # /dev/shm/player-secrets/ (RAM, never disk). deploy-player.sh joins the secrets
        # overlay so they mount as /run/secrets/* and the image shim exports them. Atomic:
        # build the dir on the runner in /dev/shm, scp, then swap into place. Mirrors the
        # operator's "Stage tmpfs secret files" step. Filenames are the LOWERCASE of the env
        # the shim must export (app_session_secret -> APP_SESSION_SECRET).
        if: steps.preflight.outputs.skip != 'true' && vars.PLAYER_SECRETS_VIA_FILES == '1'
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PLAYER_GOOGLE_CLIENT_SECRET }}
          APP_SESSION_SECRET: ${{ secrets.PLAYER_APP_SESSION_SECRET }}
          PROD_SENTRY_DSN_PLAYER_API: ${{ secrets.PROD_SENTRY_DSN_PLAYER_API }}
          INTERNAL_OUTBOX_TOKEN: ${{ secrets.PLAYER_INTERNAL_OUTBOX_TOKEN }}
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d -p /dev/shm plsecstage.XXXXXX)
          trap 'rm -rf "$STAGE" 2>/dev/null || true' EXIT
          printf '%s' "$GOOGLE_CLIENT_SECRET"       > "$STAGE/app_oauth_google_client_secret"
          printf '%s' "$APP_SESSION_SECRET"         > "$STAGE/app_session_secret"
          printf '%s' "$PROD_SENTRY_DSN_PLAYER_API" > "$STAGE/podcast_sentry_dsn_api"
          # Delivery seam shared token → /run/secrets/internal_outbox_token; the shim
          # exports it as INTERNAL_OUTBOX_TOKEN (filename = lowercase of the env var).
          printf '%s' "$INTERNAL_OUTBOX_TOKEN"       > "$STAGE/internal_outbox_token"
          chmod 400 "$STAGE"/*
          ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "rm -rf /dev/shm/player-secrets.staged && mkdir -p /dev/shm/player-secrets.staged && chmod 700 /dev/shm/player-secrets.staged"
          scp -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "$STAGE"/* "${SSH_TARGET}:/dev/shm/player-secrets.staged/"
          ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "set -euo pipefail; chmod 400 /dev/shm/player-secrets.staged/*; \
             rm -rf /dev/shm/player-secrets; \
             mv /dev/shm/player-secrets.staged /dev/shm/player-secrets"

      - name: Deploy (build + up + vhost drop + reload + health)
        if: steps.preflight.outputs.skip != 'true'
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
          # ADR-115 Option A: deploy-player.sh joins the secrets overlay + runs the exit-5/6
          # gates only when it SEES this flag. It is not in .env.player and SSH does not
          # inherit the runner env, so it MUST be passed inline (same as deploy-prod passes
          # PODCAST_SECRETS_VIA_FILES to deploy.sh). Without this the script silently skips
          # the overlay while .env.player has dropped the secrets -> keyless container -> 503.
          VIA_FILES: ${{ vars.PLAYER_SECRETS_VIA_FILES }}
          # Tailnet suffix for the player-telemetry/analytics vhosts' __TAILNET__ placeholder
          # (Level 3 #1665). Same inline-forwarding rationale as VIA_FILES: SSH does not inherit
          # the runner env, so it MUST be passed inline — otherwise deploy-player.sh ships the
          # literal __TAILNET__ into the TLS-node reverse_proxy and telemetry/analytics ingest breaks.
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
          # Optional individual-service deploy (#56): blank = whole stack. Passed inline (SSH does
          # not inherit the runner env) so deploy-player.sh scopes its `compose up` to these.
          DEPLOY_SERVICES: ${{ inputs.services }}
        run: |
          set -euo pipefail
          # Validate the free-text `services` input BEFORE it crosses the ssh boundary — a value
          # like `obs'; <cmd>; '` would otherwise break out of the remote single-quote and run
          # arbitrary commands as deploy@ on prod (advisor M2). Allow only compose-service chars.
          case "${DEPLOY_SERVICES}" in
            *[!a-zA-Z0-9\ _-]*)
              echo "::error::services may contain only letters/digits/space/underscore/hyphen; got '${DEPLOY_SERVICES}'"
              exit 1 ;;
          esac
          ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "DEPLOY_SERVICES='${DEPLOY_SERVICES}' PLAYER_SECRETS_VIA_FILES='${VIA_FILES}' PROD_TAILNET_FQDN='${PROD_TAILNET_FQDN}' /srv/podcast-scraper/infra/deploy/deploy-player.sh"

      - name: External health probe (public player domain)
        if: steps.preflight.outputs.skip != 'true'
        env:
          # Probe the public ROOT (edge + Cloudflare + TLS reachability), NOT an app path.
          # During the pre-launch coming-soon phase the edge gate returns the coming-soon
          # page (200) for every path incl. /api/app/*, so an app-path probe validates
          # nothing extra; and the backend itself is already validated in-container by the
          # deploy step's /api/health check. A 200 here means DNS+CF+origin-lock+TLS+edge
          # are all serving. (Earlier red runs were the origin lock blocking direct :443
          # before Cloudflare fronted the domain — not a deploy failure.)
          PROBE: https://${{ vars.PLAYER_DOMAIN }}/
        run: |
          set -euo pipefail
          for _ in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$PROBE" || echo 000)
            if [ "$code" = "200" ]; then echo "player public edge OK ($PROBE)"; exit 0; fi
            sleep 5
          done
          echo "::error::public player edge probe did not return 200 ($PROBE)"; exit 1

      - name: Emit deploy event to VictoriaLogs (Tier-1 o11y, ADR-119)
        # Self-hosted sink over the tailnet (runner already joined above). Fires on
        # success AND failure. Non-fatal — never turns a deploy red (a telemetry sink being
        # unreachable, e.g. when an earlier step failed before the tailnet join, must not fail
        # the deploy — the comment said non-fatal but continue-on-error was missing).
        continue-on-error: true
        if: always() && steps.preflight.outputs.skip != 'true'
        uses: ./.github/actions/emit-ops-event
        with:
          event-type: deploy
          env: prod
          victorialogs-url: ${{ vars.HOMELAB_VICTORIALOGS_URL }}
          msg: "player deploy ${{ job.status }}"
          fields: status=${{ job.status }} surface=player triggered_by=${{ github.actor }}

  # Post-deploy live smoke — runs IN this deploy run (standalone dispatch AND when deploy-all-prod
  # calls this reusable workflow), so a broken deploy can't report green. This closes the gap where
  # the old smoke-player.yml only fired on a standalone `workflow_run` and therefore NEVER ran on the
  # `deploy-all` path (a reusable-workflow call emits no workflow_run event) — so a UI regression (the
  # "Learning Player" → "Close Listening" rename) shipped to prod unvalidated and unseen.
  smoke:
    name: Post-deploy live smoke
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web/learning-player
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/learning-player/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Live smoke vs the deployed player
        env:
          LIVE_BASE_URL: https://${{ vars.PLAYER_DOMAIN || 'closelistening.app' }}
          PLAYER_PREVIEW_USER: ${{ vars.PLAYER_PREVIEW_USER || 'marko' }}
          # Gate password (preview basic-auth). Without it the gated specs skip; the public
          # coming-soon assertion still runs.
          PLAYER_PREVIEW_PASS: ${{ secrets.PLAYER_PREVIEW_PASS }}
          # Per-user surfaces (Collections/Library) run as a dedicated PROD TEST ACCOUNT: the smoke
          # mints the app's own HMAC session token from the session secret + the seeded test user's
          # id. Both absent → account.live.spec skips (public + anon specs still run). See the runbook
          # "Post-deploy live smoke" → "Per-user test account" for the one-time operator setup.
          PLAYER_APP_SESSION_SECRET: ${{ secrets.PLAYER_APP_SESSION_SECRET }}
          PLAYER_SMOKE_USER_ID: ${{ vars.PLAYER_SMOKE_USER_ID }}
        run: npm run test:e2e:live
      - name: Alert GlitchTip on smoke failure
        if: failure()
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.PROD_SENTRY_DSN_PLAYER_API }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then echo "no GlitchTip DSN — skipping alert"; exit 0; fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          npx --yes @sentry/cli@2 send-event \
            --level error \
            --message "Post-deploy live smoke FAILED — player prod (sha ${GITHUB_SHA::7}) — ${RUN_URL}" \
            --tag surface:player \
            --tag stage:post-deploy-smoke || echo "GlitchTip alert failed (non-fatal)"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-report
          path: web/learning-player/playwright-report/
          retention-days: 7
