name: Build & publish podcast-obs image

# Publishes the observability control-plane MCP server image to GHCR so the homelab can pull and
# run it (an always-on, tailnet-reachable MCP endpoint any agentic tool connects to). The image is
# tiny (python-slim + src/podcast_obs, no ML/heavy deps) and multi-arch (the homelab is arm64).

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/podcast_obs/**'
      - 'docker/observability/**'
      - '.github/workflows/obs-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # push the image + build cache to ghcr.io/<owner>/podcast-obs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (arm64 emulation for the multi-arch build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Validate + smoke the image on the runner's native arch (amd64, loaded locally) BEFORE
      # publishing anything — a broken control plane must never reach GHCR.
      - name: Build (amd64, load) for smoke
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/observability/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: podcast-obs:smoke
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/podcast-obs-buildcache:latest

      - name: Smoke — CLI help + a verb runs (degrades cleanly with no backends)
        run: |
          docker run --rm podcast-obs:smoke --help | grep -q "surface"
          docker run --rm podcast-obs:smoke summary | grep -q '"target"'

      - name: Validate Dockerfile with hadolint
        run: |
          docker run --rm -v "$(pwd):/workspace" -w /workspace hadolint/hadolint:latest \
            hadolint docker/observability/Dockerfile

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/podcast-obs
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: "Build & push (multi-arch: amd64 + arm64)"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/observability/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/podcast-obs-buildcache:latest
          cache-to: type=registry,mode=min,ref=ghcr.io/${{ github.repository_owner }}/podcast-obs-buildcache:latest
