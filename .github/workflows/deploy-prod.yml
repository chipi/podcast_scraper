name: Deploy operator — CONTROL plane (tailnet, privileged)

# ⚠ NAMING: the FILE is still `deploy-prod.yml` (load-bearing in scripts, cloud-init,
# terraform, and history — see docs/adr/ADR-141). But what it deploys is the operator's
# PRIVILEGED CONTROL plane: the `-p compose` project — the full api (docker.sock + provider
# keys), viewer, and the on-demand pipeline that OWNS/writes the corpus. Tailnet-only. It is
# NOT "prod generically" and NOT the public surface. The PUBLIC operator surface is
# deploy-operator.yml; the public player is deploy-player.yml. See PROD_RUNBOOK
# "The two operator planes + deploy map".
#
# RFC-082 Decision 3: deploy to the always-on Hetzner VPS over Tailscale.
#
# Manual-trigger only at first land. After the operator's first `tofu apply`
# (#714 + #716) and a few green manual runs, a follow-up PR adds the
# `workflow_run: ["Stack test"]` trigger to complete the GitOps deploy loop
# (RFC-082 Decision 6).
#
# Closes #718 (workflow scaffold), #720 (post-deploy /api/health smoke),
# #721 (PODCAST_RELEASE=sha-<short> wiring for Sentry release grouping),
# #744 (resolve prod MagicDNS host after Tailscale join; suffix drift),
# #796 (typed confirm, SHA validation, deploy.sh/git/image alignment).
#
# Operator prerequisites (#714):
#   - secrets: TS_OAUTH_CLIENT_ID + TS_OAUTH_SECRET (see PROD_RUNBOOK.md "Tailscale credentials");
#              PROD_SSH_PRIVATE_KEY (Ed25519 PEM for deploy@ — see PROD_RUNBOOK
#              "GitHub Actions SSH to prod")
#   - vars:    PROD_TAILNET_FQDN (e.g. "prod-podcast.example.ts.net")
#
# Operator: type **PROD_DEPLOY** in ``confirm`` exactly.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "PROD_DEPLOY" to confirm deploying to production'
        required: true
        default: ''
      override_image_sha:
        description: "Image :sha-<7> tag to deploy (blank = newest sha-<7> published to GHCR)"
        required: false
        default: ""
      config_from_main:
        description: "Config-only: reset the box to origin/main (compose/secrets overlay) while keeping the pinned image — no image rebuild. Use for secret/overlay changes."
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  # contents:read — deploy-prod no longer writes to the repo. The prod-marker step
  # used to commit the bump directly to main (#25), but the `main protection` ruleset
  # requires PRs, so the bot push was rejected on every run (GH013) and never landed.
  # The marker is now bumped by hand in a release PR; the step only computes + surfaces
  # the values. No contents:write, no pull-requests scope needed.
  contents: read
  packages: read

concurrency:
  # Serialize prod deploys. A second deploy waits for the first; we don't
  # cancel-in-progress because cancelling mid-`compose up` leaves the stack
  # in an unknown state.
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    steps:
      - name: Confirm PROD_DEPLOY
        run: |
          if [ "${{ inputs.confirm }}" != "PROD_DEPLOY" ]; then
            echo "::error::Must type PROD_DEPLOY to confirm. Got: '${{ inputs.confirm }}'"
            exit 1
          fi

      - name: Pre-flight — required secrets/variables present?
        id: preflight
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          PROD_SSH_PRIVATE_KEY:     ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${TS_OAUTH_CLIENT_ID:-}" ] && MISSING="$MISSING TS_OAUTH_CLIENT_ID"
          [ -z "${TS_OAUTH_SECRET:-}" ]    && MISSING="$MISSING TS_OAUTH_SECRET"
          [ -z "${PROD_SSH_PRIVATE_KEY:-}" ] && MISSING="$MISSING PROD_SSH_PRIVATE_KEY"
          [ -z "${PROD_TAILNET_FQDN:-}" ]    && MISSING="$MISSING PROD_TAILNET_FQDN"
          if [ -n "$MISSING" ]; then
            # Fail loud, not fake-green: a soft skip=true here exited 0 and marked
            # the GH Environment deployment "successful" while deploying NOTHING —
            # an operator who rotated a secret would think the deploy worked
            # (review 2026-07-17 M25). The environment:prod gate + typed confirm
            # already make this a deliberate run, so failing fast is safe.
            echo "::error::Missing required prereqs:$MISSING — stage them per #714 then re-run."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout (resolver script; GH-744)
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # persist-credentials:false — nothing in this workflow pushes to the repo
          # anymore. The prod-marker step only computes + surfaces the bump (the
          # `main` ruleset blocks bot direct-push; the bump lands via a release PR).
          persist-credentials: false

      - name: Resolve target image SHA
        id: sha
        if: steps.preflight.outputs.skip != 'true'
        env:
          # `inputs.*` (not `github.event.inputs.*`) so this stays correct if a
          # `workflow_call` trigger is ever added (RFC-082 Decision 6); equivalent
          # under the current workflow_dispatch trigger.
          OVERRIDE: ${{ inputs.override_image_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: chipi
          PKG: podcast-scraper-stack-api
        run: |
          set -euo pipefail
          # An explicit override always wins. Otherwise resolve to the NEWEST sha-<7>
          # tag actually PUBLISHED to GHCR — NOT github.sha (main HEAD). main HEAD is
          # frequently a commit with no image: the tofu-state auto-commit from
          # infra-apply, or a marker/bookkeeping commit. Blindly pinning github.sha
          # then dies one step later on `docker manifest inspect: manifest unknown`.
          # The newest published image is both real (it exists) and prod-equivalent —
          # the last green stack-test build on main. Mirrors the drill fix (#1088).
          SHA_SHORT="${OVERRIDE:-}"
          SHA_SHORT="${SHA_SHORT#sha-}"
          SRC="override"
          if [ -z "$SHA_SHORT" ]; then
            SRC="latest-published"
            TAG=$(gh api "/users/${OWNER}/packages/container/${PKG}/versions?per_page=100" \
              --jq '[.[].metadata.container.tags[]? | select(test("^sha-[0-9a-f]{7,40}$"))] | .[0] // empty')
            SHA_SHORT="${TAG#sha-}"
          fi
          if [ -z "$SHA_SHORT" ]; then
            echo "::error::no published sha-<7> image for ${PKG} (source: ${SRC}). Has any stack-test build succeeded?"
            exit 1
          fi
          if ! [[ "$SHA_SHORT" =~ ^[a-f0-9]{7,40}$ ]]; then
            echo "::error::resolved image sha must match ^[a-f0-9]{7,40}$ (source: ${SRC}, got: ${SHA_SHORT})"
            exit 1
          fi
          echo "short=$SHA_SHORT" >> "$GITHUB_OUTPUT"
          # config_from_main: emit an EMPTY git_ref so deploy.sh resets the box to origin/main
          # (picks up the compose/secrets overlay) while PODCAST_IMAGE_TAG stays pinned to the
          # resolved image sha — a config-only deploy with no image rebuild. deploy.sh's
          # git==image guard is skipped when git_ref is empty (it takes the origin/main branch).
          if [ "${{ inputs.config_from_main }}" = "true" ]; then
            echo "git_ref=" >> "$GITHUB_OUTPUT"
            echo "::notice::CONFIG-ONLY deploy: box resets to origin/main; image pinned sha-$SHA_SHORT (no rebuild)"
          else
            echo "git_ref=$SHA_SHORT" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploying image tag sha-$SHA_SHORT (source: ${SRC}, git reset target: $SHA_SHORT)"
          fi

      - name: Validate GHCR image manifest exists (pre-SSH)
        if: steps.preflight.outputs.skip != 'true'
        env:
          SHA_SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for svc in api viewer pipeline-llm; do
            ref="ghcr.io/chipi/podcast-scraper-stack-${svc}:sha-${SHA_SHORT}"
            echo "::notice::Checking manifest: ${ref}"
            docker manifest inspect "$ref" >/dev/null
          done

      - name: Join the tailnet
        if: steps.preflight.outputs.skip != 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags:    tag:gha-deployer
          # Pinned — `version: latest` broke sha256 verification in GHA (May 2026).
          version: 1.96.4

      - name: Install SSH identity for deploy@ (PROD_SSH_PRIVATE_KEY)
        if: steps.preflight.outputs.skip != 'true'
        uses: ./.github/actions/prod-ssh-key
        with:
          ssh_private_key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Resolve prod MagicDNS host (GH-744)
        id: ts_host
        if: steps.preflight.outputs.skip != 'true'
        env:
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          R=$(bash scripts/ops/resolve_prod_tailnet_host.sh)
          echo "resolved_fqdn=$R" >> "$GITHUB_OUTPUT"
          WANT="${{ vars.PROD_TAILNET_FQDN }}"
          if [ "$(printf '%s' "$R" | tr '[:upper:]' '[:lower:]')" != "$(printf '%s' "$WANT" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::notice::Tailscale live host ($R) differs from vars.PROD_TAILNET_FQDN ($WANT). Using $R for SSH and probes. See PROD_RUNBOOK (suffix drift)."
          fi

      - name: Stage /srv/podcast-scraper/.env from GH Secrets (#841)
        # Renders the host-side .env from PROD_* GH Secrets at deploy time.
        # GH Secrets is the source of truth; .env becomes a transient
        # artifact regenerated on every deploy. Missing secrets → empty
        # values → compose's ${VAR:-} defaults take over (feature off);
        # the stack still starts.
        #
        # Atomic delivery: tmpfile in /dev/shm (RAM-backed, never disk),
        # SCP to .env.deploy-staged on host, then ssh mv .env-staged → .env
        # so the host never sees a partial file.
        if: steps.preflight.outputs.skip != 'true'
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
          # ADR-115 Option A (#1250): when '1', drop the LLM keys + DSNs from .env
          # (delivered as tmpfs files instead). Default empty = today's behaviour.
          PODCAST_SECRETS_VIA_FILES:    ${{ vars.PODCAST_SECRETS_VIA_FILES }}
          # LLM provider keys
          PROD_OPENAI_API_KEY:          ${{ secrets.PROD_OPENAI_API_KEY }}
          PROD_ANTHROPIC_API_KEY:       ${{ secrets.PROD_ANTHROPIC_API_KEY }}
          PROD_GEMINI_API_KEY:          ${{ secrets.PROD_GEMINI_API_KEY }}
          PROD_MISTRAL_API_KEY:         ${{ secrets.PROD_MISTRAL_API_KEY }}
          PROD_DEEPSEEK_API_KEY:        ${{ secrets.PROD_DEEPSEEK_API_KEY }}
          PROD_GROK_API_KEY:            ${{ secrets.PROD_GROK_API_KEY }}
          PROD_DEEPGRAM_API_KEY:        ${{ secrets.PROD_DEEPGRAM_API_KEY }}
          # Sentry DSNs (one per project)
          PROD_SENTRY_DSN_API:          ${{ secrets.PROD_SENTRY_DSN_API }}
          PROD_SENTRY_DSN_PIPELINE:     ${{ secrets.PROD_SENTRY_DSN_PIPELINE }}
          PROD_SENTRY_DSN_VIEWER:       ${{ secrets.PROD_SENTRY_DSN_VIEWER }}
          # Operator write-API key (app_operator_guard.py) — X-Operator-Key for headless automation.
          PROD_APP_OPERATOR_API_KEY:    ${{ secrets.PROD_APP_OPERATOR_API_KEY }}
          # (Grafana Cloud retired — o11y is self-hosted homelab VictoriaMetrics/VictoriaLogs
          # via the /opt/vps-observability Alloy container; nothing staged into .env here.)
          # Optional outbound webhook
          PROD_JOB_WEBHOOK_URL:         ${{ secrets.PROD_JOB_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          ENVTMP=$(mktemp -p /dev/shm prod-env.XXXXXX)
          trap 'shred -u "$ENVTMP" 2>/dev/null || rm -f "$ENVTMP"' EXIT
          chmod 600 "$ENVTMP"
          # ``printf '%s=%s\n'`` is shell-safe regardless of characters in
          # secret values (no shell interpolation of the value).
          {
            # Static ingress + paths (per PROD_RUNBOOK env reference)
            printf '%s=%s\n' PODCAST_DOCKER_PROJECT_DIR /srv/podcast-scraper
            printf '%s=%s\n' PODCAST_CORPUS_HOST_PATH   /srv/podcast-scraper/corpus
            printf '%s=%s\n' PODCAST_DEFAULT_CORPUS_PATH /app/output
            printf '%s=%s\n' PODCAST_ENV                 prod
            printf '%s=%s\n' PODCAST_AVAILABLE_PROFILES  cloud_balanced,cloud_thin
            printf '%s=%s\n' PODCAST_DEFAULT_PROFILE     cloud_balanced
            # OTEL traces endpoint (ADR-119). vps-prod overlay flips the exporter
            # to otlp; the endpoint is the self-hosted VictoriaTraces OTLP ingest on
            # homelab, addressed by its Tailscale MagicDNS name (resolved in-container
            # via the overlay's extra_hosts homelab:<ip>). Non-secret. A box migration
            # is a one-line flip of the host here (DGX stopgap was dgx-llm-1:10428).
            printf '%s=%s\n' OTEL_EXPORTER_OTLP_TRACES_ENDPOINT 'http://homelab:10428/insert/opentelemetry/v1/traces'
            # VictoriaMetrics read endpoint for the Ops view's Prod-LLM spend card (#53,
            # ADR-142): the /api/ops/llm-gateway route queries per-key litellm spend from
            # homelab VictoriaMetrics via podcast_obs. Non-secret; same tailnet as OTEL above.
            # Only the tailnet-only control plane serves the ops routes (not operator-public).
            printf '%s=%s\n' PODCAST_OBS_VICTORIAMETRICS_URL 'http://homelab:8428'
            # LLM provider keys + Sentry DSNs. Under ADR-115 Option A (#1250,
            # PODCAST_SECRETS_VIA_FILES=1) these are delivered as tmpfs FILES and
            # the shim exports them, so they are DROPPED from the plaintext .env
            # (no secrets at rest on disk). Flag off = today's env behaviour.
            if [ "${PODCAST_SECRETS_VIA_FILES:-}" != "1" ]; then
              printf '%s=%s\n' OPENAI_API_KEY     "$PROD_OPENAI_API_KEY"
              printf '%s=%s\n' ANTHROPIC_API_KEY  "$PROD_ANTHROPIC_API_KEY"
              printf '%s=%s\n' GEMINI_API_KEY     "$PROD_GEMINI_API_KEY"
              printf '%s=%s\n' MISTRAL_API_KEY    "$PROD_MISTRAL_API_KEY"
              printf '%s=%s\n' DEEPSEEK_API_KEY   "$PROD_DEEPSEEK_API_KEY"
              printf '%s=%s\n' GROK_API_KEY       "$PROD_GROK_API_KEY"
              printf '%s=%s\n' DEEPGRAM_API_KEY   "$PROD_DEEPGRAM_API_KEY"
              printf '%s=%s\n' PODCAST_SENTRY_DSN_API      "$PROD_SENTRY_DSN_API"
              printf '%s=%s\n' PODCAST_SENTRY_DSN_PIPELINE "$PROD_SENTRY_DSN_PIPELINE"
              # Write-grant credential — same VIA_FILES treatment as the provider keys: on disk
              # only when the tmpfs overlay is OFF; delivered as a tmpfs file when it is ON.
              printf '%s=%s\n' APP_OPERATOR_API_KEY "$PROD_APP_OPERATOR_API_KEY"
            fi
            # Viewer DSN is a build-time FRONTEND var (baked into the viewer image),
            # not a runtime container secret — always keep it in .env.
            printf '%s=%s\n' VITE_SENTRY_DSN_VIEWER      "$PROD_SENTRY_DSN_VIEWER"
            # (No Grafana Cloud creds staged — o11y ships to self-hosted homelab; the
            # /opt/vps-observability Alloy container owns REMOTE_WRITE_URL/LOGS_WRITE_URL.)
            # Webhook
            printf '%s=%s\n' PODCAST_JOB_WEBHOOK_URL "$PROD_JOB_WEBHOOK_URL"
          } > "$ENVTMP"
          scp -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "$ENVTMP" "${SSH_TARGET}:/srv/podcast-scraper/.env.deploy-staged"
          ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "set -euo pipefail; cd /srv/podcast-scraper; \
             mv .env.deploy-staged .env; \
             chmod 600 .env; \
             chown deploy:deploy .env; \
             test -f .bootstrap-needs-env && rm -f .bootstrap-needs-env || true"

      - name: Stage tmpfs secret files (ADR-115 Option A, #1250)
        # When PODCAST_SECRETS_VIA_FILES=1, write the provider keys + Sentry DSNs
        # to HOST tmpfs /dev/shm/podcast-secrets/ (RAM, never disk). The secrets
        # overlay (deploy.sh adds it when the flag is on) mounts them as files and
        # the shim exports them. Atomic: build the dir on the runner in /dev/shm,
        # scp, then swap into place so a partial upload is never mounted.
        if: steps.preflight.outputs.skip != 'true' && vars.PODCAST_SECRETS_VIA_FILES == '1'
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
          PROD_OPENAI_API_KEY:      ${{ secrets.PROD_OPENAI_API_KEY }}
          PROD_ANTHROPIC_API_KEY:   ${{ secrets.PROD_ANTHROPIC_API_KEY }}
          PROD_GEMINI_API_KEY:      ${{ secrets.PROD_GEMINI_API_KEY }}
          PROD_MISTRAL_API_KEY:     ${{ secrets.PROD_MISTRAL_API_KEY }}
          PROD_DEEPSEEK_API_KEY:    ${{ secrets.PROD_DEEPSEEK_API_KEY }}
          PROD_GROK_API_KEY:        ${{ secrets.PROD_GROK_API_KEY }}
          PROD_DEEPGRAM_API_KEY:    ${{ secrets.PROD_DEEPGRAM_API_KEY }}
          PROD_SENTRY_DSN_API:      ${{ secrets.PROD_SENTRY_DSN_API }}
          PROD_SENTRY_DSN_PIPELINE: ${{ secrets.PROD_SENTRY_DSN_PIPELINE }}
          PROD_APP_OPERATOR_API_KEY: ${{ secrets.PROD_APP_OPERATOR_API_KEY }}
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d -p /dev/shm secstage.XXXXXX)
          trap 'rm -rf "$STAGE"' EXIT
          # File name = the lowercase secret name the overlay + shim expect.
          printf '%s' "$PROD_OPENAI_API_KEY"      > "$STAGE/openai_api_key"
          printf '%s' "$PROD_ANTHROPIC_API_KEY"   > "$STAGE/anthropic_api_key"
          printf '%s' "$PROD_GEMINI_API_KEY"      > "$STAGE/gemini_api_key"
          printf '%s' "$PROD_MISTRAL_API_KEY"     > "$STAGE/mistral_api_key"
          printf '%s' "$PROD_DEEPSEEK_API_KEY"    > "$STAGE/deepseek_api_key"
          printf '%s' "$PROD_GROK_API_KEY"        > "$STAGE/grok_api_key"
          printf '%s' "$PROD_DEEPGRAM_API_KEY"    > "$STAGE/deepgram_api_key"
          printf '%s' "$PROD_SENTRY_DSN_API"      > "$STAGE/podcast_sentry_dsn_api"
          printf '%s' "$PROD_SENTRY_DSN_PIPELINE" > "$STAGE/podcast_sentry_dsn_pipeline"
          printf '%s' "$PROD_APP_OPERATOR_API_KEY" > "$STAGE/app_operator_api_key"
          chmod 400 "$STAGE"/*
          ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "rm -rf /dev/shm/podcast-secrets.staged && mkdir -p /dev/shm/podcast-secrets.staged && chmod 700 /dev/shm/podcast-secrets.staged"
          scp -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "$STAGE"/* "${SSH_TARGET}:/dev/shm/podcast-secrets.staged/"
          ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "set -euo pipefail; chmod 400 /dev/shm/podcast-secrets.staged/*; \
             rm -rf /dev/shm/podcast-secrets; \
             mv /dev/shm/podcast-secrets.staged /dev/shm/podcast-secrets; \
             chmod 700 /dev/shm/podcast-secrets"

      - name: Wire PODCAST_RELEASE into host .env (#721 — Sentry release grouping)
        # Idempotent: prior PODCAST_RELEASE=... line is removed before the new
        # one is appended, so re-runs don't accumulate duplicates.
        # init_sentry() already reads PODCAST_RELEASE per
        # src/podcast_scraper/utils/sentry_init.py, so no app code change needed.
        if: steps.preflight.outputs.skip != 'true'
        env:
          SHA_SHORT:  ${{ steps.sha.outputs.short }}
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
        run: |
          ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "set -euo pipefail; cd /srv/podcast-scraper; \
             test -f .env || install -m 600 /dev/null .env; \
             sed -i '/^PODCAST_RELEASE=/d' .env; \
             echo 'PODCAST_RELEASE=sha-${SHA_SHORT}' >> .env; \
             chmod 600 .env"

      - name: Pre-deploy corpus path preflight (#808)
        if: steps.preflight.outputs.skip != 'true'
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
        run: |
          set -euo pipefail
          bash scripts/ops/preflight_prod_corpus_path.sh "$SSH_TARGET"
          HOST_CORPUS=$(ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "grep '^PODCAST_CORPUS_HOST_PATH=' /srv/podcast-scraper/.env | cut -d= -f2-")
          CONTAINER_CORPUS=$(ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "grep '^PODCAST_DEFAULT_CORPUS_PATH=' /srv/podcast-scraper/.env | cut -d= -f2-")
          {
            echo "### Corpus path preflight (#808)"
            echo "- Host \`PODCAST_CORPUS_HOST_PATH\`: \`$HOST_CORPUS\`"
            echo "- Container \`PODCAST_DEFAULT_CORPUS_PATH\` (smoke \`path=\`): \`$CONTAINER_CORPUS\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record deploy start time (#803 D1)
        id: deploy_t0
        if: steps.preflight.outputs.skip != 'true'
        run: echo "ms=$(date +%s%3N)" >> "$GITHUB_OUTPUT"

      - name: Deploy (git reset + compose pull + compose up + VPS-local /api/health)
        # deploy.sh on the VPS exits 0 only on healthy stack — failures here
        # surface red within the SSH session. VPS-local probe is
        # container-local (docker compose exec api curl 127.0.0.1:8000), not
        # host loopback :8000 (GH-745).
        if: steps.preflight.outputs.skip != 'true'
        env:
          SHA_SHORT:  ${{ steps.sha.outputs.short }}
          GIT_REF:    ${{ steps.sha.outputs.git_ref }}
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
          # ADR-115 Option A (#1250): deploy.sh joins the secrets overlay when '1'.
          VIA_FILES:  ${{ vars.PODCAST_SECRETS_VIA_FILES }}
        run: |
          ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "DEPLOY_GIT_SHA='${GIT_REF}' DEPLOY_IMAGE_SHA='${SHA_SHORT}' PODCAST_SECRETS_VIA_FILES='${VIA_FILES}' /srv/podcast-scraper/infra/deploy/deploy.sh"

      - name: External /api/health probe over Tailscale (#720)
        # Belt-and-suspenders: deploy.sh already hit /api/health inside the api
        # container; this probes via tailnet MagicDNS to catch nginx / serve /
        # cert issues. 60s timeout (12 × 5s). See PROD_RUNBOOK "API health
        # checks by context" (GH-745).
        if: steps.preflight.outputs.skip != 'true'
        env:
          PROBE_URL: https://${{ steps.ts_host.outputs.resolved_fqdn }}/api/health
        run: |
          set -euo pipefail
          # --max-time caps each attempt so an unreachable :443 (e.g. a missing ACL
          # grant) FAILS FAST instead of hanging the whole run for minutes on curl's
          # default connect timeout — the incident this step was written to expose.
          for i in $(seq 1 12); do
            if curl -fsS --max-time 8 "$PROBE_URL" | jq -e '.status == "ok"' >/dev/null 2>&1; then
              echo "::notice::/api/health OK over tailnet after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::/api/health did not return ok within ~100s over tailnet"
          ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes \
            "deploy@${{ steps.ts_host.outputs.resolved_fqdn }}" \
            'docker logs --tail 50 compose-api-1' 2>&1 || true
          exit 1

      - name: Post-deploy smoke (six API surfaces)
        # Two paths matter:
        #   PODCAST_CORPUS_HOST_PATH    = on-host directory (e.g. /srv/podcast-scraper/corpus)
        #   PODCAST_DEFAULT_CORPUS_PATH = bind-mount target inside the api container (e.g. /app/output)
        # The probe over tailnet hits the api process inside the container,
        # so the ``path=`` query param MUST be the in-container path. Sending
        # the host path used to 422 with "path must be the configured corpus
        # root or a subdirectory of it." Validate the host dir exists
        # separately so we still catch the case where the host bind source
        # is missing.
        if: steps.preflight.outputs.skip != 'true'
        env:
          PROBE_FQDN: ${{ steps.ts_host.outputs.resolved_fqdn }}
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
        run: |
          set -euo pipefail
          HOST_CORPUS=$(ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "grep '^PODCAST_CORPUS_HOST_PATH=' /srv/podcast-scraper/.env | cut -d= -f2-")
          CONTAINER_CORPUS=$(ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "grep '^PODCAST_DEFAULT_CORPUS_PATH=' /srv/podcast-scraper/.env | cut -d= -f2-")
          if [ -z "${HOST_CORPUS:-}" ]; then
            echo "::error::PODCAST_CORPUS_HOST_PATH missing from host .env"
            exit 1
          fi
          if [ -z "${CONTAINER_CORPUS:-}" ]; then
            echo "::error::PODCAST_DEFAULT_CORPUS_PATH missing from host .env (smoke probe needs the in-container path)"
            exit 1
          fi
          if ! ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "test -d '$HOST_CORPUS'"; then
            echo "::error::PODCAST_CORPUS_HOST_PATH is not a directory on host: $HOST_CORPUS"
            exit 1
          fi
          {
            echo "### Post-deploy smoke corpus paths"
            echo "- Host: \`$HOST_CORPUS\`"
            echo "- Smoke probe \`path=\`: \`$CONTAINER_CORPUS\`"
          } >> "$GITHUB_STEP_SUMMARY"
          bash scripts/ops/post_deploy_smoke.sh "$PROBE_FQDN" --corpus-path "$CONTAINER_CORPUS"

      - name: Emit deploy event to VictoriaLogs (Tier-1 o11y, ADR-119)
        # Self-hosted sink over the tailnet (homelab VictoriaLogs :9428) — the runner is
        # already on the tailnet from the deploy join, and tag:gha-deployer has the
        # homelab-host:9428 ACL grant. Fires on success AND failure (feeds failure-rate /
        # MTTR panels). Non-fatal — never turns a deploy red. (Was Grafana Cloud Loki;
        # migrated to the self-hosted sink to finish ADR-119.)
        if: always() && steps.preflight.outputs.skip != 'true'
        env:
          VICTORIALOGS_URL: ${{ vars.HOMELAB_VICTORIALOGS_URL }}
          START_MS: ${{ steps.deploy_t0.outputs.ms }}
          JOB_STATUS: ${{ job.status }}
          SHA_SHORT: ${{ steps.sha.outputs.short }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -z "${VICTORIALOGS_URL:-}" ]; then
            echo "::warning::HOMELAB_VICTORIALOGS_URL unset; skipping deploy-event emit (non-fatal)"
            exit 0
          fi
          duration_ms=$(( $(date +%s%3N) - ${START_MS:-$(date +%s%3N)} ))
          bash scripts/ops/emit_ops_event.sh \
            --event-type deploy --env prod \
            --msg "prod deploy ${JOB_STATUS} sha-${SHA_SHORT}" \
            --field status="$JOB_STATUS" --field sha="$SHA_SHORT" \
            --field surface=operator --field duration_ms="$duration_ms" \
            --field triggered_by="$ACTOR" \
            || echo "::warning::deploy-event emit failed (non-fatal)"

      - name: Mark Sentry release boundary (#803 D2)
        # Draws the release boundary on the Sentry error timeline. Only on a fully green deploy.
        # Needs secrets.SENTRY_AUTH_TOKEN (Internal Integration, Release: Admin) + vars.SENTRY_ORG.
        if: success() && steps.preflight.outputs.skip != 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECTS: ${{ vars.SENTRY_PROJECTS }}
          SHA_SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ] || [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECTS:-}" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN/SENTRY_ORG/SENTRY_PROJECTS absent; skipping Sentry release boundary"
            exit 0
          fi
          bash scripts/ops/mark_sentry_release.sh \
            --org "$SENTRY_ORG" --version "sha-$SHA_SHORT" \
            --environment prod --projects "$SENTRY_PROJECTS" \
            || echo "::warning::Sentry release boundary failed (non-fatal)"

      # #1176 — after a green prod deploy, compute the prod-state marker + pinned
      # fixture so the CI net C "prod-gap" test measures gap-to-current-prod
      # rather than gap-to-some-old-baseline. Surfaced (not committed) for a human
      # to land in the next release PR, so any fixture-shape drift the marker+ledger
      # bump cannot repair gets eyeballed. The migration-guard workflow and
      # test_pinned_fixture_shape.py provide the second layer of safety.
      - name: Compute prod-state marker + pinned fixture (surface for a release PR)
        # The marker (config/last_deployed_prod_version.json + the pinned upgrade
        # fixture) records what is running on prod, so upgrade tests baseline against
        # the real last release. It must be bumped after a prod deploy.
        #
        # It is NOT committed here. #25 tried to direct-push the bump to main, but the
        # `main protection` ruleset requires PRs, so the bot push was rejected on every
        # deploy (GH013) and never landed — the marker on main has been stale since.
        # Rather than loosen branch protection or open a CI-cascading PR per deploy, we
        # compute the bump and SURFACE it: the values + a ready-to-apply diff go to the
        # job summary, and the operator lands it in the next release PR (as history
        # already does, e.g. 54acd0cf).
        #
        # CAVEAT: if a deploy included a migration that changes a .gi.json/.kg.json
        # SHAPE, the pinned fixture carries the pre-deploy shape and
        # test_pinned_fixture_shape.py will fail on the NEXT real PR until the fixture
        # is hand-edited (see tests/fixtures/upgrade/corpus_at_last_prod_release/README.md).
        if: success() && steps.preflight.outputs.skip != 'true'
        env:
          SHA_SHORT: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          python -V >/dev/null 2>&1 || { echo "::warning::python missing; skipping prod-marker compute"; exit 0; }
          # Install just enough to import the registry — no test deps.
          python -m pip install --quiet -e . >/dev/null 2>&1 || {
            echo "::warning::pip install -e . failed; skipping prod-marker compute"
            exit 0
          }
          CODE_VERSION="$(python -c 'import podcast_scraper as p; print(p.__version__)')"
          python scripts/ops/bump_prod_marker.py \
            --code-version "$CODE_VERSION" \
            --sha "$SHA_SHORT"
          FILES=(
            config/last_deployed_prod_version.json
            tests/fixtures/upgrade/corpus_at_last_prod_release/upgrade_ledger.json
            tests/fixtures/upgrade/corpus_at_last_prod_release/corpus_manifest.json
          )
          if git diff --quiet -- "${FILES[@]}"; then
            echo "prod-marker already current — nothing to bump."
            { echo "### prod-state marker"; echo; echo "Already current for \`sha-${SHA_SHORT}\` — no bump needed."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::notice::prod-marker bump computed for sha-${SHA_SHORT} — land it in the next release PR (not auto-committed; main requires PRs)."
          DIFF="$(git diff -- "${FILES[@]}")"
          {
            echo "### prod-state marker — bump me in the next release PR"
            echo
            echo "Deploy pinned \`sha-${SHA_SHORT}\`. The marker + pinned fixture below reflect the"
            echo "new prod state but were **not** committed (the \`main\` ruleset requires a PR)."
            echo "Apply this diff in your next PR (or run \`scripts/ops/bump_prod_marker.py --code-version ${CODE_VERSION} --sha ${SHA_SHORT}\` locally):"
            echo
            echo '```diff'
            echo "$DIFF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
