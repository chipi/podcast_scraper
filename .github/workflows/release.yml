# Release workflow — operator-triggered, stops at tag + draft notes
# (per operator directive 2026-06-25).
#
# Steps:
#   1. ci-fast on the release commit (hard gate)
#   2. Build release notes draft
#   3. Create a DRAFT GitHub release with the notes attached
#
# The eval block is NO LONGER produced here. Steps 2-4 used to call
# ai-experiment-pipeline.yml and ml-benchmark.yml and diff the result
# against data/baselines/; all three moved to the private eval repo
# (chipi/podcast-scraper-eval-data), which is where the research data
# they read lives. The release notes now say so instead of embedding a
# delta this repo cannot compute. Re-attaching it means running the
# comparison there and pasting the block in, until someone wires a
# cross-repo handoff.
#
# Operator publishes the draft manually after reviewing. Deploy is
# intentionally NOT wired in — surfaced via a separate manual deploy
# workflow once the release is published.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.7.0)'
        required: true

permissions:
  contents: write   # creates the draft GitHub release + tag

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  ci-fast:
    name: Sanity (ci-fast)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.8'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run make ci-fast
        run: make ci-fast

  draft-release:
    name: Compose draft release
    needs: ci-fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need full history for prev-tag lookup

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.8'

      - name: Compose release notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          PREV_TAG=$(git tag --sort=-version:refname | head -n 1 || true)
          {
            echo "# Release ${VERSION}"
            echo
            echo "## Commits since ${PREV_TAG:-(no prior tag)}"
            if [ -n "${PREV_TAG}" ]; then
              git log --pretty='- %h %s' "${PREV_TAG}..HEAD" || true
            else
              git log --pretty='- %h %s' -n 25 || true
            fi
            echo
            echo "## Eval deltas"
            echo
            echo "Not computed here. The experiment runner, the benchmark and the"
            echo "baselines they diff against live in the private eval repo"
            echo "(chipi/podcast-scraper-eval-data). Run the comparison there and"
            echo "paste the block in before publishing this draft."
          } > /tmp/release-notes.md
          echo "Composed /tmp/release-notes.md ($(wc -l </tmp/release-notes.md) lines)"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "${VERSION}" \
            --draft \
            --title "${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --target "${GITHUB_SHA}"
          echo "::notice::Draft release ${VERSION} created. Publish manually after review."
