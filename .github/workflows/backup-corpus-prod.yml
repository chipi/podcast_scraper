name: Backup corpus snapshot (prod VPS)

# Daily backup of the prod VPS corpus directory to a private GitHub Releases
# asset on chipi/podcast_scraper-backup. RFC-082 Decision 4 (Phase A).
#
# Complements codespace-target backup-corpus.yml (manual-only; no cron).
# Same backup repo, different release tag prefix (snapshot-prod-* vs
# snapshot-*). Cutover follow-up (#723) can add a prod schedule and further
# retire codespace exports when ready. Until then this workflow stays
# workflow_dispatch-only (no `schedule:` trigger).
#
# Closes #722 (Phase A side). #744: resolve prod MagicDNS host after join.
#
# Operator prerequisites (#714):
#   secrets: TS_OAUTH_CLIENT_ID + TS_OAUTH_SECRET (see PROD_RUNBOOK.md "Tailscale credentials");
#            PROD_SSH_PRIVATE_KEY (Ed25519 PEM for deploy@ — see "GitHub Actions SSH to prod");
#            BACKUP_REPO_TOKEN (required when dry_run is false)
#   vars:    PROD_TAILNET_FQDN, PODCAST_BACKUP_REPO (defaults to chipi/podcast_scraper-backup)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without uploading (logs the would-do tarball size + retention prune list)"
        required: false
        type: boolean
        default: true
  schedule:
    # Daily at 05:37 UTC (off-peak; staggered ~1h20 after the player/operator appdata runs).
    # Scheduled runs pass no `dry_run` input → treated as a REAL backup + upload. Aligned
    # to the daily appdata backups so a same-day DR restore has a consistent corpus + user
    # data set. (#723 parallel-run cutover is a separate verification, not a gate on the
    # schedule.)
    - cron: "37 5 * * *"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # `environment: prod-backup` is a PROVENANCE label (shows the source env in the
    # Actions UI; future-proofs multi-env), NOT a gate — it is an UNGATED environment (no
    # required reviewers) so the daily schedule runs unattended. The literal `prod`
    # environment is gated (shared with deploys) and would leave every run pending forever.
    # Safe move: this backup's secrets (BACKUP_REPO_TOKEN/PROD_SSH_PRIVATE_KEY/TS_OAUTH_*)
    # are all REPO-level — none are prod-env-scoped — so nothing is lost (verified
    # 2026-07-26). Read-only tarball pull; matches backup-player-appdata-prod.yml.
    environment: prod-backup
    # Raised 30 -> 120 on 2026-08-18. Every scheduled run from 2026-08-13 to 2026-08-18
    # was CANCELLED at exactly 30m20s mid-way through the corpus pull — six consecutive
    # silent failures, because a timeout cancel is not a red X and pages nobody. Nobody
    # knew how long the pull actually needs, because it has never been allowed to finish.
    # 120 is headroom to MEASURE, not a considered budget; retune once a run completes.
    timeout-minutes: 120
    steps:
      - name: Pre-flight — required secrets/variables present?
        id: preflight
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          PROD_SSH_PRIVATE_KEY:  ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          BACKUP_REPO_TOKEN:     ${{ secrets.BACKUP_REPO_TOKEN }}
          PROD_TAILNET_FQDN:     ${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${TS_OAUTH_CLIENT_ID:-}" ] && MISSING="$MISSING TS_OAUTH_CLIENT_ID"
          [ -z "${TS_OAUTH_SECRET:-}" ]    && MISSING="$MISSING TS_OAUTH_SECRET"
          [ -z "${PROD_SSH_PRIVATE_KEY:-}" ] && MISSING="$MISSING PROD_SSH_PRIVATE_KEY"
          [ -z "${PROD_TAILNET_FQDN:-}" ]    && MISSING="$MISSING PROD_TAILNET_FQDN"
          if [ "${{ inputs.dry_run }}" = "false" ] && [ -z "${BACKUP_REPO_TOKEN:-}" ]; then
            MISSING="$MISSING BACKUP_REPO_TOKEN"
          fi
          if [ -n "$MISSING" ]; then
            # Fail loud, not fake-green: a missing secret must not exit 0 and look
            # like a successful backup that never ran (review 2026-07-17 M25).
            echo "::error::Missing required prereqs:$MISSING — stage them per #714 then re-run."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Checkout (resolver script; GH-744)
        if: steps.preflight.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Join the tailnet
        if: steps.preflight.outputs.skip != 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags:    tag:gha-deployer
          # Pinned — `version: latest` broke sha256 verification in GHA (May 2026).
          version: 1.96.4

      - name: Install SSH identity for deploy@ (PROD_SSH_PRIVATE_KEY)
        if: steps.preflight.outputs.skip != 'true'
        uses: ./.github/actions/prod-ssh-key
        with:
          ssh_private_key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Resolve prod MagicDNS host (GH-744)
        id: ts_host
        if: steps.preflight.outputs.skip != 'true'
        env:
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          R=$(bash scripts/ops/resolve_prod_tailnet_host.sh)
          echo "resolved_fqdn=$R" >> "$GITHUB_OUTPUT"
          WANT="${{ vars.PROD_TAILNET_FQDN }}"
          if [ "$(printf '%s' "$R" | tr '[:upper:]' '[:lower:]')" != "$(printf '%s' "$WANT" | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::notice::Tailscale live host ($R) differs from vars.PROD_TAILNET_FQDN ($WANT). Using $R for SSH. See PROD_RUNBOOK (suffix drift)."
          fi

      - name: Measure the corpus before pulling it (read-only)
        if: steps.preflight.outputs.skip != 'true'
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
        run: |
          set -euo pipefail
          # WHY: the pull is a single opaque `tar -czf -` over SSH, so a timeout tells you
          # nothing about WHERE the bytes are. The corpus holds transcripts + metadata
          # (small, irreplaceable) alongside media/ (audio, possibly also in the remote
          # archive) and search/ (a LanceDB index that `make index-two-tier` regenerates).
          # If the bulk is media or search, the fix is an exclude, not a bigger timeout.
          # Read-only: du and find only.
          REPORT=$(ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            'cd /srv/podcast-scraper/corpus 2>/dev/null || exit 0
             echo "TOTAL: $(du -sh . 2>/dev/null | cut -f1)"
             for d in media search transcripts metadata; do
               sz=$(find . -type d -name "$d" -prune -exec du -sh {} + 2>/dev/null \
                    | awk "{s+=\$1} END {print NR\" dirs\"}")
               by=$(find . -type d -name "$d" -prune -exec du -sk {} + 2>/dev/null \
                    | awk "{s+=\$1} END {printf \"%.1f GB\", s/1048576}")
               echo "$d: $by across $sz"
             done
             echo "episodes: $(find . -name "*.metadata.json" 2>/dev/null | wc -l | tr -d " ")"' 2>&1)

          echo "$REPORT"
          {
            echo "### Corpus size before pull"
            echo '```'
            echo "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pull corpus from VPS over Tailscale
        if: steps.preflight.outputs.skip != 'true'
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
        run: |
          set -euo pipefail
          PULL_T0=$(date -u +%s)
          # Stream the corpus dir as a tarball over SSH. Unlike `gh codespace cp`
          # this is a single-file streaming operation; if SSH cuts mid-stream the
          # exit code propagates and we fail fast (no half-tarball that passes
          # naive size checks). The VPS bind-mount path is /srv/podcast-scraper/corpus
          # per RFC-082 Decision 4.
          ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            'tar -czf - -C /srv/podcast-scraper corpus' > snapshot.tgz

          PULL_MIN=$(( ( $(date -u +%s) - PULL_T0 ) / 60 ))
          echo "Tarball created: $(du -h snapshot.tgz | cut -f1) in ${PULL_MIN} min"
          {
            echo "### Pull"
            echo "size: $(du -h snapshot.tgz | cut -f1), duration: ${PULL_MIN} min (timeout-minutes: 120)"
          } >> "$GITHUB_STEP_SUMMARY"

          # Sanity: refuse empty / suspiciously small.
          size=$(stat -c%s snapshot.tgz)
          if [ "$size" -lt 1024 ]; then
            echo "::error::Tarball is suspiciously small ($size bytes); aborting." >&2
            exit 1
          fi

          # Sanity: a healthy corpus has at least one .gi.json (per-episode
          # GI insights). Catches "ssh succeeded but corpus dir was empty".
          # NOTE: don't use `grep -q` here — under `set -o pipefail`, grep -q
          # SIGPIPEs tar mid-stream and the pipe exits non-zero even on a
          # successful match. Use `grep -c` (counts; tar runs to completion).
          # Matches the pattern from the codespace workflow (#699 fix).
          gi_in_tar=$(tar -tzf snapshot.tgz | grep -c '\.gi\.json$' || true)
          echo "gi.json entries in tarball: $gi_in_tar"
          if [ "$gi_in_tar" -eq 0 ]; then
            echo "::warning::Tarball has no .gi.json artifacts; corpus likely empty."
            echo "::warning::This is OK for a fresh VPS bootstrap; otherwise investigate."
          fi

      - name: Finalize snapshot manifest
        if: steps.preflight.outputs.skip != 'true' && inputs.dry_run != true
        env:
          GITHUB_SHA: ${{ github.sha }}
          BACKUP_WORKFLOW_NAME: backup-corpus-prod
          BACKUP_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/ops/corpus_snapshot/finalize_backup_bundle.sh snapshot.tgz

      - name: Upload snapshot to backup repo
        if: steps.preflight.outputs.skip != 'true' && inputs.dry_run != true
        env:
          GH_TOKEN:    ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REPO: ${{ vars.PODCAST_BACKUP_REPO || 'chipi/podcast_scraper-backup' }}
        run: |
          set -euo pipefail
          # Tag with -prod suffix so codespace + prod snapshots from the same
          # day don't collide during the parallel-run window.
          TAG="snapshot-prod-$(date -u +%Y%m%d)"
          if gh release view "$TAG" --repo "$BACKUP_REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading asset (will clobber)."
            gh release upload "$TAG" snapshot.tgz snapshot.manifest.json --repo "$BACKUP_REPO" --clobber
          else
            echo "Release $TAG does not exist; creating with asset."
            gh release create "$TAG" snapshot.tgz snapshot.manifest.json \
              --repo "$BACKUP_REPO" \
              --title "Corpus snapshot $TAG (prod VPS)" \
              --notes "Automated daily backup of /srv/podcast-scraper/corpus over Tailscale. Retention 7 daily + 4 weekly."
          fi
          echo "Uploaded snapshot.tgz as release tag $TAG"

      - name: Prune older prod snapshots (keep 7 daily + 4 weekly)
        if: steps.preflight.outputs.skip != 'true' && inputs.dry_run != true
        env:
          GH_TOKEN:    ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REPO: ${{ vars.PODCAST_BACKUP_REPO || 'chipi/podcast_scraper-backup' }}
        run: |
          set -euo pipefail
          # Same retention policy as backup-corpus.yml but scoped to snapshot-prod-
          # tags so we don't touch codespace-era snapshots during cutover overlap.
          mapfile -t TAGS < <(gh release list --repo "$BACKUP_REPO" --limit 200 \
            --json tagName -q '.[].tagName' | grep -E '^snapshot-prod-[0-9]{8}$' || true)
          if [ ${#TAGS[@]} -le 7 ]; then
            echo "Only ${#TAGS[@]} prod release(s); nothing to prune."
            exit 0
          fi
          KEEP_DAILY=("${TAGS[@]:0:7}")
          REMAINDER=("${TAGS[@]:7}")
          KEEP_WEEKLY=()
          for tag in "${REMAINDER[@]}"; do
            d="${tag#snapshot-prod-}"
            wd=$(date -d "$d" +%u 2>/dev/null || true)
            if [ "$wd" = "1" ]; then
              KEEP_WEEKLY+=("$tag")
              [ ${#KEEP_WEEKLY[@]} -ge 4 ] && break
            fi
          done
          KEEP=("${KEEP_DAILY[@]}" "${KEEP_WEEKLY[@]}")
          echo "Keeping: ${KEEP[*]}"
          for tag in "${TAGS[@]}"; do
            keep=false
            for k in "${KEEP[@]}"; do
              [ "$tag" = "$k" ] && keep=true && break
            done
            if [ "$keep" = "false" ]; then
              echo "Pruning $tag"
              gh release delete "$tag" --repo "$BACKUP_REPO" --yes --cleanup-tag || true
            fi
          done

      - name: Dry-run report
        if: steps.preflight.outputs.skip != 'true' && inputs.dry_run == true
        env:
          GH_TOKEN:    ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REPO: ${{ vars.PODCAST_BACKUP_REPO || 'chipi/podcast_scraper-backup' }}
        run: |
          set -euo pipefail
          echo "=== Dry-run mode (prod VPS source) ==="
          echo "Tarball size: $(du -h snapshot.tgz 2>/dev/null | cut -f1 || echo 'NONE')"
          echo "Tarball contents (top-level):"
          tar -tzf snapshot.tgz 2>/dev/null | head -5 || echo "(empty)"
          if [ -n "${GH_TOKEN:-}" ]; then
            echo ""
            echo "Existing snapshot-prod-* releases on $BACKUP_REPO:"
            gh release list --repo "$BACKUP_REPO" --limit 20 \
              --json tagName -q '.[] | .tagName' \
              | grep -E '^snapshot-prod-' || echo "(none yet)"
          fi
          echo ""
          echo "Nothing uploaded (dry_run=true)."

      - name: Emit backup event to VictoriaLogs (Tier-1 o11y, ADR-119)
        # Self-hosted sink over the tailnet (runner already joined above). Fires on
        # success AND failure. Non-fatal — never turns the backup red.
        if: always() && steps.preflight.outputs.skip != 'true'
        uses: ./.github/actions/emit-ops-event
        with:
          event-type: backup
          env: prod
          victorialogs-url: ${{ vars.HOMELAB_VICTORIALOGS_URL }}
          msg: "corpus backup ${{ job.status }}"
          fields: status=${{ job.status }} surface=corpus dry_run=${{ inputs.dry_run }} triggered_by=${{ github.actor }}
