# Ad-hoc live smoke for the public player (#43). Runs the Playwright live smoke
# (web/learning-player/e2e/live) against the DEPLOYED closelistening.app. Read-only vs prod
# (passes the coming-soon gate with the preview basic-auth; never mutates data).
#
# MANUAL ONLY. The post-deploy smoke now runs as a GATING `smoke` job INSIDE deploy-player.yml, so it
# fires on every deploy path — including `deploy-all-prod` (which calls deploy-player as a reusable
# workflow, emitting no `workflow_run` event, so the old auto-trigger here NEVER ran on that path and
# a prod regression shipped unseen). This workflow is kept only for re-running the smoke by hand
# without a redeploy.
name: Smoke player (live)

on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force a failure AFTER the smoke passes, to exercise the GlitchTip alert path (leaves prod untouched).'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: smoke-player
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/learning-player
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/learning-player/package-lock.json
      - run: npm ci
      - name: Install Playwright Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Live smoke vs closelistening.app
        env:
          LIVE_BASE_URL: https://${{ vars.PLAYER_DOMAIN || 'closelistening.app' }}
          PLAYER_PREVIEW_USER: ${{ vars.PLAYER_PREVIEW_USER || 'marko' }}
          # Gate password (preview basic-auth). Without it the gated specs skip; the
          # public coming-soon assertion still runs.
          PLAYER_PREVIEW_PASS: ${{ secrets.PLAYER_PREVIEW_PASS }}
          # Per-user account.live spec: mints a session for the seeded prod test account. Absent →
          # that block skips. Mirrors deploy-player.yml's smoke job so an on-demand dispatch validates
          # the same surface without a redeploy.
          PLAYER_APP_SESSION_SECRET: ${{ secrets.PLAYER_APP_SESSION_SECRET }}
          PLAYER_SMOKE_USER_ID: ${{ vars.PLAYER_SMOKE_USER_ID }}
        run: npm run test:e2e:live
      - name: Simulate failure (GlitchTip alert-path test)
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "simulate_failure=true → forcing a non-zero exit AFTER a passing smoke to exercise"
          echo "the failure() alert path below. Prod was untouched; the real smoke already passed."
          exit 1
      - name: Alert GlitchTip on smoke failure
        if: failure()
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.PROD_SENTRY_DSN_PLAYER_API }}
        run: |
          if [ -z "$SENTRY_DSN" ]; then echo "no GlitchTip DSN — skipping alert"; exit 0; fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SIM="${{ inputs.simulate_failure }}"
          MSG="Live smoke FAILED — player prod (sha ${GITHUB_SHA::7}) — ${RUN_URL}"
          [ "$SIM" = "true" ] && MSG="[ALERT-PATH TEST] ${MSG}"
          npx --yes @sentry/cli@2 send-event \
            --level error \
            --message "$MSG" \
            --tag surface:player \
            --tag stage:standalone-smoke \
            --tag alert_test:"$SIM" || echo "GlitchTip alert failed (non-fatal)"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live-report
          path: web/learning-player/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
