name: Tailscale cleanup (gha-deployer devices)

# Drops stale Tailscale devices left by ephemeral GitHub Actions runners.
# Wraps scripts/ops/cleanup_tailscale_gha_deployers.py with the TS_INFRA_OAUTH_*
# client (devices scope, exchanged for a short-lived API token at run time) +
# TAILNET_NAME var, so the operator (or a workflow on a cron later) can prune the
# tailnet without exporting credentials locally. Idempotent — devices newer than
# ``min_hours`` are never touched.

on:
  workflow_dispatch:
    inputs:
      min_hours:
        description: 'Only delete devices idle for at least this many hours (default 3).'
        required: false
        default: '3'
      dry_run:
        description: 'List candidates without deleting (default false = apply).'
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

permissions:
  contents: read

concurrency:
  group: tailscale-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Pre-flight — required env present?
        env:
          TS_INFRA_OAUTH_CLIENT_ID: ${{ secrets.TS_INFRA_OAUTH_CLIENT_ID }}
          TS_INFRA_OAUTH_SECRET: ${{ secrets.TS_INFRA_OAUTH_SECRET }}
          TAILNET_NAME:  ${{ vars.TAILNET_NAME }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${TS_INFRA_OAUTH_CLIENT_ID:-}" ] && MISSING="$MISSING TS_INFRA_OAUTH_CLIENT_ID"
          [ -z "${TS_INFRA_OAUTH_SECRET:-}" ] && MISSING="$MISSING TS_INFRA_OAUTH_SECRET"
          [ -z "${TAILNET_NAME:-}" ] && MISSING="$MISSING TAILNET_NAME"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing prereqs:$MISSING."
            exit 1
          fi

      - name: Run cleanup
        env:
          TS_INFRA_OAUTH_CLIENT_ID: ${{ secrets.TS_INFRA_OAUTH_CLIENT_ID }}
          TS_INFRA_OAUTH_SECRET: ${{ secrets.TS_INFRA_OAUTH_SECRET }}
          TAILNET_NAME: ${{ vars.TAILNET_NAME }}
          MIN_HOURS:    ${{ github.event.inputs.min_hours }}
          DRY_RUN:      ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          # Exchange the Tailscale OAuth client (devices scope) for a short-lived API token,
          # then hand it to the cleanup script as TS_API_KEY (an OAuth access token is a valid
          # Bearer token). OAuth replaced the expiring TS_API_KEY secret (2026-08-03).
          TS_API_KEY="$(curl -fsS https://api.tailscale.com/api/v2/oauth/token \
            -d "client_id=${TS_INFRA_OAUTH_CLIENT_ID}" \
            -d "client_secret=${TS_INFRA_OAUTH_SECRET}" | jq -r .access_token)"
          export TS_API_KEY
          ARGS=( --min-hours "$MIN_HOURS" )
          if [ "$DRY_RUN" != "true" ]; then
            ARGS+=( --apply )
          fi
          echo "Invoking cleanup with: ${ARGS[*]}"
          python3 scripts/ops/cleanup_tailscale_gha_deployers.py "${ARGS[@]}"
