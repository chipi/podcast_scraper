name: Verify backup restore (compose smoke)

# GitHub #798 — weekly proof that the latest snapshot-prod-* release in
# chipi/podcast_scraper-backup is downloadable, manifest-valid, restorable,
# and readable by the published GHCR stack (ephemeral compose on GHA).
#
# Sister cadence: real-Hetzner DR drill runs Wednesdays 02:00 UTC (#799).
#
# Prerequisites:
#   secrets: BACKUP_REPO_TOKEN (when backup repo is private; else GITHUB_TOKEN)
#   optional: SMOKE_WEBHOOK_URL — Slack/HA alert on failure
#
# See docs/guides/PROD_RUNBOOK.md § Backup status.

on:
  schedule:
    - cron: '0 4 * * 0' # Sundays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  issues: write             # to open / update / close the DR-failure issue (#1999)

concurrency:
  group: verify-backup-restore
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKUP_REPO: chipi/podcast_scraper-backup
      TAG_REGEX: '^snapshot-prod-[0-9]{8}$'
      RESTORE_ROOT: ${{ github.workspace }}/.verify-restore
      VIEWER_PORT: '8090'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Pre-flight — backup repo token
        id: preflight
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${BACKUP_REPO_TOKEN:-}" ]; then
            echo "GH_TOKEN=${BACKUP_REPO_TOKEN}" >> "$GITHUB_ENV"
            echo "token=backup" >> "$GITHUB_OUTPUT"
          else
            echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"
            echo "token=github" >> "$GITHUB_OUTPUT"
            echo "::notice::BACKUP_REPO_TOKEN unset — using GITHUB_TOKEN (must read ${BACKUP_REPO})."
          fi

      - name: Restore latest compatible snapshot (prod layout)
        run: |
          set -euo pipefail
          mkdir -p "${RESTORE_ROOT}"
          export WORKSPACE_DIR="${RESTORE_ROOT}"
          export TAG_REGEX BACKUP_REPO PODCAST_BACKUP_REPO="${BACKUP_REPO}"
          bash scripts/ops/corpus_snapshot/restore_corpus_release.sh --layout prod
          test -d "${RESTORE_ROOT}/corpus"
          echo "corpus_bytes=$(du -sb "${RESTORE_ROOT}/corpus" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Verify restored episode count (#877)
        run: |
          set -euo pipefail
          # Stdlib-only checker (no app deps): distinct (feed,episode) across ALL run dirs
          # vs the app's latest-run-only view. Guards against a snapshot that silently drops
          # episodes (and surfaces the run-scatter that #877 mistook for data loss).
          OUT="$(python3 scripts/ops/corpus_snapshot/count_distinct_episodes.py \
            "${RESTORE_ROOT}/corpus" --json)"
          echo "episode counts: $OUT"
          DISTINCT="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["distinct"])' "$OUT")"
          if [ "$DISTINCT" -lt 1 ]; then
            echo "::error::restored corpus has 0 episodes — backup/restore is broken"
            exit 1
          fi

      - name: Verify appdata backups are restorable (player + operator)
        # The DR proof was corpus-only; user data (playback/notes/favorites + operator
        # prefs/role grants) is NOT regenerable, so prove its backups restore too. Empty
        # appdata (no users yet) is valid — we assert the latest tarball downloads + extracts
        # to the expected dir, not that it has content. Tolerant of a not-yet-created backup
        # (warn+skip); strict once a release exists.
        run: |
          set -euo pipefail
          appdata_root="${RESTORE_ROOT}/appdata"
          mkdir -p "$appdata_root"
          verify_one() {
            surface="$1"
            tag="$(gh release list --repo "${BACKUP_REPO}" --limit 200 \
              --json tagName -q '.[].tagName' | grep -E "^${surface}-appdata-prod-[0-9]{8}$" \
              | sort -r | head -1 || true)"
            if [ -z "$tag" ]; then
              echo "::warning::no ${surface}-appdata-prod-* release yet — skipping ${surface} appdata verify"
              return 0
            fi
            echo "Restoring ${surface} appdata from ${tag}"
            gh release download "$tag" --repo "${BACKUP_REPO}" \
              --pattern "${surface}-appdata.tgz" --dir "$appdata_root" --clobber
            tar -tzf "${appdata_root}/${surface}-appdata.tgz" >/dev/null  # valid gzip tar?
            tar -xzf "${appdata_root}/${surface}-appdata.tgz" -C "$appdata_root"
            if [ ! -d "${appdata_root}/${surface}-appdata" ]; then
              echo "::error::${surface} appdata tarball did not extract the expected dir — restore is broken"
              exit 1
            fi
            echo "${surface} appdata OK ($(du -sh "${appdata_root}/${surface}-appdata" | cut -f1))"
          }
          verify_one player
          verify_one operator

      - name: Write ephemeral compose env
        run: |
          set -euo pipefail
          {
            echo "PODCAST_DOCKER_PROJECT_DIR=${{ github.workspace }}"
            echo "PODCAST_CORPUS_HOST_PATH=${RESTORE_ROOT}/corpus"
            echo "PODCAST_DEFAULT_CORPUS_PATH=/app/output"
            echo "VIEWER_PORT=${VIEWER_PORT}"
            # NOTE (review low/verify-image-skew): this smoke test runs against the
            # floating :main image, NOT the exact sha-<7> image prod is running, so
            # it answers "can we restore + boot some current image?" — not "does the
            # restored corpus work with the DEPLOYED prod binary?". The DR drill
            # (drill-exercise.yml) exercises the real restore→deploy→smoke path
            # against the published image and is the authoritative prod-image check.
            echo "PODCAST_IMAGE_TAG=main"
            echo "PODCAST_ENV=preprod"
            echo "COMPOSE_PROJECT_NAME=verify-restore"
          } > compose/.env.verify-restore

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and start stack (api + viewer)
        run: |
          set -euo pipefail
          COMPOSE="docker compose --env-file compose/.env.verify-restore \
            -f compose/docker-compose.stack.yml \
            -f compose/docker-compose.prod.yml"
          $COMPOSE pull api viewer
          $COMPOSE up -d api viewer

      - name: Post-deploy smoke (localhost)
        run: |
          set -euo pipefail
          # --allow-missing-search (#1999): the snapshot deliberately prunes `search/`
          # (backup-corpus-prod.yml — the LanceDB index is regenerable via `make
          # index-two-tier`), so a restored corpus 404s on topic-clusters CORRECTLY.
          # Every other assertion stays strict: this restore must still prove that
          # episodes and artifacts came back.
          bash scripts/ops/post_deploy_smoke.sh \
            --base-url "http://127.0.0.1:${VIEWER_PORT}" \
            --corpus-path /app/output \
            --allow-missing-search

      - name: Tear down compose stack
        if: always()
        run: |
          set -euo pipefail
          docker compose --env-file compose/.env.verify-restore \
            -f compose/docker-compose.stack.yml \
            -f compose/docker-compose.prod.yml \
            down -v --remove-orphans || true
          # Compose containers wrote files under ${RESTORE_ROOT} as root
          # (uid 0); the runner user (uid 1001) can't ``rm`` them without
          # sudo. GitHub-hosted runners have passwordless sudo. Without
          # this the cleanup step floods the log with "Permission denied"
          # lines and exits 1 (#798 / 2026-06-28 schedule failures).
          sudo rm -rf "${RESTORE_ROOT}" compose/.env.verify-restore

      - name: Webhook alert on failure
        if: failure()
        env:
          SMOKE_WEBHOOK_URL: ${{ secrets.SMOKE_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_WEBHOOK_URL:-}" ]; then
            echo "::notice::SMOKE_WEBHOOK_URL not set; skipping webhook alert."
            exit 0
          fi
          MSG="Backup restore verify (#798): FAILED on \`${GITHUB_SHA:0:7}\` — see verify-backup-restore workflow run."
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"${MSG}\"}" \
            "$SMOKE_WEBHOOK_URL" || echo "::warning::webhook ping failed (non-fatal)"

      # DR verification that fails silently is worse than no DR verification: it reads as
      # "checked and fine". This ran red on 2026-08-23, 08-30 and 09-06 and nobody was told,
      # because the webhook step above is a NO-OP when SMOKE_WEBHOOK_URL is unset — which it
      # is (#1999). An issue needs only GITHUB_TOKEN, so it cannot silently disable itself.
      #
      # Idempotent, mirroring infra-drift.yml: one open issue, updated while the failure
      # persists, auto-closed on the first green run. Manually closing it pauses the
      # notification until the next failure.
      - name: Open / update / close the DR-failure issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
          RUN_URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME:  ${{ job.status }}
        run: |
          set -euo pipefail
          TITLE_PREFIX="DR restore verify failing"
          OPEN_NUM=$(gh issue list --repo "$REPO" --state open \
            --search "in:title \"${TITLE_PREFIX}\"" --json number --limit 1 \
            | jq -r '.[0].number // empty')

          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$OPEN_NUM" ]; then
              echo "restore verify green — closing #${OPEN_NUM}"
              gh issue close "$OPEN_NUM" --repo "$REPO" \
                --comment "Restore verify passed as of $(date -u +%Y-%m-%dT%H:%MZ). Closing automatically. Run: ${RUN_URL}"
            else
              echo "green, no open issue — nothing to do"
            fi
            exit 0
          fi

          BODY_FILE=$(mktemp)
          {
            echo "The weekly disaster-recovery check — restore the prod corpus snapshot and smoke the viewer against it — **failed**."
            echo
            echo "This is the check that tells you a prod backup is actually restorable. Treat a red run as unproven DR until shown otherwise."
            echo
            echo "- Run: ${RUN_URL}"
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- Detected: $(date -u +%Y-%m-%dT%H:%MZ)"
            echo
            echo "## First thing to check"
            echo
            echo "Read the \`Post-deploy smoke (localhost)\` step. Its exit code says which class of failure this is:"
            echo
            echo "| exit | meaning |"
            echo "| --- | --- |"
            echo "| 1 | \`/api/health\` subsystem false or status not ok |"
            echo "| 2 | a corpus surface returned an unexpected 4xx/5xx |"
            echo "| 3 | 2xx but malformed, or empty where populated data was expected |"
            echo
            echo "Exit 3 on \`topic_clusters.json\` specifically should NOT happen any more — \`search/\` is excluded from the snapshot by design and the smoke now runs with \`--allow-missing-search\` (#1999). If it recurs, that flag stopped being passed."
            echo
            echo "---"
            echo
            echo "_Auto-managed by \`verify-backup-restore.yml\`. Updated while the failure persists, auto-closed on the first green run. Closing it manually pauses this until the next failure._"
          } > "$BODY_FILE"

          if [ -n "$OPEN_NUM" ]; then
            echo "updating existing DR issue #${OPEN_NUM}"
            gh issue edit "$OPEN_NUM" --repo "$REPO" --body-file "$BODY_FILE"
            gh issue comment "$OPEN_NUM" --repo "$REPO" \
              --body "Still failing on a later run. Run: ${RUN_URL}"
          else
            echo "opening new DR issue"
            gh issue create --repo "$REPO" \
              --title "${TITLE_PREFIX}: $(date -u +%Y-%m-%d)" \
              --body-file "$BODY_FILE" \
              --label "incident-prevention" 2>&1 || \
            gh issue create --repo "$REPO" \
              --title "${TITLE_PREFIX}: $(date -u +%Y-%m-%d)" \
              --body-file "$BODY_FILE"
          fi
          rm -f "$BODY_FILE"
