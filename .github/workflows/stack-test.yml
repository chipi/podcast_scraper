name: Stack test

# End-to-end stack-test against the Docker compose stack.
#
# Single sequence: build images → bring up api + viewer + mock-feeds →
# seed feeds.spec.yaml + viewer_operator.yaml into the corpus_data
# volume → run Playwright (smoke + full UI flow). The full UI flow
# spec drives the API job factory, which spawns one-shot
# ``docker compose run pipeline`` containers that produce the corpus
# artifacts the smoke + UI assertions then validate.
#
# Profile: ``airgapped_thin`` (Whisper tiny.en, transformers
# bart-base + led-base, spaCy en_core_web_sm; no cloud calls).
#
# Cloud-thin (OpenAI Whisper + Gemini providers) is **local-only** —
# we don't run it on public CI to avoid recurring API costs on every
# push / nightly. ``make stack-test-build-cloud`` plus
# ``make stack-test-seed STACK_TEST_OPERATOR_VARIANT=cloud-thin`` plus
# ``STACK_TEST_OPERATOR_PROFILE=cloud_thin make stack-test-playwright``
# exists for developers to validate the cloud path against their own
# ``.env`` keys before pushing changes that touch ``[llm]`` extras /
# Gemini providers / OpenAI Whisper.

on:
  # Sequential next gate: only run after the upstream "Python application"
  # workflow has completed successfully on the same branch + SHA. The two
  # workflows used to run in parallel on every push, but stack-test's Docker
  # build path tripping on a viewer or Python regression that ``Python
  # application`` would have caught was wasteful (and surfaced the failure
  # twice in the PR view). Running stack-test only after Python application
  # succeeds keeps it as a true post-Python integration gate.
  workflow_run:
    workflows: ["Python application"]
    types: [completed]
    branches: [main, release/2.4, release/2.5, release/2.6]
  workflow_dispatch:

permissions:
  # ``workflow_run`` events run with the upstream's permissions context;
  # be explicit so this still works if the upstream tightens its own.
  # The ``publish`` job below adds its own narrower ``packages: write``
  # at the job level to keep ``stack-test`` from carrying that scope.
  contents: read
  actions: read
  checks: write

# Cancel an in-progress Stack test for the same (workflow, ref) when a
# newer Python application run completes on the same branch. Without
# this, every successful Python app run queues a Stack test independent
# of whether the next commit already invalidated it — and Stack test is
# expensive (~1h, ML preload + full compose). Match the CI-side
# cancel-in-progress pattern; deploy / release / backup workflows
# explicitly keep ``cancel-in-progress: false``.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  stack-test:
    runs-on: ubuntu-latest
    # Skip when the upstream "Python application" run did not succeed
    # (workflow_run fires on completion regardless of conclusion).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      # ``STACK_PIPELINE_PRELOAD_ML`` is intentionally NOT set here. The
      # ``make stack-test-build`` recipe forces it to ``true`` (Makefile)
      # because the ``airgapped_thin`` profile expects the ML model
      # cache to be baked into the pipeline image — without it the
      # pipeline subprocess errors at Transformers load time. Setting
      # ``false`` here used to override the recipe and ship a useless
      # image; the Makefile is now the single source of truth.
      STACK_TEST_VIEWER_PORT: 8090
      STACK_TEST_BASE_URL: http://127.0.0.1:8090
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run runs against the default branch by default; pin to
          # the upstream's SHA so a subsequent push doesn't shift this run
          # off-target. ``workflow_dispatch`` falls back to default ref.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Free disk space
        # #703: existing dotnet/android/ghc/linuxbrew removal (~16 GB) is not
        # enough for the cold pipeline (ml) image build (~15.5 GB). Add
        # /opt/hostedtoolcache (CodeQL, Java, etc.) — ~10-15 GB more — and
        # apt list cleanup. The stack-test-build step is all docker; we
        # don't need any hosted-tool runtimes for it.
        run: |
          echo "before:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /home/linuxbrew/.linuxbrew \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          docker image prune -af || true
          echo "after:"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build stack images
        run: make stack-test-build

      - name: Bring up api + viewer + mock-feeds
        run: make stack-test-up

      - name: Wait for /api/health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8090/api/health" >/dev/null; then
              echo "health ok"
              exit 0
            fi
            sleep 2
          done
          echo "timeout waiting for /api/health"
          exit 1

      - name: Seed corpus_data volume (feeds.spec.yaml + viewer_operator.yaml, ml variant)
        run: make stack-test-seed

      - name: Run Playwright (smoke + full UI flow)
        run: make stack-test-playwright

      - name: Dump compose logs on failure
        if: failure()
        run: |
          echo "::group::api container logs"
          docker compose -f compose/docker-compose.stack.yml -f compose/docker-compose.stack-test.yml logs --no-color --tail=400 api || true
          echo "::endgroup::"
          echo "::group::viewer container logs"
          docker compose -f compose/docker-compose.stack.yml -f compose/docker-compose.stack-test.yml logs --no-color --tail=200 viewer || true
          echo "::endgroup::"
          # Pipeline runs as a one-shot ``docker compose run --rm pipeline …``
          # container spawned by the API job factory; ``--rm`` removes it the
          # moment it exits, so ``docker compose logs pipeline`` prints
          # nothing here. Fetch the captured subprocess stderr/stdout from
          # the API instead — it persists job logs and exposes them via
          # ``GET /api/jobs/<id>/log`` (and ``…/subprocess-log``). This
          # surfaces the actual pipeline ``exit_code_1`` reason in the
          # workflow log.
          echo "::group::pipeline subprocess logs (via /api/jobs/<id>/log)"
          API_BASE="${STACK_TEST_BASE_URL:-http://127.0.0.1:8090}"
          CORPUS_PATH="$(printf %s '/app/output' | jq -sRr @uri)"
          jobs_json="$(curl -fsS "${API_BASE}/api/jobs?path=${CORPUS_PATH}" 2>/dev/null || echo '{}')"
          job_ids="$(printf %s "${jobs_json}" | jq -r '.jobs // [] | .[] | .job_id' 2>/dev/null || true)"
          if [ -z "${job_ids}" ]; then
            echo "(no jobs reported by /api/jobs)"
          else
            echo "${job_ids}" | while IFS= read -r jid; do
              [ -n "${jid}" ] || continue
              echo "----- job ${jid} status -----"
              curl -fsS "${API_BASE}/api/jobs/${jid}?path=${CORPUS_PATH}" 2>/dev/null \
                | jq -r '. | "status=\(.status // "?")\nexit_code=\(.exit_code // "?")\nerror_reason=\(.error_reason // "")\nstarted_at=\(.started_at // "")\nfinished_at=\(.finished_at // "")"' \
                || echo "(failed to read job ${jid} status)"
              echo "----- job ${jid} subprocess log (full) -----"
              curl -fsS "${API_BASE}/api/jobs/${jid}/log?path=${CORPUS_PATH}" 2>/dev/null \
                || echo "(failed to read /api/jobs/${jid}/log)"
              echo "----- end job ${jid} -----"
            done
          fi
          echo "::endgroup::"

      - name: Tear down compose stack
        if: always()
        run: make stack-test-down || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: stack-test-playwright-report
          path: tests/stack-test/playwright-report
          if-no-files-found: ignore

  # ============================================================
  # publish — gated on stack-test success on main.
  #
  # Pushes api / viewer / learning-app / pipeline-llm / obs to GHCR, each
  # with two tags:
  #   * :main         — the always-track-latest-green-main tag
  #   * :sha-<short>  — for incident-response pinning + rollback
  #
  # MODULARITY (2026-08-20): this was ONE job that built all four
  # images sequentially in a single shell. A hang in any one build
  # (the learning-app arm64 emulation build wedged for the full 6h
  # GitHub job cap on 2026-08-20) black-boxed the rest — the later
  # builds never ran and the whole job burned to the ceiling. It is
  # now a build MATRIX: one leg per image, ``fail-fast: false`` so a
  # bad leg cannot cancel its siblings, and a per-leg
  # ``timeout-minutes`` so a wedged build fails fast instead of at 6h.
  #
  # AMD64-ONLY (2026-08-20): these images are consumed ONLY by the
  # prod VPS, which is amd64 (Hetzner ``cx43`` — see
  # infra/terraform/variables.tf). The operator's Apple-Silicon Mac
  # builds these images NATIVELY from source for local work
  # (``make stack-test-build`` off compose/docker-compose.stack.yml),
  # so it never pulls arm64 from GHCR. Nothing consumes the arm64
  # variant, and building it under QEMU emulation (a Vite/npm build
  # for learning-app especially) is what wedged for 6h. So we build
  # amd64 only and drop the ``setup-qemu-action``.
  #   FUTURE — if prod ever migrates to a Hetzner CAX (ARM Ampere)
  #   target, re-introduce arm64 by adding a NATIVE arm64 runner leg
  #   (``runs-on: ubuntu-24.04-arm``, GA since 2025) — never QEMU
  #   emulation, which is what caused the 6h hang.
  #
  # NEVER pushes pipeline-ml — that image bakes in models with
  # restrictive licenses (Llama 3.2 community license) and is
  # built on CI runners only for stack-test consumption.
  # See RFC-081 §Layer 1 for the published-image-set decision.
  #
  # Each image is built amd64/--load first, runs the no-secrets-in-image
  # assertion (scripts/check/no-secrets-in-image.sh), and then gets the
  # two tags pushed only after the assertion passes.
  # ============================================================
  publish:
    needs: stack-test
    runs-on: ubuntu-latest
    # Strict gate: only on main pushes (workflow_run from main) AND
    # when stack-test succeeded AND in the canonical repo (avoid
    # forks accidentally pushing).
    if: |
      github.repository == 'chipi/podcast_scraper'
      && github.ref == 'refs/heads/main'
      && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
        || github.event_name == 'workflow_dispatch'
      )
    permissions:
      contents: read
      packages: write
    # One leg per image. fail-fast:false so a wedged/failed leg (e.g.
    # learning-app) does NOT cancel the siblings — api/viewer/pipeline
    # still publish. Each leg is bounded so a hang fails at 45m, not 6h.
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            repo: podcast-scraper-stack-api
            context: "."
            dockerfile: docker/api/Dockerfile
            cache_scope: publish-api
          - image: viewer
            repo: podcast-scraper-stack-viewer
            context: "."
            dockerfile: docker/viewer/Dockerfile
            cache_scope: publish-viewer
          - image: learning-app
            repo: podcast-scraper-learning-app
            context: web/learning-player
            dockerfile: ""
            cache_scope: publish-learning-app
          - image: pipeline-llm
            repo: podcast-scraper-stack-pipeline-llm
            context: "."
            dockerfile: docker/pipeline/Dockerfile
            cache_scope: publish-pipeline-llm
          # The observability-control-plane MCP (#803). Consumed by the prod VPS
          # (amd64) just like the rest — folded in here (retiring the standalone
          # obs-image.yml) so the whole deployable MCP family builds in one place.
          # NOTE: this drops what obs-image.yml published — the `:latest` + long-`:sha` tags AND
          # the arm64 variant. podcast-obs now ships amd64-only as `:main`/`:sha-<7>`, like the
          # rest of the family (nothing in-repo or on the homelab pulls :latest/arm64; a local
          # Mac build is native + from source). Re-add arm64 on a native runner only if a consumer needs it.
          - image: obs
            repo: podcast-obs
            context: "."
            dockerfile: docker/observability/Dockerfile
            cache_scope: publish-obs
    timeout-minutes: 45
    env:
      REGISTRY: ghcr.io
      OWNER: chipi
      DOCKER_BUILDKIT: 1
      # All build-arg inputs live here (secrets + vars); the build step
      # injects only the ones the matrix image needs. GitHub leaves the
      # rest empty, which is a no-op. Secrets are NEVER placed in the
      # matrix include (that would print them in logs).
      # ⚠ GOTCHA (2026-07-22): the browser @sentry SDK's DSN parser uses \w+
      # for the public key (NO dashes), so a GlitchTip dashed-UUID key is
      # rejected as "Invalid Dsn" → transport disabled → errors silently
      # dropped. Use the DASHLESS key here. The Python SDK accepts both.
      VITE_SENTRY_DSN_VIEWER: ${{ secrets.VITE_SENTRY_DSN_VIEWER }}
      VITE_SENTRY_DSN_PLAYER: ${{ secrets.VITE_SENTRY_DSN_PLAYER }}
      # Umami analytics ids are PUBLIC (they ship in the bundle) → GH vars.
      OPERATOR_UMAMI_SRC: ${{ vars.OPERATOR_UMAMI_SRC }}
      OPERATOR_UMAMI_WEBSITE_ID: ${{ vars.OPERATOR_UMAMI_WEBSITE_ID }}
      PLAYER_UMAMI_SRC: ${{ vars.PLAYER_UMAMI_SRC }}
      PLAYER_UMAMI_WEBSITE_ID: ${{ vars.PLAYER_UMAMI_WEBSITE_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Two amd64 buildx invocations (no arm64 → no QEMU):
      #   1. --load so the no-secrets-in-image script can ``docker run``
      #      against a real local image.
      #   2. --push both tags directly to GHCR. Cache from step 1 makes
      #      this near-instant.
      - name: "Build + assert + push (${{ matrix.image }}, amd64)"
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.repo }}
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
          CACHE_SCOPE: ${{ matrix.cache_scope }}
          CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          MATRIX_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail

          # Per-image build-args (secrets/vars come from the job env).
          BUILD_ARGS=()
          case "${MATRIX_IMAGE}" in
            viewer)
              BUILD_ARGS+=(--build-arg "VITE_SENTRY_DSN_VIEWER=${VITE_SENTRY_DSN_VIEWER}")
              BUILD_ARGS+=(--build-arg "VITE_UMAMI_SRC=${OPERATOR_UMAMI_SRC}")
              BUILD_ARGS+=(--build-arg "VITE_UMAMI_WEBSITE_ID=${OPERATOR_UMAMI_WEBSITE_ID}")
              BUILD_ARGS+=(--build-arg "VITE_PODCAST_RELEASE=podcast-scraper@sha-${SHORT_SHA}")
              ;;
            learning-app)
              BUILD_ARGS+=(--build-arg "VITE_SENTRY_DSN_PLAYER=${VITE_SENTRY_DSN_PLAYER}")
              BUILD_ARGS+=(--build-arg "VITE_UMAMI_SRC=${PLAYER_UMAMI_SRC}")
              BUILD_ARGS+=(--build-arg "VITE_UMAMI_WEBSITE_ID=${PLAYER_UMAMI_WEBSITE_ID}")
              ;;
            pipeline-llm)
              # INSTALL_EXTRAS=llm = cloud-thin variant (OpenAI/Gemini SDKs).
              # PRELOAD_ML_MODELS=false because this image has no local ML models.
              BUILD_ARGS+=(--build-arg "INSTALL_EXTRAS=llm")
              BUILD_ARGS+=(--build-arg "PRELOAD_ML_MODELS=false")
              ;;
          esac

          # learning-app builds from a context dir with its own Dockerfile;
          # the others pass an explicit -f.
          DF_ARGS=()
          if [ -n "${DOCKERFILE}" ]; then
            DF_ARGS+=(-f "${DOCKERFILE}")
          fi

          docker buildx build \
            --platform linux/amd64 \
            --tag "${IMAGE}:build-${SHORT_SHA}" \
            --load \
            --cache-from "type=gha,scope=${CACHE_SCOPE}" \
            --cache-to "type=gha,scope=${CACHE_SCOPE},mode=max" \
            "${BUILD_ARGS[@]}" "${DF_ARGS[@]}" "${CONTEXT}"

          scripts/check/no-secrets-in-image.sh "${IMAGE}:build-${SHORT_SHA}"

          # obs is NOT exercised by the stack-test job (it's not in the compose stack), so it
          # keeps the smoke the standalone obs-image.yml used to run — the CLI + a verb that
          # degrades cleanly with no backends. The other 4 images are smoked by stack-test.
          if [ "${MATRIX_IMAGE}" = "obs" ]; then
            docker run --rm "${IMAGE}:build-${SHORT_SHA}" --help | grep -q "surface"
            docker run --rm "${IMAGE}:build-${SHORT_SHA}" summary | grep -q '"target"'
          fi

          docker buildx build \
            --platform linux/amd64 \
            --tag "${IMAGE}:main" \
            --tag "${IMAGE}:sha-${SHORT_SHA}" \
            --push \
            --cache-from "type=gha,scope=${CACHE_SCOPE}" \
            --cache-to "type=gha,scope=${CACHE_SCOPE},mode=max" \
            "${BUILD_ARGS[@]}" "${DF_ARGS[@]}" "${CONTEXT}"

  # ============================================================
  # verify-manifests — a single gate after all publish legs.
  #
  # ``needs: publish`` waits for every matrix leg; with
  # ``fail-fast: false`` a failed leg leaves the workflow red (correct)
  # while the successful legs still published. This job asserts the
  # amd64 image + both tags actually landed for each published image.
  # ============================================================
  verify-manifests:
    needs: publish
    runs-on: ubuntu-latest
    if: |
      github.repository == 'chipi/podcast_scraper'
      && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    env:
      REGISTRY: ghcr.io
      OWNER: chipi
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Verify amd64 manifests
        env:
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
        run: |
          set -euo pipefail
          # Assert each pushed :sha-<short> manifest exists and lists
          # linux/amd64. amd64-only by design (see the publish job header);
          # if a CAX/arm64 target is ever added, extend this to arm64 too.
          IMAGES="podcast-scraper-stack-api podcast-scraper-stack-viewer podcast-scraper-learning-app podcast-scraper-stack-pipeline-llm podcast-obs"
          for NAME in $IMAGES; do
            IMAGE="${REGISTRY}/${OWNER}/${NAME}"
            echo "==> Inspecting ${IMAGE}:sha-${SHORT_SHA}"
            MANIFEST=$(docker buildx imagetools inspect "${IMAGE}:sha-${SHORT_SHA}" --raw)
            if ! echo "$MANIFEST" | grep -q "\"architecture\": \"amd64\""; then
              echo "::error::${IMAGE}:sha-${SHORT_SHA} missing linux/amd64 in manifest"
              echo "$MANIFEST"
              exit 1
            fi
            echo "  ${IMAGE}:sha-${SHORT_SHA} OK (amd64)"
          done

      - name: Summary
        run: |
          set -euo pipefail
          SHORT="${{ steps.tags.outputs.short_sha }}"
          {
            echo "## GHCR publish complete (amd64)"
            echo ""
            echo "Pushed five images with tags \`:main\` + \`:sha-${SHORT}\`,"
            echo "each linux/amd64 — the arch the prod VPS (Hetzner cx43) pulls."
            echo ""
            echo "* \`ghcr.io/${OWNER}/podcast-scraper-stack-api:main\`"
            echo "* \`ghcr.io/${OWNER}/podcast-scraper-stack-viewer:main\`"
            echo "* \`ghcr.io/${OWNER}/podcast-scraper-learning-app:main\`"
            echo "* \`ghcr.io/${OWNER}/podcast-scraper-stack-pipeline-llm:main\`"
            echo "* \`ghcr.io/${OWNER}/podcast-obs:main\`  (observability MCP, #803)"
            echo ""
            echo "arm64 is intentionally NOT built here: nothing consumes it"
            echo "(the Mac builds natively from source; the VPS is amd64). If a"
            echo "Hetzner CAX/ARM target is ever added, re-introduce arm64 on a"
            echo "native \`ubuntu-24.04-arm\` runner — never QEMU emulation."
            echo ""
            echo "The \`pipeline-ml\` image (with HuggingFace cache + SummLlama)"
            echo "is intentionally NOT published — RFC-081 §Layer 1 license"
            echo "decision; never redistribute restricted-license model bundles."
          } >> "$GITHUB_STEP_SUMMARY"
