name: Sweep prod local audio into cold (on demand)

# ┌─────────────────────────────────────────────────────────────────────────────────────────┐
# │ DEPLOYING AND SOMETHING IS RED? READ docs/guides/DEPLOY_GOTCHAS.md FIRST.                │
# └─────────────────────────────────────────────────────────────────────────────────────────┘
#
# WHY THIS EXISTS (2026-08-21).
#
# Reclaiming local episode audio the cold archive already holds is real maintenance — it is what
# keeps the prod disk from filling, and it is what recovers audio a crashed run stranded (#1787).
# Until today it ran automatically at the START OF EVERY PIPELINE RUN, and that was the defect.
#
# `run_pipeline` called the corpus-wide sweep three lines ABOVE `_fetch_and_prepare_episodes` —
# the function that applies `--reprocess-episode-ids`. So it ran before the process knew which
# episodes it had been asked about, and could not have used the answer anyway: `sweep_corpus`
# takes no episode argument. A repair dispatched for ONE episode walked all 678, one rclone round
# trip each, and sat silent for ~16 minutes before being killed. Twice.
#
# The stack, taken from the live hung container with SIGABRT via stop-prod-pipeline.yml:
#
#     orchestration.py:1852   _maybe_sweep_orphaned_audio
#     archive/offload.py:233  sweep_corpus
#     archive/backfill.py:320 already_archived
#     storage_backend.py:238  _rclone
#     subprocess.py:1209      communicate            <- blocked here
#
# Three properties made it invisible rather than loud: it is wrapped in try/except by design
# ("a reclaim step must never break the run start"), so it could only ever be slow, never fail;
# it reported nothing until it finished, so sixteen minutes of work and a wedged process looked
# identical; and it ran before the selection gate, so its cost was unrelated to what was asked.
#
# The work is unchanged and still wanted. Only the trigger moved: an operator asks for it, here.
#
# COST IS INHERENT. One backend round trip per episode is what the safety guard requires — an
# episode is only deleted when cold confirms the same key AND the same byte size. That is
# precisely why it belongs behind a deliberate dispatch rather than in front of one. Expect this
# to take minutes on a full corpus; it prints per-run-dir progress so you can watch it move.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "SWEEP" to run against the live prod corpus'
        required: true
      dry_run:
        description: >-
          Report what WOULD be reclaimed and delete nothing. Defaults to true and should stay
          true for the first run after any archive change — the output tells you the split
          between "confirmed in cold" and "kept" before anything is removed.
        type: boolean
        default: true
      timeout_minutes:
        description: >-
          Job bound. The remote `timeout` is set a minute shorter so the BOX kills the container;
          killing only the Actions job leaves the container running, which is exactly how an
          orphan survived 14 minutes on 2026-08-21 and blocked the next run on the corpus lock.
        default: "60"

concurrency:
  # ONE toucher of the prod corpus at a time — shared with reprocess-prod, inspect-prod-corpus
  # and the backups. This DELETES media files; overlapping it with a backup produced
  # "file changed as we read it" before, and overlapping it with a repair would race the very
  # audio that repair is about to read.
  group: prod-corpus
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes || '60') }}
    steps:
      - name: Confirm
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "SWEEP" ]; then
            echo "::error::confirm must be exactly SWEEP (got '${{ github.event.inputs.confirm }}')"
            exit 1
          fi

      - name: Pre-flight — required secrets/variables present?
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${TS_OAUTH_CLIENT_ID:-}" ]    && MISSING="$MISSING TS_OAUTH_CLIENT_ID"
          [ -z "${TS_OAUTH_SECRET:-}" ]       && MISSING="$MISSING TS_OAUTH_SECRET"
          [ -z "${PROD_SSH_PRIVATE_KEY:-}" ]  && MISSING="$MISSING PROD_SSH_PRIVATE_KEY"
          [ -z "${PROD_TAILNET_FQDN:-}" ]     && MISSING="$MISSING PROD_TAILNET_FQDN"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required prereqs:$MISSING"
            exit 1
          fi

      - name: Checkout (resolver script)
        uses: actions/checkout@v7

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-deployer
          # Pinned — `version: latest` broke sha256 verification in GHA (May 2026).
          version: 1.96.4

      - name: Install SSH identity for deploy@ (PROD_SSH_PRIVATE_KEY)
        uses: ./.github/actions/prod-ssh-key
        with:
          ssh_private_key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Resolve prod MagicDNS host (GH-744)
        id: ts_host
        env:
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          R=$(bash scripts/ops/resolve_prod_tailnet_host.sh)
          echo "resolved_fqdn=$R" >> "$GITHUB_OUTPUT"

      - name: Refuse to sweep while a pipeline run is live
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
        run: |
          set -euo pipefail
          # The concurrency group covers workflows; it does not cover a container an operator
          # started by hand, or one an earlier killed job orphaned. Deleting media out from under
          # a live run would take the audio it is mid-way through reading.
          N=$(ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "docker ps --filter name=pipeline -q | wc -l | tr -d ' '")
          echo "live pipeline containers: ${N}"
          if [ "${N}" != "0" ]; then
            echo "::error::a pipeline container is running — sweeping now could delete audio it is reading. Wait for it, or stop it with stop-prod-pipeline.yml."
            exit 1
          fi

      - name: Sweep
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          TIMEOUT_MINUTES: ${{ github.event.inputs.timeout_minutes || '60' }}
        run: |
          set -euo pipefail

          DRY_ARGS=""
          if [ "${DRY_RUN}" = "true" ]; then
            DRY_ARGS="--dry-run"
            echo "mode      : DRY RUN — nothing will be deleted"
          else
            echo "mode      : LIVE — confirmed-in-cold local audio WILL be deleted"
          fi

          # LOGS SURVIVE THE KILL — same reasoning as reprocess-prod.yml. GitHub withholds a
          # step's output until the step ENDS and discards it on cancel, so a killed job loses
          # everything; the box-local copy is readable whatever happens here, via
          # inspect-prod-corpus.yml's `reprocess_log` input.
          REMOTE_LOG="/srv/podcast-scraper/logs/sweep-$(date -u +%Y%m%dT%H%M%SZ).log"
          echo "remote log: ${REMOTE_LOG}"

          REMOTE_TIMEOUT_S=$(( (TIMEOUT_MINUTES - 1) * 60 ))
          echo "remote timeout: ${REMOTE_TIMEOUT_S}s (job bound ${TIMEOUT_MINUTES}m)"

          ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "set -o pipefail; \
             cd /srv/podcast-scraper && \
             mkdir -p /srv/podcast-scraper/logs && \
             command -v timeout >/dev/null 2>&1 || { \
               echo 'FATAL: timeout(1) is not on this box — refusing to start an UNBOUNDED run'; \
               exit 1; \
             }; \
             timeout --signal=TERM --kill-after=120 ${REMOTE_TIMEOUT_S} \
             docker compose --env-file .env \
               -f compose/docker-compose.stack.yml \
               -f compose/docker-compose.prod.yml \
               -f compose/docker-compose.vps-prod.yml \
               run --rm -e PYTHONUNBUFFERED=1 pipeline-llm \
               python -m podcast_scraper.cli archive sweep \
                 --corpus /app/output \
                 --rclone-remote audioarchive \
                 ${DRY_ARGS} 2>&1 | tee -a '${REMOTE_LOG}'"

      - name: Disk after
        if: always()
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
        run: |
          set -euo pipefail
          # The point of the sweep is reclaimed bytes, so report them rather than trusting the
          # run's own summary.
          ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
            "df -h /srv | tail -1; \
             echo -n 'corpus media/ total: '; \
             du -sh /srv/podcast-scraper/corpus 2>/dev/null | cut -f1" \
            | tee -a "$GITHUB_STEP_SUMMARY"
