name: Inspect prod corpus (read-only)

# Read-only measurement of the live prod corpus: the integrity gate, the preprocessing
# audit, and (opt-in) the repair work-list. No artifact is rewritten.
#
# WHY THIS EXISTS
# Every read-only step of CORPUS_INTEGRITY_REPAIR_RUNBOOK.md — the baselines that say whether
# a repair is needed, and the post-run checks that say whether it worked — had no execution
# path on prod. `reprocess-prod.yml` was the ONLY workflow that ran corpus tooling on the box,
# and it is the expensive WRITE step. So the cheap measurements needed a human shell while the
# money step was one click, which is backwards, and it is why the prep sheet's two headline
# questions (how many placeholders? how much was transcribed from unpreprocessed audio?) sat
# UNVERIFIED against production.
#
# It also removes the operator-SSH dependency: this runs as tag:gha-deployer, which the tailnet
# ACL grants tag:prod:22 independently of whichever device the operator is sitting at.
#
# Reports land in the run summary, so a baseline is a durable artifact attached to a run rather
# than terminal scrollback that has to be pasted somewhere to survive.

on:
  workflow_dispatch:
    inputs:
      checks:
        description: "Which measurements to run"
        type: choice
        options:
          - all
          - gi_integrity
          - preprocessing_audit
        default: all
      write_worklist:
        description: >-
          Also write <corpus>/preprocessing_repair_worklist.txt (the --reprocess-episode-ids
          file reprocess-prod.yml defaults to). This is the ONLY thing here that writes, and it
          writes a work-list, never a corpus artifact. Read the file before running the repair:
          its length is the ASR bill.
        type: boolean
        default: false
      verify_recent_runs:
        description: >-
          Post-repair check. The audit's damage rule reads attempts==0 as NOT damaged, which is
          correct for a run that never attempted preprocessing and WRONG as an exit criterion:
          a repair served entirely from the transcript cache also records attempts==0 and is
          indistinguishable from healthy while having repaired nothing. This asserts POSITIVELY
          against recently-written metrics.json — attempts>=1, completed==attempts.
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    # Same environment as the other prod workflows so the tailnet + SSH secrets resolve.
    # Read-only, so this gate is about credential scope, not about guarding a mutation.
    environment: prod
    steps:
      - name: Pre-flight — required secrets/variables present?
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -z "${TS_OAUTH_CLIENT_ID:-}" ]    && MISSING="$MISSING TS_OAUTH_CLIENT_ID"
          [ -z "${TS_OAUTH_SECRET:-}" ]       && MISSING="$MISSING TS_OAUTH_SECRET"
          [ -z "${PROD_SSH_PRIVATE_KEY:-}" ]  && MISSING="$MISSING PROD_SSH_PRIVATE_KEY"
          [ -z "${PROD_TAILNET_FQDN:-}" ]     && MISSING="$MISSING PROD_TAILNET_FQDN"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required prereqs:$MISSING"
            exit 1
          fi

      - name: Checkout (resolver script)
        uses: actions/checkout@v7

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-deployer
          # Pinned — `version: latest` broke sha256 verification in GHA (May 2026).
          version: 1.96.4

      - name: Install SSH identity for deploy@ (PROD_SSH_PRIVATE_KEY)
        uses: ./.github/actions/prod-ssh-key
        with:
          ssh_private_key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Resolve prod MagicDNS host (GH-744)
        id: ts_host
        env:
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          R=$(bash scripts/ops/resolve_prod_tailnet_host.sh)
          echo "resolved_fqdn=$R" >> "$GITHUB_OUTPUT"

      - name: Measure (read-only)
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
          CHECKS: ${{ github.event.inputs.checks }}
          WRITE_WORKLIST: ${{ github.event.inputs.write_worklist }}
          VERIFY_RECENT: ${{ github.event.inputs.verify_recent_runs }}
        run: |
          set -euo pipefail

          # Run INSIDE pipeline-llm, matching reprocess-prod.yml. The host has the repo but the
          # python environment lives in the image, so a host-side `make` target would not run.
          # /app/output is PODCAST_DEFAULT_CORPUS_PATH — the container's view of the corpus.
          remote() {
            ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
              "cd /srv/podcast-scraper && docker compose --env-file .env \
                 -f compose/docker-compose.stack.yml \
                 -f compose/docker-compose.prod.yml \
                 -f compose/docker-compose.vps-prod.yml \
                 run --rm --entrypoint python pipeline-llm -c \"$1\""
          }

          SUMMARY="$GITHUB_STEP_SUMMARY"
          echo "## Prod corpus inspection (read-only)" >> "$SUMMARY"
          echo "" >> "$SUMMARY"

          # Findings are the EXPECTED state before a repair, so a finding must not fail this
          # workflow — that would make the measurement tool unusable exactly when it matters.
          # Only an execution error fails it. The verdict is printed either way.
          if [ "${CHECKS}" = "all" ] || [ "${CHECKS}" = "gi_integrity" ]; then
            echo "### GI integrity gate" >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            remote "import sys; from pathlib import Path; from podcast_scraper.gi.integrity import check_corpus_gi_integrity; ok, report = check_corpus_gi_integrity(Path('/app/output')); print(report); print('VERDICT:', 'PASS' if ok else 'FAIL')" \
              2>&1 | tee -a "$SUMMARY"
            echo '```' >> "$SUMMARY"
            echo "" >> "$SUMMARY"
          fi

          if [ "${CHECKS}" = "all" ] || [ "${CHECKS}" = "preprocessing_audit" ]; then
            echo "### Preprocessing audit" >> "$SUMMARY"
            echo '```' >> "$SUMMARY"
            remote "import sys; from pathlib import Path; from podcast_scraper.preprocessing.audit import check_corpus_preprocessing; ok, report = check_corpus_preprocessing(Path('/app/output')); print(report); print('VERDICT:', 'PASS' if ok else 'FAIL')" \
              2>&1 | tee -a "$SUMMARY"
            echo '```' >> "$SUMMARY"
            echo "" >> "$SUMMARY"
          fi

          if [ "${WRITE_WORKLIST}" = "true" ]; then
            {
              echo "### Repair work-list"
              echo '```'
            } >> "$SUMMARY"
            remote "from pathlib import Path; from podcast_scraper.preprocessing.audit import write_work_list; n = write_work_list(Path('/app/output'), Path('/app/output/preprocessing_repair_worklist.txt')); print(f'{n} episode(s) written to /app/output/preprocessing_repair_worklist.txt')" \
              2>&1 | tee -a "$SUMMARY"
            {
              echo '```'
              echo ""
              echo "Feed this to reprocess-prod.yml — it is that workflow's default episode_ids_file."
              echo ""
            } >> "$SUMMARY"
          fi

          if [ "${VERIFY_RECENT}" = "true" ]; then
            {
              echo "### Recent run metrics (positive assertion)"
              echo "attempts>=1 and completed==attempts. All zeros means the transcript cache served it and nothing was repaired."
              echo '```'
            } >> "$SUMMARY"
            ssh -i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$SSH_TARGET" \
              "find /srv/podcast-scraper/corpus -name metrics.json -newermt '-6 hours' \
                 -exec sh -c 'echo \"\$1: \$(jq -c \"{attempts: .preprocessing_attempts, completed: .preprocessing_count, transcribed: .transcribe_count}\" \"\$1\")\"' _ {} \; \
               | head -50" 2>&1 | tee -a "$SUMMARY"
            echo '```' >> "$SUMMARY"
          fi
