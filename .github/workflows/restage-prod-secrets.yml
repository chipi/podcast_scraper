# Put prod's tmpfs secrets back after a reboot.
#
# ADR-115 Option A keeps every prod runtime secret in /dev/shm — RAM, never disk. That is the
# right property and it has one consequence nothing handles: tmpfs does not survive a reboot,
# and no boot-time unit re-stages it. Every unplanned reboot therefore breaks the stack
# silently, and until this workflow there was no single action to recover it.
#
# Incident of record, 2026-09-15 22:30 (Hetzner reboot). 9.5 hours later:
#
#   player-api-1     Exited(127)   open /dev/shm/player-secrets/app_oauth_google_client_secret
#   operator-api-1   Exited(127)   open /dev/shm/operator-secrets/app_oauth_google_client_secret
#   /dev/shm         empty — podcast-secrets, operator-secrets, player-secrets ALL missing
#
# Exit 127 with NO application logs, because runc fails the MOUNT before any process starts —
# which is what makes it hard to recognise. Downstream: player-learning-app-1 and
# operator-viewer-1 crashlooping 527 times each (nginx resolves proxy_pass upstreams at
# startup, and their project's api was dead). Public visitors saw the coming-soon page
# throughout, which is why it went unnoticed for so long.
#
# Recovering meant running TWO full public-surface deploys, each with its own typed confirm
# and prod gate, and remembering to pin override_image_sha or you ship newer code DURING an
# incident. Too much ceremony and too much footgun for "put the secrets back".
#
# WHAT THIS DOES NOT DO: change any image tag. Recovery must be code-neutral, so the recreate
# path reads the tag off the container already on the box (scripts/ops/restage_prod_recreate.sh).
#
# Staging alone is INERT — it writes files that nothing re-reads until a container is
# recreated. `recreate` is therefore opt-in and separate.
#
# See #2080. Related: DEPLOY_GOTCHAS.md.
name: Restage prod tmpfs secrets

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESTAGE_SECRETS to confirm'
        required: true
      surfaces:
        description: 'Which secret dirs to restage: all | podcast | operator | player (comma-separated)'
        required: false
        default: 'all'
      recreate:
        description: 'Also recreate containers that are down/crashlooping (staging alone is inert)'
        type: boolean
        required: false
        default: false

concurrency:
  # Share deploy-prod's group so this never races a deploy.
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  restage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    steps:
      - name: Confirm RESTAGE_SECRETS
        run: |
          if [ "${{ inputs.confirm }}" != "RESTAGE_SECRETS" ]; then
            echo "::error::Must type RESTAGE_SECRETS to confirm. Got: '${{ inputs.confirm }}'"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-deployer
          version: 1.96.4

      - name: Install SSH identity for deploy@ (PROD_SSH_PRIVATE_KEY)
        uses: ./.github/actions/prod-ssh-key
        with:
          ssh_private_key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Resolve prod MagicDNS host
        id: ts_host
        env:
          PROD_TAILNET_FQDN: ${{ vars.PROD_TAILNET_FQDN }}
        run: |
          set -euo pipefail
          R=$(bash scripts/ops/resolve_prod_tailnet_host.sh)
          echo "resolved_fqdn=$R" >> "$GITHUB_OUTPUT"

      - name: Resolve selected surfaces
        id: sel
        run: |
          set -euo pipefail
          RAW="${{ inputs.surfaces }}"
          if [ -z "$RAW" ] || [ "$RAW" = "all" ]; then
            SEL="podcast operator player"
          else
            SEL="$(printf '%s' "$RAW" | tr ',' ' ' | tr -s ' ')"
            for s in $SEL; do
              case "$s" in
                podcast|operator|player) ;;
                *) echo "::error::unknown surface '$s' (want: all|podcast|operator|player)"; exit 2 ;;
              esac
            done
          fi
          echo "selected=$SEL" >> "$GITHUB_OUTPUT"
          echo "::notice::restaging: $SEL"

      - name: BEFORE state
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
        run: bash scripts/ops/restage_prod_report.sh "$SSH_TARGET" Before

      # Control plane goes through the CANONICAL action, never a copy of its file list. It
      # stages ELEVEN files (incl. deepgram_api_key and litellm_api_key) and is used by ten
      # workflows. Staging does `rm -rf` then swap, so a duplicated list that drifted would
      # replace a complete directory with an incomplete one and silently kill those providers.
      - name: Restage /dev/shm/podcast-secrets (canonical action)
        if: ${{ contains(steps.sel.outputs.selected, 'podcast') }}
        uses: ./.github/actions/stage-prod-secrets
        with:
          ssh_target: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
          ssh_identity: ${{ env.SSH_PROD_IDENTITY }}
          openai_api_key:       ${{ secrets.PROD_OPENAI_API_KEY }}
          anthropic_api_key:    ${{ secrets.PROD_ANTHROPIC_API_KEY }}
          gemini_api_key:       ${{ secrets.PROD_GEMINI_API_KEY }}
          mistral_api_key:      ${{ secrets.PROD_MISTRAL_API_KEY }}
          deepseek_api_key:     ${{ secrets.PROD_DEEPSEEK_API_KEY }}
          grok_api_key:         ${{ secrets.PROD_GROK_API_KEY }}
          deepgram_api_key:     ${{ secrets.PROD_DEEPGRAM_API_KEY }}
          litellm_api_key:      ${{ secrets.LITELLM_PROJ_PODCAST_PROD_KEY }}
          sentry_dsn_api:       ${{ secrets.PROD_SENTRY_DSN_API }}
          sentry_dsn_pipeline:  ${{ secrets.PROD_SENTRY_DSN_PIPELINE }}
          app_operator_api_key: ${{ secrets.PROD_APP_OPERATOR_API_KEY }}

      # The two public surfaces have no equivalent action — their staging was inlined in
      # deploy-operator.yml / deploy-player.yml, which is why recovery needed a full deploy.
      - name: Restage operator + player secrets
        if: ${{ contains(steps.sel.outputs.selected, 'operator') || contains(steps.sel.outputs.selected, 'player') }}
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
          SELECTED: ${{ steps.sel.outputs.selected }}
          PROD_SENTRY_DSN_API: ${{ secrets.PROD_SENTRY_DSN_API }}
          PLAYER_GOOGLE_CLIENT_SECRET: ${{ secrets.PLAYER_GOOGLE_CLIENT_SECRET }}
          PLAYER_APP_SESSION_SECRET: ${{ secrets.PLAYER_APP_SESSION_SECRET }}
          PROD_SENTRY_DSN_PLAYER_API: ${{ secrets.PROD_SENTRY_DSN_PLAYER_API }}
          PLAYER_INTERNAL_OUTBOX_TOKEN: ${{ secrets.PLAYER_INTERNAL_OUTBOX_TOKEN }}
        run: bash scripts/ops/restage_prod_secrets.sh "$SSH_TARGET"

      - name: Recreate containers that are down (opt-in)
        if: ${{ inputs.recreate }}
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
          SELECTED: ${{ steps.sel.outputs.selected }}
        run: |
          set -euo pipefail
          SSHF=(-i "$SSH_PROD_IDENTITY" -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes)
          scp "${SSHF[@]}" scripts/ops/restage_prod_recreate.sh "${SSH_TARGET}:/tmp/restage_prod_recreate.sh"
          # SELECTED is deliberately expanded HERE, on the runner: the box has no idea which
          # surfaces were requested. Passed on stdin rather than interpolated into the remote
          # command string, so the value never has to survive a second round of shell quoting.
          printf 'SELECTED=%q\n' "$SELECTED" \
            | ssh "${SSHF[@]}" "$SSH_TARGET" \
                'read -r sel; export "$sel"; bash /tmp/restage_prod_recreate.sh; rc=$?; rm -f /tmp/restage_prod_recreate.sh; exit $rc'

      - name: AFTER state
        if: always()
        env:
          SSH_TARGET: deploy@${{ steps.ts_host.outputs.resolved_fqdn }}
        run: |
          bash scripts/ops/restage_prod_report.sh "$SSH_TARGET" After
          if [ "${{ inputs.recreate }}" != "true" ]; then
            {
              echo
              echo "> Staging only. The secrets are on the box but **nothing re-read them** — a"
              echo "> container picks them up when it is next created. Re-run with"
              echo "> \`recreate: true\` to bring down/crashlooping containers back at their"
              echo "> current image tag."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
