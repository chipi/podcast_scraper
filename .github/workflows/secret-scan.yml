name: Secret Scan

# Prevent-recurrence gates (a leaked env backup + published operator identifiers both landed
# because nothing checked). Two jobs, both scan the PR diff (not full history — the coordinated
# history purge is separate):
#   - gitleaks: the full ruleset (catches Langfuse/GlitchTip keys that GitHub's provider patterns
#     miss) + a guard that no bare .env (non-.example) is tracked.
#   - identifier-denylist: fails if any operator identifier from the SECURITY_IDENTIFIER_DENYLIST
#     repo secret appears in a changed file. The secret holds the literals so they never live in
#     the repo; the gate no-ops (passes) until the secret is populated.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks — PR diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned v8.30.1)
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Resolve diff base
        id: base
        run: |
          set -euo pipefail
          # pull_request: base.sha is fetched by fetch-depth:0. workflow_dispatch: fall back to
          # the previous commit (origin/<base_ref> is NOT a local ref after checkout, so never
          # use it directly — that was the bug this replaces).
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"; fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      - name: gitleaks on the diff
        run: |
          set -euo pipefail
          gitleaks git -c .gitleaks.toml --no-banner --log-opts="${{ steps.base.outputs.sha }}..HEAD"

      - name: Fail if a bare .env file is tracked
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -E '(^|/)\.env$' | grep -v '\.example$' || true)
          if [ -n "$bad" ]; then
            echo "ERROR: tracked bare .env file(s) — never commit real .env files:"
            echo "$bad"
            exit 1
          fi
          echo "No bare .env files tracked."

  identifier-denylist:
    name: Operator identifier deny-list
    runs-on: ubuntu-latest
    env:
      DENYLIST: ${{ secrets.SECURITY_IDENTIFIER_DENYLIST }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check changed files against the identifier deny-list
        run: |
          set -euo pipefail
          if [ -z "${DENYLIST:-}" ]; then
            echo "SECURITY_IDENTIFIER_DENYLIST is not set — skipping identifier gate."
            echo "Populate the repo secret (one identifier per line) to enable it."
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"; fi
          mapfile -t changed < <(git diff --name-only "$BASE"...HEAD)
          hit=0
          while IFS= read -r id; do
            [ -z "$id" ] && continue
            for f in "${changed[@]}"; do
              [ -f "$f" ] || continue
              # -F literal match; report the FILE, never the identifier value.
              if grep -Fq -- "$id" "$f"; then
                echo "ERROR: a deny-listed operator identifier appears in changed file: $f"
                hit=1
              fi
            done
          done <<< "$DENYLIST"
          if [ "$hit" -eq 1 ]; then
            echo "Replace it with a placeholder (see docs/ci/SECRET_AND_IDENTIFIER_GATES.md)."
            exit 1
          fi
          echo "Identifier deny-list check passed."
