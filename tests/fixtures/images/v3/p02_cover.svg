<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Practical Systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B6FE0"/>
      <stop offset="55%" stop-color="#3B6FE0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#101C4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.22" r="0.75">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="45%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="#101C4A"/>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#glow)"/>

  <!-- Subject mark: the part that still reads at 120px. -->
  <g transform="translate(300 34) scale(2.32)" fill="none" stroke="#FFFFFF" stroke-opacity="0.92"
     stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" color="#FFFFFF">
    <g transform="translate(-50 0)"><rect x="16" y="16" width="68" height="20" rx="5"/><rect x="16" y="42" width="68" height="20" rx="5"/><rect x="16" y="68" width="68" height="20" rx="5"/><circle cx="28" cy="26" r="3.2" fill="currentColor" stroke="none"/><circle cx="28" cy="52" r="3.2" fill="currentColor" stroke="none"/><circle cx="28" cy="78" r="3.2" fill="currentColor" stroke="none"/></g>
  </g>

  <!-- Bottom scrim keeps the title legible over any part of the gradient. -->
  <rect width="600" height="600" fill="url(#shade)"/>

  <text fill="#FFFFFF" font-family="Inter, Helvetica, Arial, system-ui, sans-serif" font-size="96"
        font-weight="800" letter-spacing="-1.5"><tspan x="52" y="407">Practical</tspan><tspan x="52" y="508">Systems</tspan></text>
  <rect x="52" y="538" width="88" height="7" rx="3.5" fill="#FFFFFF" opacity="0.9"/>
  <text x="548" y="544" fill="#FFFFFF" opacity="0.55" text-anchor="end"
        font-family="Inter, Helvetica, Arial, system-ui, sans-serif" font-size="26"
        font-weight="700" letter-spacing="2">PS</text>
</svg>
