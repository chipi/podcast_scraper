# LiteLLM gateway config — PROD VPS instance (#1357, ADR-142).
#
# Model ALIASES are the contract: consumers call an alias (never a provider name),
# so the route behind it is swappable per-alias with no app change. Shared lineage
# with the homelab gateway (agentic-ai-homelab/infra/litellm/config.yaml) — keep the
# two from drifting; per-instance difference is env only (keys, callbacks).
#
# ─────────────────────────────────────────────────────────────────────────────
# PLACEHOLDER ALIASES — TEMPORARY. Seeded from homelab so the gateway boots and is
# testable. The REAL prod alias set is decided in #1356 (provider integration) once
# we know exactly which stages call what; expect this whole model_list to be
# replaced then. Do not wire the pipeline to these names as if they were final.
# ─────────────────────────────────────────────────────────────────────────────

model_list:
  - model_name: homelab-pro
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: homelab-flash
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: homelab-glm
    litellm_params:
      model: openrouter/z-ai/glm-5.2
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: homelab-kimi
    litellm_params:
      model: openrouter/moonshotai/kimi-k2.6
      api_key: os.environ/OPENROUTER_API_KEY
  # cloud_balanced's stable summary/speaker/insight alias (#1356). The pipeline pins
  # ``podcast-flash-0731`` (litellm_verify_served_model=true) so the gateway MUST advertise it;
  # routes to OpenRouter deepseek-v4-flash (app-level RFC-106 fallback to native DeepSeek handles
  # gateway outages). Keep mirrored with the homelab sibling config.
  - model_name: podcast-flash-0731
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY
  # The GI value gate's rater for every litellm-routed profile. Same route, same key, stronger
  # sibling of the summary alias above — so the gate's spend lands in this gateway's SpendLogs
  # instead of a second vendor bill. Before this existed the registry derived a vendor-DISJOINT
  # rater (an evaluation rule, #939) and sent production insight-rating straight to the Anthropic
  # API, off-gateway. Deliberately NOT the homelab-* aliases: those are marked temporary
  # placeholders and the pipeline must not wire itself to them.
  - model_name: podcast-pro-0829
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY
  # Groq (ADR-147) — routed DIRECT to Groq's LPU cloud, not via OpenRouter, so the gateway
  # captures SpendLogs + langfuse traces for Groq the same as every other backend. The gateway
  # env must carry GROQ_API_KEY (deploy-litellm.sh injects it from the prod secret store); keep
  # these aliases mirrored in the homelab sibling config. Groq is dual-use: a chat alias for the
  # LLM bakeoff (qwen3.6-27b) and an audio_transcription alias for whisper-large-v3-turbo.
  - model_name: groq-qwen36
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      api_key: os.environ/GROQ_API_KEY
  - model_name: groq-gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
  - model_name: groq-whisper-turbo
    litellm_params:
      model: groq/whisper-large-v3-turbo
      api_key: os.environ/GROQ_API_KEY
    model_info:
      mode: audio_transcription

  # ── Orrery Physics Lab (cross-repo tenant · orrery #535, operator 2026-09-06) ──
  # The /ask narrator for lab-api on this same VPS (reaches us via
  # host-gateway → 127.0.0.1:4001). Project-scoped alias so the route is
  # swappable without touching orrery. Model: DeepSeek v4 Flash (operator
  # decision — not Haiku). Billed to the DEDICATED OpenRouter key the
  # operator creates for this project (OPENROUTER_API_KEY_ORRERY in .env).
  # Consumed by a virtual key: key_alias proj-orrery-lab, models [orrery-ask],
  # max_budget 5, budget_duration 7d (weekly reset — the repo's budget-wall
  # convention, cf. proj-podcast-prod).
  - model_name: orrery-ask
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY_ORRERY

  # ── The DGX model (#2342): a TRANSPARENT proxy in front of the DGX vLLM. The podcast pipeline
  # (and the board summarizer) keep their vLLM provider unchanged and only point vllm_api_base at
  # this gateway, so every DGX call is metered and reaches Langfuse like every other model. The
  # alias IS the real HF model id, so requests, the provider's served-model check
  # (GET /v1/models) and telemetry are exactly what they were. Our hardware: $0, and NO fallback of
  # any kind may ever be added (it would turn a free local call into a paid cloud one; RFC-127
  # board summaries run at budget $0). This container resolves dgx-llm-1 (checked 2026-10-13);
  # the vLLM is served under the placeholder key EMPTY. 900 s covers long GI/quote calls the global
  # 120 s would cut. Not podcast-* on purpose: litellm_smoke.py only checks it is served, so a
  # gateway deploy does not fail while the GPU is in another mode.
  - model_name: NVFP4/Qwen3-30B-A3B-Instruct-2507-FP4
    litellm_params:
      model: hosted_vllm/NVFP4/Qwen3-30B-A3B-Instruct-2507-FP4
      api_base: http://dgx-llm-1:8003/v1
      api_key: EMPTY
      timeout: 900
    model_info:
      mode: chat
      max_input_tokens: 65536
      input_cost_per_token: 0
      output_cost_per_token: 0

litellm_settings:
  # Full-package observability from day one (operator requirement). On PROD these
  # callbacks reach the homelab pane over the tailnet — see .env.example: LANGFUSE_HOST
  # and SENTRY_DSN use the `homelab` name, resolved by the compose extra_hosts entry
  # deploy-litellm.sh injects (Docker's bridge can't resolve MagicDNS on its own).
  success_callback: ["langfuse"]
  failure_callback: ["langfuse", "sentry"]
  num_retries: 2
  request_timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # #2342: the vLLM provider counts tokens exactly with vLLM's own POST /tokenize (#2050); this
  # gateway is an OpenAI-API proxy with no such route, so it passes through to the DGX unchanged
  # (otherwise the provider falls back to an estimate and clips more transcript). auth: false —
  # per-key pass-through permission is LiteLLM Enterprise-only; /tokenize only counts tokens (no
  # generation, no spend) and the DGX already answers it to the tailnet under the key EMPTY.
  pass_through_endpoints:
    - path: "/tokenize"
      target: "http://dgx-llm-1:8003/tokenize"
      headers:
        Authorization: "Bearer EMPTY"
      auth: false
    # Translation (#2342): TranslateGemma on the DGX :8005. The translate provider's base is
    # <gateway>/v1/translate/v1 and it calls exactly these three paths, each passed through to
    # the DGX's own path unchanged. One EXACT route per path: this LiteLLM exempts only an exact
    # path from auth (a subpath route's children need a key and are then admin-only, Enterprise).
    # Keyless, so their traces go to this gateway's default Langfuse project (podcast-prod).
    - path: "/v1/translate/v1/completions"
      target: "http://dgx-llm-1:8005/v1/completions"
      headers:
        Authorization: "Bearer EMPTY"
      auth: false
    - path: "/v1/translate/v1/models"
      target: "http://dgx-llm-1:8005/v1/models"
      headers:
        Authorization: "Bearer EMPTY"
      auth: false
    - path: "/v1/translate/tokenize"
      target: "http://dgx-llm-1:8005/tokenize"
      headers:
        Authorization: "Bearer EMPTY"
      auth: false
  # Virtual keys + per-key budgets live in postgres (DATABASE_URL from compose).
