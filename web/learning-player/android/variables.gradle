ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    // UI Automator drives the device tier (#2139). It reads the ACCESSIBILITY TREE — the same
    // surface TalkBack consumes — which is why it and not Espresso: `Espresso.onWebView()` runs
    // WebDriver atoms against the DOM, so it shares the Playwright tier's blind spot. The bug of
    // record: a masthead link carrying an `aria-label` whose whole subtree was `aria-hidden` was
    // visible on screen, present in the DOM and findable by Playwright, yet pruned from the a11y
    // tree and unreachable to VoiceOver (see src/__checks__/accessible-names.test.ts).
    androidxUiAutomatorVersion = '2.3.0'
    cordovaAndroidVersion = '14.0.1'
}