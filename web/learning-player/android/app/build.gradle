apply plugin: 'com.android.application'

/**
 * Release signing + mechanical versioning (#2191).
 *
 * Play rejects a duplicate versionCode AFTER the upload completes, and an unsigned AAB is not
 * uploadable at all — so both of these have to be mechanical rather than hand-edited, or every
 * release becomes a chance to forget one.
 *
 * Credentials come from the environment first (what CI can supply) and fall back to a gitignored
 * `android/keystore.properties` (what a laptop can supply). Nothing secret is ever committed:
 * `*.jks`, `*.keystore` and `keystore.properties` are all in android/.gitignore.
 *
 * When NOTHING is configured the release signing config is simply not created. That is deliberate:
 * a debug build must keep working on a machine that has never seen the keystore, and a release
 * build that silently self-signed with the debug key would be worse than one that fails.
 */
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("keystore.properties")
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def ksPath = System.getenv("ANDROID_KEYSTORE_FILE") ?: keystoreProps.getProperty("storeFile")
def ksStorePass = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: keystoreProps.getProperty("storePassword")
def ksAlias = System.getenv("ANDROID_KEY_ALIAS") ?: keystoreProps.getProperty("keyAlias")
def ksKeyPass = System.getenv("ANDROID_KEY_PASSWORD") ?: keystoreProps.getProperty("keyPassword")
def hasReleaseSigning = ksPath && ksStorePass && ksAlias && ksKeyPass && file(ksPath).exists()

/**
 * versionCode: strictly increasing, derived, never typed by hand.
 *
 * `ANDROID_VERSION_CODE` wins when set — that is the hook for "ask Play what the last one was and
 * add one", the same trick the iOS lane plays with `latest_testflight_build_number`. Without it,
 * the commit count on the current branch is a monotonic stand-in that needs no network and no
 * Play account, which is what makes a release buildable before #2192 exists.
 */
def resolvedVersionCode = {
    def fromEnv = System.getenv("ANDROID_VERSION_CODE")
    if (fromEnv) return fromEnv.toInteger()
    def out = new ByteArrayOutputStream()
    try {
        exec {
            commandLine "git", "rev-list", "--count", "HEAD"
            standardOutput = out
            workingDir = rootProject.projectDir
        }
        return out.toString().trim().toInteger()
    } catch (Exception ignored) {
        // No git (a source tarball, a stripped CI checkout). 1 keeps a debug build working; a
        // release still needs ANDROID_VERSION_CODE, and `make android-bundle` enforces that.
        return 1
    }
}()

/** versionName: the app version, single-sourced from package.json so the two cannot drift. */
def resolvedVersionName = {
    def fromEnv = System.getenv("ANDROID_VERSION_NAME")
    if (fromEnv) return fromEnv
    try {
        def pkg = new groovy.json.JsonSlurper().parse(rootProject.file("../package.json"))
        return pkg.version ?: "1.0"
    } catch (Exception ignored) {
        return "1.0"
    }
}()

android {
    namespace = "app.closelistening.player"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.closelistening.player"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(ksPath)
                storePassword ksStorePass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only when it exists — see the note above on why an unsigned failure beats a
            // debug-signed "success".
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// FAIL a release build that has no signing config, rather than emitting an unsigned artifact.
//
// Without this the failure is silent and travels a long way: `bundleRelease` succeeds, every
// assertion in `make android-bundle` passes (it only checks that a keystore was NAMED, which is a
// weaker condition than the one above — a wrong `storeFile` path, or an env var set with
// ANDROID_KEY_PASSWORD missing, satisfies the Makefile and not `hasReleaseSigning`), fastlane
// uploads it, and Play rejects it after the whole AAB has gone over the wire.
//
// The check lives here because this is where the truth is. The Makefile cannot reproduce
// `hasReleaseSigning` without duplicating its four-value-plus-file-exists logic, and a duplicated
// gate is one that drifts.
gradle.taskGraph.whenReady { graph ->
    def needsSigning = graph.allTasks.any {
        it.project == project && it.name in ['bundleRelease', 'assembleRelease']
    }
    if (needsSigning && !hasReleaseSigning) {
        throw new GradleException(
            "Release signing is not configured, so this build would produce an UNSIGNED artifact " +
            "that Play rejects on upload.\n" +
            "  keystore file : ${ksPath ?: '(unset)'}" +
                (ksPath && !file(ksPath).exists() ? '  <- does not exist' : '') + "\n" +
            "  store password: ${ksStorePass ? 'set' : '(unset)'}\n" +
            "  key alias     : ${ksAlias ?: '(unset)'}\n" +
            "  key password  : ${ksKeyPass ? 'set' : '(unset)'}\n" +
            "Set all four via android/keystore.properties or the ANDROID_KEYSTORE_FILE / " +
            "ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD env vars."
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:$androidxUiAutomatorVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

/**
 * Firebase config — and a loud failure when a RELEASE build lacks it (#2157).
 *
 * `google-services.json` is gitignored by design (it is per-project config, supplied at build
 * time), and Capacitor's generated block below applies the plugin only when the file is present.
 * That keeps a debug build working on a machine that has never seen it — which is right — but it
 * also means the failure is INVISIBLE until runtime, where it is not a nice error: without
 * Firebase, `FirebaseMessaging.getInstance()` inside the push plugin throws
 * `IllegalStateException: Default FirebaseApp is not initialized` on a native handler thread.
 * JS cannot catch that. It kills the process.
 *
 * `logger.info` is the wrong volume for "this artifact cannot do push": it is below Gradle's
 * default output, so the build looks completely clean.
 *
 * It WARNS by default and only FAILS when `-PandroidPushRequired=true`. Not the other way round,
 * because today Android push is deliberately switched off in the client
 * (`ANDROID_PUSH_NATIVE_READY = false`), so a release build with no Firebase config is the correct
 * and expected state — failing on it would block the Play upload path for a feature nobody has
 * turned on. Flip this property in the same change that flips that client guard: at that moment a
 * missing config stops being expected and becomes an artifact that crashes on first use.
 */
def servicesJSON = file('google-services.json')
def hasFirebaseConfig = servicesJSON.exists() && servicesJSON.length() > 0
if (hasFirebaseConfig) {
    apply plugin: 'com.google.gms.google-services'
} else {
    def pushRequired = project.hasProperty('androidPushRequired') &&
                       project.property('androidPushRequired').toString().toBoolean()
    def msg = "google-services.json is missing, so this build CANNOT do push notifications " +
              "(#2157). Enabling push on a build without it crashes the app natively — " +
              "FirebaseMessaging throws on a handler thread and JS cannot catch it."
    if (pushRequired) {
        throw new GradleException(
            "$msg\n" +
            "  -PandroidPushRequired=true was set, so this is fatal rather than a warning.\n" +
            "  Put the file at app/google-services.json (Firebase console -> project settings ->\n" +
            "  your Android app). It is gitignored on purpose — supply it from a CI secret or a\n" +
            "  local copy."
        )
    }
    logger.warn("WARNING: $msg")
}
