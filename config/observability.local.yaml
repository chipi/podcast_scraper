# Local observability config for the obs MCP run over stdio (`make serve-obs` / .mcp.json, #56).
#
# Points at the LOCAL `make serve` api. The observability backends' URLs are not in this file:
# they come from `.env.obs.dev` (git-ignored; `make serve-obs` sources it), the same variables the
# apps ship telemetry with (see `.env.obs.dev.example`). Secrets stay out of the file via
# `<field>_env:` indirection, sourced the same way. Every source degrades to "not configured" without its
# token, so this "just works" for api-health + logs out of the box; alerts/errors light up when you
# add the Grafana / GlitchTip tokens.
default_target: local

targets:
  local:
    # `make serve-api` (FastAPI default port); health / version / recent runs need no token.
    api_base: http://localhost:8000
    # Deploy history — optional Actions:read PAT (degrades without it).
    github:
      repo: chipi/podcast_scraper
      token_env: PODCAST_OBS_GITHUB_TOKEN
    # Errors — homelab GlitchTip (Sentry-API-compatible); reuse the platform token if present.
    sentry:
      environment: dev
      token_env: SENTRY_AUTH_TOKEN
    # Alerts — Grafana (needs a read-scoped SA token). URL: PODCAST_OBS_GRAFANA_URL.
    grafana:
      token_env: PODCAST_OBS_GRAFANA_TOKEN
    # Logs — VictoriaLogs (Loki-compatible read), no token. URL: PODCAST_OBS_VICTORIALOGS_URL, or
    # derived from PODCAST_LOGS_PUSH_URL when unset.
