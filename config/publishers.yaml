# Publisher registry (ADR-180 rule 6): publishers are organisations across media.
# Loaded by podcast_scraper.publishers.load_registry, which refuses an id, domain, source or
# external id claimed by two publishers.
#
#   - id: org:example            # a KG Organization id; NER's org with the same slug is the same org
#     name: Example News
#     domains: [example.com]     # matches a news item's canonical URL host and its subdomains;
#                                # the longest match wins; no match is no publisher
#     external_ids: {}           # e.g. {wikidata: Q...}; kept side by side, never merged into one key
#     sources: []                # KG Source ids (podcast:..., source:...): PUBLISHED_BY, never from NER
#
# Entries are added with their sources: news by ingestion, podcasts by R3b's KG half.
publishers: []
