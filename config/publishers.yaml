# Publisher registry (ADR-180 rule 6): publishers are organisations across media. A sample:
# every publisher here is made up, and they publish the sample news sources in
# config/examples/news.feeds.example.yaml. A deployment keeps its real registry elsewhere and
# points PODCAST_PUBLISHERS_FILE at it.
# Loaded by podcast_scraper.publishers.load_registry, which refuses an id, domain, source or
# external id claimed by two publishers. Nothing writes this file: add a publisher, or a source
# to one, by hand when you add a feed.
#
#   - id: org:example            # a KG Organization id; NER's org with the same slug is the same org
#     name: Example News
#     domains: [example.com]     # matches a news item's canonical URL host and its subdomains;
#                                # the longest match wins; no match is no publisher
#     external_ids: {}           # e.g. {wikidata: Q...}; kept side by side, never merged into one key
#     sources: []                # KG Source ids (podcast:..., source:...): PUBLISHED_BY, never from NER
#
# A news Source id is source:{url_identity(feed url)}. A link aggregator (transport hn) has no
# publisher: its items find theirs by domain.
publishers:
- id: org:example-news
  name: Example News
  domains:
  - news.example.com
  sources:
  - source:8c44402e1b3a0091068b
- id: org:example-world
  name: Example World
  domains:
  - world.example.org
  sources:
  - source:589f80a39826be5ba4d7
- id: org:example-paywalled
  name: Example Paywalled
  domains:
  - paywalled.example.net
  sources:
  - source:9ef1f1511e11065b28cc
- id: org:example-blog
  name: Example Blog
  domains:
  - blog.example.com
  sources:
  - source:e2616bf435288913d53c
