# Prod observability config for the on-VPS obs MCP (#56).
#
# Mounted read-only into the `obs` service (compose/docker-compose.player-public.yml) at
# /config/observability.yaml; deploy-player.yml stages it to the box. Backends are the self-hosted
# homelab stack over Tailscale — Grafana Cloud is retired (ADR-117/119).
#
# NO BACKEND URLS LIVE IN THIS FILE — on purpose (#2188). The obs container gets them the way every
# other prod container gets its observability endpoints: as environment variables RENDERED AT
# DEPLOY TIME by deploy-player.yml:
#
#     logs     PODCAST_OBS_VICTORIALOGS_URL        the LOGS_NODE Alloy writes to (shared node file)
#     metrics  PODCAST_OBS_VICTORIAMETRICS_URL     the METRICS_NODE Alloy writes to (shared node file)
#     traces   OTEL_EXPORTER_OTLP_TRACES_ENDPOINT  the same value player-api exports spans to
#     errors   PODCAST_OBS_SENTRY_URL              the glitchtip tailnet node
#     alerts   PODCAST_OBS_GRAFANA_URL             the grafana tailnet node
#
# `podcast_obs.config._platform_read_urls` turns those into read bases, and a target here that
# omits a URL falls back to them. A literal URL written here would WIN over the rendered one — which
# is exactly how this broke: the file used to say `logs_url: http://homelab:9428` and
# `grafana.url: http://homelab:3000`, the tailnet ACL drops prod -> homelab on both ports (while
# allowing 8428 / 10428), and metrics / traces had no URL at all. All four sources were dead while
# the backends held live data (measured 2026-09-29, inside `player-obs-1`). Do not add URLs back.
#
# Secrets never live here either — `<field>_env: ENV_VAR_NAME` names the variable the deploy stages.

default_target: prod

targets:
  prod:
    # The OPERATOR api (container name: on two networks the service name `api` is ambiguous).
    # player-api, the `api` of obs's own stack, serves none of the read probes but /api/health.
    api_base: http://compose-api-1:8000

    # Operator key for the GATED probes (#1921). /api/jobs and /api/enrichment/* moved under
    # ``app_operator_guard`` (#1071/#1128) while these probes still called them bare, so
    # ``ops summary`` reported runs / cache_stats / enrichment_{status,health,events} as FAILED
    # against a perfectly healthy deploy — a monitor that cries wolf during exactly the long
    # pipeline runs it exists to watch.
    #
    # INERT until the obs service is given the env var. The API validates this value as
    # ``X-Operator-Key``, and it is the same credential the pipeline uses for WRITES — so wiring
    # it into a read-only service widens that service's blast radius. That is an operator
    # decision, deliberately not taken here: with the var unset this key resolves to nothing and
    # the gated sources keep degrading to "failed" exactly as they do today.
    # Since 2026-10-03 obs gets a GET-only key instead: derived from the operator key by the
    # deploy-player workflow, staged in RAM (/dev/shm/player-secrets) and mounted as a secret into
    # player-api (which accepts it for reads only, app_operator_guard) and into obs here.
    operator_key_file: /run/secrets/app_operator_read_key

    # Deploy history (recent deploy-prod runs). An Actions:read fine-grained PAT in secret
    # PODCAST_OBS_GITHUB_TOKEN (set 2026-10-14; the ci-ops-poller's read-only token).
    github:
      repo: chipi/podcast_scraper
      token_env: PODCAST_OBS_GITHUB_TOKEN

    # Errors — homelab GlitchTip (Sentry-API-compatible). The token is a dedicated GlitchTip API
    # token, NOT the platform's SENTRY_AUTH_TOKEN: that one returns HTTP 401 against the GlitchTip
    # API (measured 2026-09-29), so it cannot back this source.
    sentry:
      environment: prod
      token_env: PODCAST_OBS_SENTRY_TOKEN
      org: homelab
      projects: [podcast-api, podcast-pipeline, player, gi-kg-viewer]

    # Alerts — Grafana. Read-only (Viewer) service-account token.
    grafana:
      token_env: PODCAST_OBS_GRAFANA_TOKEN
    # LLM traces (Langfuse project podcast-prod, where the gateway records prod's LLM calls). The
    # keys are the gateway's own (secrets LITELLM_LANGFUSE_*), staged by deploy-player.yml; absent
    # keys degrade this source to "not configured". Reachable from prod: the ACL allows :4000.
    # User-action analytics (ADR-126): read-only Umami user `podcast-obs` (role view-only, member
    # of the observability-read team that owns these two sites; nothing else visible). The URL is
    # rendered at deploy time (PODCAST_OBS_UMAMI_URL — the tailnet node name is never committed).
    umami:
      username: podcast-obs
      password_env: PODCAST_OBS_UMAMI_PASSWORD
      website_ids:
        player: cd384a3e-fd25-476e-affa-08985b73d4da
        operator: a5a60c25-a555-4c2d-b096-c9814c21d25c
    langfuse:
      base_url: http://homelab:4000
      public_key_env: PODCAST_OBS_LANGFUSE_PUBLIC_KEY
      secret_key_env: PODCAST_OBS_LANGFUSE_SECRET_KEY
