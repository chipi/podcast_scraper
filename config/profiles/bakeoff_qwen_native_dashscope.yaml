# Bake-off profile: NATIVE Qwen provider (ADR-147) direct to the OFFICIAL Alibaba Qwen API
# (DashScope / Model Studio) — the native-vs-OpenRouter comparison arm for qwen3.7-flash. Sibling of
# bakeoff_litellm_qwen37_finale (same model, routed through the homelab LiteLLM gateway -> OpenRouter
# instead). Same v2.4 pipeline/quality; the ONLY variable is the LLM route: native DashScope here.
#
# DashScope wants the thinking toggle as a TOP-LEVEL extra_body field (enable_thinking:false); qwen3.7
# -flash is Alibaba's non-thinking flash tier. Endpoint + key from .env (workspace-specific).

transcription:
  primary: whisper
diarize: false
screenplay: true

# --- LLM stages: ALL via the NATIVE qwen provider, direct to the official DashScope API ---
summary_provider: qwen
speaker_detector_provider: qwen
quote_extraction_provider: qwen
entailment_provider: qwen
kg_extraction_provider: qwen
auto_speakers: true
llm_pipeline_mode: staged

qwen_api_base: ${DASHSCOPE_API_BASE:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
qwen_api_key_env: DASHSCOPE_API_KEY
qwen_summary_model: qwen3.7-flash
qwen_speaker_model: qwen3.7-flash
qwen_cleaning_model: qwen3.7-flash
qwen_insight_model: qwen3.7-flash
qwen_temperature: 0.3
qwen_extra_body:
  enable_thinking: false
qwen_verify_served_model: false

degradation_policy:
  continue_on_stage_failure: true
preprocessing_enabled: true
cloud_llm_structured_min_output_tokens: 4096

summarization_timeout: 600
transcription_timeout: 300

summary_reduce_params:
  max_new_tokens: 2048
  min_new_tokens: 100

# --- GI / KG (identical knobs to the OpenRouter arm — only the route differs) ---
generate_gi: true
gi_max_insights: 12
gi_require_grounding: true
gil_evidence_quote_mode: bundled
gil_evidence_nli_mode: bundled
gil_evidence_match_summary_provider: true
generate_kg: true
kg_extraction_source: provider
kg_max_topics: 10
kg_max_entities: 15
gi_value_gate_enabled: true
gi_value_gate_min_tier: 3
gi_insight_dedupe_threshold: 0.72
gi_insight_temperature: 0.0
gi_insight_prompt_version: v2
gi_insight_chunk_chars: 30000
gi_qa_score_min: 0.3
gi_nli_entailment_min: 0.75
topic_cluster_threshold: 0.75
insight_cluster_threshold: 0.75

vector_search: true
vector_embedding_provider: sentence_transformers
llm_circuit_breaker_enabled: true
generate_metadata: true
generate_summaries: true
language: en
log_level: INFO
ner_model: en_core_web_trf

# Corpus-enrichment layer (required top-level block; operators read the YAML to see what's active).
enrichment:
  enabled: true
  enrichers:
    topic_cooccurrence_corpus: {}
    topic_theme_clusters: {}
    temporal_velocity: {}
    grounding_rate: {}
    guest_coappearance: {}
    insight_density: {}
    insight_sentiment: {}
    topic_similarity:
      provider:
        type: sentence_transformer_local
        model: all-MiniLM-L6-v2
    topic_consensus:
      provider:
        type: consensus_local
        embed_model: all-MiniLM-L6-v2

# registry status: yaml-only — research bake-off arm, fully specified inline; intentionally
# NOT a _PROFILE_PRESETS entry (removed the self-referential `profile:` key 2026-08-07 to opt out
# of registry-drift checking, per the drift test design for experiment configs).
