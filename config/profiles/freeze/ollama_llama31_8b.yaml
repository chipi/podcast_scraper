# Profile: freeze/ollama_llama31_8b — max-Ollama (NER + summary via llama3.1:8b).
# Ollama has no transcription, so whisper small.en (production WER sweet spot).
# Prereq: `ollama pull llama3.1:8b`.
# Provider-only prescription; operational fields injected by freeze_profile / CLI.
#
# `make profile-freeze` is retired from this repository (#2134).

# Transcription — local Whisper (Ollama has no transcription)
transcription_provider: whisper
whisper_model: small.en

screenplay: true
diarize: true

# Speaker detection — Ollama
speaker_detector_provider: ollama
ollama_speaker_model: llama3.1:8b
auto_speakers: true

# Summarization — Ollama llama3.1:8b
summary_provider: ollama
ollama_summary_model: llama3.1:8b

# Grounded Insights
generate_gi: true
gi_max_insights: 12
gi_require_grounding: true

# Knowledge Graph
generate_kg: true
kg_extraction_source: provider
kg_max_topics: 10
kg_max_entities: 15

# Vector search + clustering
vector_search: true
vector_embedding_provider: sentence_transformers

# General
generate_metadata: true
generate_summaries: true
language: en
log_level: INFO
