# Cloud "best-of-breed per stage" profile for the DGX-DOWN window (ADR-147).
#
# Splits every stage to the strongest cloud option while the DGX (local pyannote diarizer + local
# Qwen) is offline:
#   - TRANSCRIPTION: Groq whisper-large-v3-turbo  (cheapest cloud ASR, ~63x real-time)
#   - DIARIZATION:   Deepgram nova-3               (independent pass; only cloud diarizer available)
#   - LLM stages:    DeepSeek-v4-flash             (the 100-ep finale CLOUD winner, reasoning off)
#
# COST NOTE — read before running: Deepgram diarization is a FULL audio pass (it re-processes the
# audio via /v1/listen), so this split bills BOTH Groq ASR (~$0.00067/min) AND Deepgram
# (~$0.0043/min) = ~$0.005/min, which is MORE than letting Deepgram do ASR+diarization in one pass
# (~$0.0043/min). Use this split ONLY if Groq's transcript TEXT is meaningfully better than
# Deepgram's for your content (it feeds summary/GI/KG) — otherwise prefer a Deepgram-only ASR profile
# and keep DeepSeek for the LLM stages. Confirm with the ASR quality A/B before committing 100 eps.
#
# When the DGX is back, swap diarization_provider: deepgram -> local (free pyannote) and this becomes
# a Groq-ASR + local-diarization + DeepSeek-LLM profile with no per-minute diarization cost.

# --- Transcription: Groq whisper-large-v3-turbo (cloud ASR) ---
transcription_provider: groq
groq_transcription_model: whisper-large-v3-turbo

# --- Diarization: Deepgram (independent of the ASR provider; groq is now diarization-eligible) ---
# Groq whisper does NOT self-diarize, so this deepgram pass is NECESSARY (one diarize-only call) —
# unlike cloud_balanced where deepgram IS the ASR and self-diarizes (there we use diarize:false to
# reuse it). Pin the diarization model so the choice is explicit (drift-check requires it).
diarize: true
diarization_provider: deepgram
deepgram_diarization_model: nova-3-general
deepgram_model: nova-3
screenplay: true

# --- LLM stages: ALL via native DeepSeek, direct to api.deepseek.com (finale cloud winner) ---
summary_provider: deepseek
# This is the DGX-DOWN profile — it exists BECAUSE something is already broken, so it is the
# last profile that should have a single point of failure. Its primary is DeepSeek, which is the
# tier every other cloud profile falls over TO, so its own ladder must name a different vendor.
summary_fallback_providers: [gemini]
speaker_detector_provider: deepseek
quote_extraction_provider: deepseek
entailment_provider: deepseek
kg_extraction_provider: deepseek
auto_speakers: true
llm_pipeline_mode: staged

# deepseek_api_base omitted -> https://api.deepseek.com direct. Key from DEEPSEEK_API_KEY.
deepseek_summary_model: deepseek-v4-flash
deepseek_speaker_model: deepseek-v4-flash
deepseek_cleaning_model: deepseek-v4-flash
deepseek_temperature: 0.3
# Reasoning OFF (fair match to the finale; reasoning_effort:none verified on api.deepseek.com).
deepseek_extra_body:
  reasoning_effort: none

degradation_policy:
  continue_on_stage_failure: true
preprocessing_enabled: true
cloud_llm_structured_min_output_tokens: 4096

summarization_timeout: 600
transcription_timeout: 300

summary_reduce_params:
  max_new_tokens: 2048
  min_new_tokens: 100

# --- GI / KG (identical finale-tuned knobs to the deepseek cloud winner) ---
generate_gi: true
gi_max_insights: 12
gi_require_grounding: true
gil_evidence_quote_mode: bundled
gil_evidence_nli_mode: bundled
gil_evidence_match_summary_provider: true
generate_kg: true
kg_extraction_source: provider
kg_max_topics: 10
kg_max_entities: 15
gi_value_gate_enabled: true
gi_value_gate_min_tier: 3
gi_insight_dedupe_threshold: 0.72
gi_insight_temperature: 0.0
gi_insight_prompt_version: v2
gi_insight_chunk_chars: 30000
gi_qa_score_min: 0.3
gi_nli_entailment_min: 0.75
topic_cluster_threshold: 0.70
insight_cluster_threshold: 0.75

vector_search: true
vector_embedding_provider: sentence_transformers
llm_circuit_breaker_enabled: true
generate_metadata: true
generate_summaries: true
language: en
log_level: INFO
ner_model: en_core_web_trf

# Corpus-enrichment layer (required top-level block; operators read the YAML to see what's active).
enrichment:
  enabled: true
  enrichers:
    topic_cooccurrence_corpus: {}
    topic_theme_clusters: {}
    temporal_velocity: {}
    grounding_rate: {}
    guest_coappearance: {}
    insight_density: {}
    insight_sentiment: {}
    topic_similarity:
      provider:
        type: sentence_transformer_local
        model: all-MiniLM-L6-v2
    topic_consensus:
      provider:
        type: consensus_local
        embed_model: all-MiniLM-L6-v2

# registry status: yaml-only research/ops profile, fully specified inline; intentionally NOT a
# _PROFILE_PRESETS entry (no self-referential `profile:` key), to opt out of registry-drift checking.

# Value-gate rater, on the summariser's own route (2026-08-29). Without these this DGX-outage
# failover profile resolved gate=None and silently self-graded at ~half strictness — during
# exactly the window its output gets compared against normal-prod baseline.
gi_value_gate_provider: deepseek
gi_value_gate_model: deepseek-v4
