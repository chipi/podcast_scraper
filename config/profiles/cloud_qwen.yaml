# Cloud production profile: v2.4 pipeline/quality with the LLM stages served by the NATIVE Qwen
# provider (ADR-147) talking DIRECT to the OFFICIAL first-party Alibaba Qwen API — DashScope /
# Model Studio, the vendor endpoint (the analog of api.deepseek.com for DeepSeek), NOT a third-party
# reseller (DeepInfra/Together/OpenRouter). No LiteLLM gateway. Qwen carries its OWN `qwen`
# telemetry/cost namespace so cloud spend is attributed to Qwen, not vllm/litellm. This is the cloud
# counterpart to prod_dgx_full's DGX-local Qwen (which stays on the `vllm` provider at $0).
#
# Endpoint: DashScope OpenAI-compatible mode (international). Key: DASHSCOPE_API_KEY (the official
# Qwen API key). Model: qwen3.7-flash — the v2.5 finale flash winner (API-only, Alibaba-hosted).
# The provider is endpoint-agnostic: to serve the same qwen from the DGX vLLM slot instead, swap
# `qwen_api_base` + `qwen_api_key_env` — no code change. DashScope wants the thinking toggle as a
# TOP-LEVEL extra_body field (a self-hosted vLLM would want chat_template_kwargs); thinking MUST be
# off for the JSON extraction stages.
#
# All PA finale fixes carried from cloud_openrouter: chunked cleaning (PA1), thinking off,
# summarization_timeout 600 (PA-6), GI/KG tuned knobs, real cost capture (PA3).
profile: cloud_qwen

transcription:
  primary: whisper
diarize: false
screenplay: true

# --- LLM stages: ALL via the native Qwen provider (direct to the fixed-price host), thinking off ---
summary_provider: qwen
speaker_detector_provider: qwen
quote_extraction_provider: qwen
entailment_provider: qwen
kg_extraction_provider: qwen
auto_speakers: true
llm_pipeline_mode: staged

# Workspace-specific DashScope endpoint from .env (keeps the account-specific URL out of the repo);
# falls back to the generic international endpoint if DASHSCOPE_API_BASE is unset.
qwen_api_base: ${DASHSCOPE_API_BASE:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
qwen_api_key_env: DASHSCOPE_API_KEY
qwen_summary_model: qwen3.7-flash
qwen_speaker_model: qwen3.7-flash
# qwen_cleaning_model omitted — the provider defaults cleaning to summary_model (governed).
qwen_insight_model: qwen3.7-flash
qwen_temperature: 0.3
qwen_extra_body:
  enable_thinking: false
# DashScope is a vendor API (not a DGX slot that could load the wrong weights), so the fail-closed
# served-model check is off here — /v1/models on DashScope lists the catalog, not "the one served
# model". Flip on only for a self-hosted (DGX vLLM) qwen endpoint.
qwen_verify_served_model: false

degradation_policy:
  continue_on_stage_failure: true
preprocessing_enabled: true
cloud_llm_structured_min_output_tokens: 4096

# relabel_only does NO ASR, so a stalled chat call fast-fails at 300s instead of the 30min default;
# summarization_timeout 600 lets a genuine long chunked-GI pass finish (PA-6, validated on deepseek).
summarization_timeout: 600
transcription_timeout: 300

summary_reduce_params:
  max_new_tokens: 2048
  min_new_tokens: 100

# --- GI / KG (same knobs as cloud_openrouter / prod_dgx_full) ---
generate_gi: true
gi_max_insights: 50
gi_require_grounding: true
gil_evidence_quote_mode: bundled
gil_evidence_nli_mode: bundled
gil_evidence_match_summary_provider: true
generate_kg: true
kg_extraction_source: provider
kg_max_topics: 10
kg_max_entities: 15
gi_value_gate_enabled: true
gi_value_gate_min_tier: 2
gi_insight_dedupe_threshold: 0.75
gi_insight_temperature: 0.0
gi_insight_prompt_version: v2
gi_insight_chunk_chars: 30000
gi_qa_score_min: 0.3
gi_nli_entailment_min: 0.75
topic_cluster_threshold: 0.70
insight_cluster_threshold: 0.75

vector_search: true
vector_embedding_provider: sentence_transformers
llm_circuit_breaker_enabled: true
generate_metadata: true
generate_summaries: true
language: en
log_level: INFO
ner_model: en_core_web_trf

# Corpus-enrichment layer (required top-level block; operators read the YAML to see what's active).
enrichment:
  enabled: true
  enrichers:
    topic_cooccurrence_corpus: {}
    topic_theme_clusters: {}
    temporal_velocity: {}
    grounding_rate: {}
    guest_coappearance: {}
    insight_density: {}
    insight_sentiment: {}
    topic_similarity:
      provider:
        type: sentence_transformer_local
        model: all-MiniLM-L6-v2
    topic_consensus:
      provider:
        type: consensus_local
        embed_model: all-MiniLM-L6-v2

# --- registry-materialized (make profiles-materialize) — do not hand-edit ---
transcription_provider: openai
resilience_run_context: serve
resilience_failure_strategy: failover
transcription_coverage_min: 0.0
transcription_speech_coverage_min: 0.0
transcription_coverage_failover_model: null
transcription_coverage_failover_provider: null
enforce_model_governance: false
summary_model: qwen3.7-flash
summary_fallback_providers: [deepseek]
gi_value_gate_provider: qwen
gi_value_gate_model: qwen3.7-flash
