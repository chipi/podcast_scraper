# Cloud production profile: v2.4 pipeline/quality with the LLM stages served by the NATIVE Qwen
# provider (ADR-144) talking DIRECT to a single fixed-price cloud host — no LiteLLM gateway, no
# OpenRouter per-host price variance. This is the cloud counterpart to prod_dgx_full's DGX-local
# Qwen (which stays on the `vllm` provider at $0): here Qwen carries its OWN `qwen` telemetry/cost
# namespace so cloud spend is attributed to Qwen, not vllm/litellm.
#
# Host: DeepInfra (research 2026-08-06 fixed-price single host; Qwen3-Next-80B-A3B-Instruct ~
# $0.09/$0.78 per 1M in/out). Swap `qwen_api_base` + `qwen_api_key_env` to point at Together /
# Fireworks / the DGX vLLM slot — the provider is endpoint-agnostic, no code change. The `-Instruct`
# checkpoint is the non-thinking variant; qwen_extra_body still disables thinking defensively (Qwen3
# thinking must be OFF for the JSON extraction stages).
#
# All PA finale fixes carried from cloud_openrouter: chunked cleaning (PA1), reasoning/thinking off,
# summarization_timeout 600 (PA-6), GI/KG tuned knobs, real cost capture (PA3).
profile: cloud_qwen

transcription:
  primary: whisper
diarize: false
screenplay: true

# --- LLM stages: ALL via the native Qwen provider (direct to the fixed-price host), thinking off ---
summary_provider: qwen
speaker_detector_provider: qwen
quote_extraction_provider: qwen
entailment_provider: qwen
kg_extraction_provider: qwen
auto_speakers: true
llm_pipeline_mode: staged

qwen_api_base: https://api.deepinfra.com/v1/openai
qwen_api_key_env: DEEPINFRA_API_KEY
qwen_summary_model: Qwen/Qwen3-Next-80B-A3B-Instruct
qwen_speaker_model: Qwen/Qwen3-Next-80B-A3B-Instruct
qwen_cleaning_model: Qwen/Qwen3-Next-80B-A3B-Instruct
qwen_insight_model: Qwen/Qwen3-Next-80B-A3B-Instruct
qwen_temperature: 0.3
qwen_extra_body:
  chat_template_kwargs:
    enable_thinking: false
qwen_verify_served_model: true

degradation_policy:
  continue_on_stage_failure: true
preprocessing_enabled: true
cloud_llm_structured_min_output_tokens: 4096

# relabel_only does NO ASR, so a stalled chat call fast-fails at 300s instead of the 30min default;
# summarization_timeout 600 lets a genuine long chunked-GI pass finish (PA-6, validated on deepseek).
summarization_timeout: 600
transcription_timeout: 300

summary_reduce_params:
  max_new_tokens: 2048
  min_new_tokens: 100

# --- GI / KG (same knobs as cloud_openrouter / prod_dgx_full) ---
generate_gi: true
gi_insight_source: provider
gi_max_insights: 12
gi_require_grounding: true
gil_evidence_quote_mode: bundled
gil_evidence_nli_mode: bundled
gil_evidence_match_summary_provider: true
generate_kg: true
kg_extraction_source: provider
kg_max_topics: 10
kg_max_entities: 15
gi_value_gate_enabled: true
gi_value_gate_min_tier: 3
gi_insight_dedupe_threshold: 0.72
gi_insight_temperature: 0.0
gi_insight_prompt_version: v2
gi_insight_chunk_chars: 30000
gi_qa_score_min: 0.3
gi_nli_entailment_min: 0.75
topic_cluster_threshold: 0.75
insight_cluster_threshold: 0.75

vector_search: true
vector_embedding_provider: sentence_transformers
llm_circuit_breaker_enabled: true
generate_metadata: true
generate_summaries: true
language: en
log_level: INFO
ner_model: en_core_web_trf

# Corpus-enrichment layer (required top-level block; operators read the YAML to see what's active).
enrichment:
  enabled: true
  enrichers:
    topic_cooccurrence_corpus: {}
    topic_theme_clusters: {}
    temporal_velocity: {}
    grounding_rate: {}
    guest_coappearance: {}
    insight_density: {}
    insight_sentiment: {}
    topic_similarity:
      provider:
        type: sentence_transformer_local
        model: all-MiniLM-L6-v2
    topic_consensus:
      provider:
        type: consensus_local
        embed_model: all-MiniLM-L6-v2
