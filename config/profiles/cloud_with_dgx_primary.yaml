# Profile: cloud_with_dgx_primary — prod Whisper + pyannote on DGX, cloud fallback (ADR-096, #814, #926)
#
# Renamed from cloud_with_dgx_whisper_primary on 2026-06-09 when pyannote
# diarization on DGX (#926) joined Whisper on DGX (#814) as the second
# prod-critical service on the GB10 box. "Whisper-primary" was no longer
# accurate; this profile now covers TWO DGX services.
#
# Summarization / GI / KG remain on cloud_balanced defaults (Gemini).
# Requires prod VPS tailnet reachability to tag:dgx-llm-host (ports 8000 for
# Speaches, 8001 for pyannote, 11434 for Ollama not used by this profile).
# Cloud fallbacks: OPENAI_API_KEY (Whisper), GEMINI_API_KEY (summary).
# Diarization falls back to in-process pyannote (no cheap cloud alternative
# to bill against — TailnetDgxDiarizationProvider handles this transparently).
#
# 2026-06-12 (#907 Option B): opted into registry-driven defaults. The
# `profile:` field below names the registry preset; routing fields below
# (transcription_provider, summary_provider, summary_model) are now
# cross-checked against the registry by
# tests/integration/providers/ml/test_profile_yaml_registry_drift.py. If
# this YAML disagrees with the registry preset, CI fails — update either
# this file or the registry (with new research_ref evidence).

profile: cloud_with_dgx_primary

transcription:
  primary: tailnet_dgx_whisper
  fallback: deepgram

dgx_tailnet_host: ${DGX_TAILNET_HOST:-dgx-llm-1}
# Registry-driven choice (`tailnet_dgx_whisper_speaches` in
# src/podcast_scraper/providers/ml/model_registry.py).
#
# 2026-06-16 (#955 reopen + #952 close): flipped back from
# `large-v3` on :8002 (whisper-openai wrapper) to
# `Systran/faster-whisper-large-v3` on :8000 (Speaches).
#
# History — the routing went :8000 → :8002 on 2026-06-10/12 based on
# `EVAL_TRANSCRIPTION_3WAY_2026_06.md` (v2 fixtures), which reported
# whisper-openai at 4.6× realtime vs Speaches at 0.93× realtime.
# That decision predated the Speaches int8 pin (#948) and the
# `v0.9.0-rc.3-cuda` image bump (#920) — Speaches was on the slow
# `default` (fp32) compute type when measured. The 2026-06-15 #920 pin
# + #948 empirical re-confirmation cut Speaches per-episode wall-time
# by ~3× (Speaches int8 = 4.89× realtime on a 33-min real episode).
#
# Today's #952 real-podcast eval on the post-#948 image overturns
# the routing decision on both metrics:
#
# | metric                 | whisper-openai (:8002) | Speaches int8 (:8000) |
# | ---------------------- | ---------------------- | --------------------- |
# | WER vs Deepgram silver | 12.97%                 | 10.23% ← better       |
# | wall-clock per episode | 340s mean              | 281s mean (~20% fast) |
#
# Speaches now wins on both quality AND speed. Eval report:
# `docs/guides/eval-reports/EVAL_WHISPER_ENGINE_DRIFT_2026_06_16.md`.
#
# The whisper-openai container stays parallel-deployed at :8002 as the
# comparison sibling for future engine-drift evals — not the prod path.
dgx_whisper_model: deepdml/faster-whisper-large-v3-turbo-ct2
dgx_whisper_port: 8000
transcription_fallback_provider: deepgram
deepgram_model: nova-3

screenplay: true
diarize: true

# Diarization on DGX via pyannote-server (#926). Falls back to in-process
# pyannote on health-check failure or per-request error (the
# TailnetDgxDiarizationProvider handles fallback; no separate
# `diarization_fallback_provider` config needed).
diarization_provider: tailnet_dgx
dgx_diarize_port: 8001
dgx_diarize_model: pyannote/speaker-diarization-community-1

audio_preprocessing_profile: speech_optimal_v1

speaker_detector_provider: litellm
auto_speakers: true

summary_provider: litellm

# 2026-08-28: LLM stages run deepseek-v4-flash through the homelab LiteLLM gateway — the same
# wiring cloud_balanced uses in prod, so this profile's cloud half is the proven one and only
# its ASR half (DGX faster-whisper) is new. Depends on the gateway being reachable from the
# pipeline host (tailnet) and carrying the OpenRouter key; prod overrides api_base with the
# tailnet IP in its operator YAML.
# LAPTOP-DEV DEFAULT, not where prod routes. The homelab is observability-only and is never
# on an LLM path; prod pins its own VPS gateway into viewer_operator.yaml on every deploy
# (the D4 pin). See ADR-142 + AGENTS.md 'Deployment topology'.
litellm_api_base: http://homelab:4001/v1
litellm_insight_model: podcast-flash-0731
litellm_temperature: 0.3
litellm_extra_body:
  reasoning:
    enabled: false
  provider:
    order:
      - novita
      - deepinfra
    allow_fallbacks: true
litellm_verify_served_model: true

preprocessing_enabled: true
llm_pipeline_mode: mega_bundled
cloud_llm_structured_min_output_tokens: 4096

generate_gi: true
# Registry-governed: `make profiles-materialize` writes this from the GI StageOption this
# profile's preset selects. Do not hand-tune it here — profiles-check will fail you.
# The cap is deliberately preset-dependent, not one global default: the v2.5 finale lowered
# it for the cloud flash summarisers (they saturate earlier than gemini), while the
# gemini-era v3 tuning keeps the higher one. Both values are measured — see the
# StageOption's research_ref for the report that justified each.
# No number is quoted in this comment on purpose. The previous version said prod ran one
# value while every eval ran another, which had been TRUE of a since-fixed mismatch and
# read as a live defect long after it was resolved: it sent a reader auditing this file to
# 'correct' a researched value back into a hand-edit. A value restated in prose beside a
# machine-owned field is precisely how this one came to have three different answers.
gi_max_insights: 50
gi_require_grounding: true
gil_evidence_quote_mode: bundled
gil_evidence_nli_mode: bundled

generate_kg: true
kg_extraction_source: provider
kg_max_topics: 10
kg_max_entities: 15

vector_search: true
vector_embedding_provider: sentence_transformers
llm_circuit_breaker_enabled: true

generate_metadata: true
generate_summaries: true
language: en
log_level: INFO

# -----------------------------------------------------------------------------
# RFC-088 chunk-7 enricher set (advisory mirror of profile_sets.py)
# -----------------------------------------------------------------------------
# The Python matrix at src/podcast_scraper/enrichment/profile_sets.py is
# the source of truth; this block reflects the 'cloud_with_dgx_primary' row so
# operators can discover the active set without reading code.
# Per-enricher knobs (cost caps, thresholds) live under enrichers.<id>.
enrichment:
  enabled: true
  enrichers:
    topic_cooccurrence_corpus: {}
    topic_theme_clusters: {}
    temporal_velocity: {}
    grounding_rate: {}
    guest_coappearance: {}
    insight_density: {}
    insight_sentiment: {}
    topic_similarity:
      provider:
        type: sentence_transformer_local
        model: all-MiniLM-L6-v2
    topic_consensus:
      provider:
        type: consensus_local
        embed_model: all-MiniLM-L6-v2

# --- GI quality gates (wired 2026-07-14) -----------------------------------------------------------
# Every knob below defaulted OFF or to a stale value, and NO profile set any of them. The value
# gate — the judge that removes filler — therefore never ran in production at all; it ran only in
# evals, which is how the eval and the product came to measure different pipelines.
gi_value_gate_enabled: true
# PIN the judge. A model grading its own output is lenient (#939), and if each arm is filtered by a
# different strictness the surviving counts are not comparable. Vendor-disjoint from the extractor.
gi_value_gate_provider: litellm
gi_value_gate_model: podcast-pro-0829
gi_value_gate_min_tier: 2
# The same claim twice is not two insights. The judge grades each one ALONE, so it cannot see
# redundancy: measured on the real corpus, 35% of one model's insights restated an earlier one.
gi_insight_dedupe_threshold: 0.75
# PINNED, not defaulted. v3 (the speech-act variant) LOST its A/B — route kappa 0.57 against
# v2's 0.67 — and stays on disk only as the record of that measurement. Naming the winner
# here means a future change of default cannot silently move this profile off it.
# Pinned so a reprocess is REPRODUCIBLE and so the eval measures the model, not the sampler.
# Left unset, extraction samples at the provider default (0.3) and the same episode yields
# different insights on every run — noise a model comparison reports as model quality.
gi_insight_temperature: 0.0
gi_insight_prompt_version: v2
# An LLM grounds with an LLM. `gil_evidence_*_mode: bundled` above is an LLM-only path, and with
# the provider left at its "transformers" default it did nothing — these profiles asked for bundled
# LLM grounding and got local DeBERTa.
quote_extraction_provider: litellm
entailment_provider: litellm

# --- registry-materialized (make profiles-materialize) — do not hand-edit ---
transcription_provider: tailnet_dgx_whisper
summary_model: podcast-flash-0731
topic_cluster_threshold: 0.75
insight_cluster_threshold: 0.75
gi_insight_chunk_chars: 30000
gi_qa_score_min: 0.3
gi_nli_entailment_min: 0.75
gil_evidence_match_summary_provider: true
transcription_fallback_providers: [tailnet_dgx_whisper, whisper, deepgram]
diarization_fallback_providers: [local, deepgram]
resilience_run_context: serve
resilience_failure_strategy: failover
transcription_coverage_min: 0.0
enforce_model_governance: false
transcription_coverage_failover_model: OpenMOSS-Team/MOSS-Transcribe-Diarize
transcription_coverage_failover_provider: moss
transcription_speech_coverage_min: 0.85
summary_fallback_providers: [deepseek]
litellm_summary_model: podcast-flash-0731
litellm_speaker_model: podcast-flash-0731
ner_model: en_core_web_trf
