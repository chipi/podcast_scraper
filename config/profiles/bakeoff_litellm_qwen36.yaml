# Bake-off profile (#1356): v2.4 pipeline/quality with the LLM stages swapped to the homelab
# LiteLLM gateway routing to OpenRouter Qwen3.6-35B-A3B (reasoning OFF). Bespoke (not a registry
# preset) — used for the DGX-offline model bake-off via `--pipeline-stage enrich_only` over FROZEN
# v2.4 transcripts (no ASR/diarization). Swap litellm_*_model to bake off another alias.

# Transcription/diarization are NOT run under enrich_only (frozen transcripts reused); kept local so
# nothing depends on the offline DGX.
transcription:
  primary: whisper
diarize: false
screenplay: true

# --- LLM stages: ALL via the LiteLLM gateway (Qwen3.6), reasoning off ---
summary_provider: litellm
speaker_detector_provider: litellm
quote_extraction_provider: litellm
entailment_provider: litellm
kg_extraction_provider: litellm
auto_speakers: true
llm_pipeline_mode: staged

# LAPTOP-DEV DEFAULT, not where prod routes. The homelab is observability-only and is never
# on an LLM path; prod pins its own VPS gateway into viewer_operator.yaml on every deploy
# (the D4 pin). See ADR-142 + AGENTS.md 'Deployment topology'.
litellm_api_base: http://homelab:4001/v1
litellm_summary_model: homelab-qwen
litellm_speaker_model: homelab-qwen
litellm_cleaning_model: homelab-qwen
litellm_insight_model: homelab-qwen
litellm_temperature: 0.3
litellm_extra_body:
  reasoning:
    enabled: false
litellm_verify_served_model: true

degradation_policy:
  continue_on_stage_failure: true
preprocessing_enabled: true
cloud_llm_structured_min_output_tokens: 4096

# --- GI / KG (same knobs as prod_dgx_full) ---
generate_gi: true
gi_max_insights: 50
gi_require_grounding: true
gil_evidence_quote_mode: bundled
gil_evidence_nli_mode: bundled
gil_evidence_match_summary_provider: true
generate_kg: true
kg_extraction_source: provider
kg_max_topics: 10
kg_max_entities: 15
gi_value_gate_enabled: true
gi_value_gate_min_tier: 2
gi_insight_dedupe_threshold: 0.75
gi_insight_temperature: 0.0
gi_insight_prompt_version: v2
gi_insight_chunk_chars: 30000
gi_qa_score_min: 0.3
gi_nli_entailment_min: 0.75
topic_cluster_threshold: 0.75
insight_cluster_threshold: 0.75

vector_search: true
vector_embedding_provider: sentence_transformers
llm_circuit_breaker_enabled: true
generate_metadata: true
generate_summaries: true
language: en
log_level: INFO
ner_model: en_core_web_trf

# Corpus-enrichment layer (required top-level block; operators read the YAML to see what's active).
enrichment:
  enabled: true
  enrichers:
    topic_cooccurrence_corpus: {}
    topic_theme_clusters: {}
    temporal_velocity: {}
    grounding_rate: {}
    guest_coappearance: {}
    insight_density: {}
    insight_sentiment: {}
    topic_similarity:
      provider:
        type: sentence_transformer_local
        model: all-MiniLM-L6-v2
    topic_consensus:
      provider:
        type: consensus_local
        embed_model: all-MiniLM-L6-v2

# registry status: yaml-only — research bake-off arm, fully specified inline; intentionally
# NOT a _PROFILE_PRESETS entry (removed the self-referential `profile:` key 2026-08-07 to opt out
# of registry-drift checking, per the drift test design for experiment configs).
