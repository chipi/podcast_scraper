# Bake-off profile (#1356): v2.4 pipeline/quality with the LLM stages swapped to the homelab
# LiteLLM gateway routing to OpenRouter deepseek-v4-flash-0731 (reasoning OFF). Bespoke (not a
# registry preset) — used for the DGX-offline model bake-off via `--pipeline-stage enrich_only`
# over FROZEN v2.4 transcripts (no ASR/diarization). Sibling of bakeoff_litellm_qwen36.yaml.
#
# Provider routing: qwen3.6 is only reachable via DeepInfra's rate-limited shared pool (needs BYOK
# for real throughput); deepseek-flash-0731 is reachable via Novita WITHOUT BYOK and sustains the
# real pipeline's call rate, so this is the runnable candidate today. `provider.order` prefers Novita
# then DeepInfra as fallback.

transcription:
  primary: whisper
diarize: false
screenplay: true

# --- LLM stages: ALL via the LiteLLM gateway (deepseek-v4-flash-0731), reasoning off ---
summary_provider: litellm
speaker_detector_provider: litellm
quote_extraction_provider: litellm
entailment_provider: litellm
kg_extraction_provider: litellm
auto_speakers: true
llm_pipeline_mode: staged

# LAPTOP-DEV DEFAULT, not where prod routes. The homelab is observability-only and is never
# on an LLM path; prod pins its own VPS gateway into viewer_operator.yaml on every deploy
# (the D4 pin). See ADR-142 + AGENTS.md 'Deployment topology'.
litellm_api_base: http://homelab:4001/v1
litellm_summary_model: homelab-qwen37-flash
litellm_speaker_model: homelab-qwen37-flash
litellm_cleaning_model: homelab-qwen37-flash
litellm_insight_model: homelab-qwen37-flash
litellm_temperature: 0.3
litellm_extra_body:
  reasoning:
    enabled: false
litellm_verify_served_model: true

degradation_policy:
  continue_on_stage_failure: true
preprocessing_enabled: true
cloud_llm_structured_min_output_tokens: 4096

# Tuning loop iter-1 (#1356): the OpenAI client read timeout is max(base, summarization_timeout,
# transcription_timeout) = 30min by default — so a stalled GI call on a long episode hung ~7min+
# with no failover. relabel_only does NO ASR, so both can be low: a stalled chat call now fails at
# ~180s and hits gateway retries + the novita->deepinfra provider fallback instead of hanging.
# iter-2: 180s was too aggressive — it killed legit-slow chunked-GI passes on long episodes and
# caused retry churn (Sam Altman ~9min). 300s still fast-fails a true hang (was 30min) but lets a
# genuine long pass finish.
summarization_timeout: 600
transcription_timeout: 300

# iter-2: the default summary cap is 650 tokens (LED-base sized). deepseek's verbose summary JSON on
# long episodes exceeds it and truncates (finish_reason=length -> invalid/incomplete). Raise to 2048
# (well under the 8192 model output cap). Only max/min are read on the cloud path.
summary_reduce_params:
  max_new_tokens: 2048
  min_new_tokens: 100

# --- GI / KG (same knobs as prod_dgx_full) ---
generate_gi: true
# Tuning loop iter-1 (#1356): deepseek fills the insight cap far less selectively than Gemini
# (9x more insights, 5x more quotes) — rein in via a tighter per-pass cap, stricter value gate,
# and more aggressive dedup. gi_max_insights is the per-pass FLOOR scaled by episode length.
gi_max_insights: 12
gi_require_grounding: true
gil_evidence_quote_mode: bundled
gil_evidence_nli_mode: bundled
gil_evidence_match_summary_provider: true
generate_kg: true
kg_extraction_source: provider
kg_max_topics: 10
kg_max_entities: 15
gi_value_gate_enabled: true
gi_value_gate_min_tier: 3
# iter-3: dedup DROPS an insight when cosine-sim to a kept one >= threshold, so LOWER = more
# aggressive (iter-1's 0.82 was less aggressive than the 0.75 default — wrong way). 0.72 trims
# near-duplicate insights -> fewer grounding calls (cheaper) with no quality cost (judge wins hold).
gi_insight_dedupe_threshold: 0.72
gi_insight_temperature: 0.0
gi_insight_prompt_version: v2
gi_insight_chunk_chars: 30000
gi_qa_score_min: 0.3
gi_nli_entailment_min: 0.75
topic_cluster_threshold: 0.75
insight_cluster_threshold: 0.75

vector_search: true
vector_embedding_provider: sentence_transformers
llm_circuit_breaker_enabled: true
generate_metadata: true
generate_summaries: true
language: en
log_level: INFO
ner_model: en_core_web_trf

# Corpus-enrichment layer (required top-level block; operators read the YAML to see what's active).
enrichment:
  enabled: true
  enrichers:
    topic_cooccurrence_corpus: {}
    topic_theme_clusters: {}
    temporal_velocity: {}
    grounding_rate: {}
    guest_coappearance: {}
    insight_density: {}
    insight_sentiment: {}
    topic_similarity:
      provider:
        type: sentence_transformer_local
        model: all-MiniLM-L6-v2
    topic_consensus:
      provider:
        type: consensus_local
        embed_model: all-MiniLM-L6-v2

# registry status: yaml-only — research bake-off arm, fully specified inline; intentionally
# NOT a _PROFILE_PRESETS entry (removed the self-referential `profile:` key 2026-08-07 to opt out
# of registry-drift checking, per the drift test design for experiment configs).
