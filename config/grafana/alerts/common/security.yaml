# Common security alert rules (T-11 / ADR-117) — the box + edge substrate.
#
# Grafana alerting provisioning format. These fire on the host journal logs shipped to
# VictoriaLogs by the Alloy host pipeline, selected by instance:prod-podcast + unit:*.
# The sync (`scripts/obs/grafana_sync.py`) resolves ${LOKI_UID} from the target account's
# logs datasource and posts to the Grafana provisioning API.
#
# VictoriaLogs LogsQL, NOT Loki LogQL (#1819 drill finding, 2026-08-25): the original
# sum(count_over_time({tenant="common", unit=...}[5m])) exprs failed to parse against the
# victoriametrics-logs-datasource on every evaluation — Grafana logged
# 'cannot parse `query` arg' each cycle and execErrState masked it, so this whole family
# had NEVER evaluated. Same disease enrichment.yaml had; same cure. Every expr below was
# validated live via /select/logsql/query before provisioning, and the field shape too:
# host journal lines carry instance + unit (unit:ssh.service, unit:fail2ban.service), and
# there is no tenant= label in VictoriaLogs.
#
# Rules are intentionally conservative starters — tune thresholds against real traffic.
# Measured baseline 2026-08-25 (7 days): 0 SSH auth failures, 0 fail2ban bans — the box
# journal itself agrees (tailnet-only SSH), so quiet rules here are TRUE quiet.
apiVersion: 1

groups:
  - orgId: 1
    name: security-common
    folder: "Common (Box & Edge)"
    interval: 1m
    rules:
      # --- SSH brute force / auth-failure spike -----------------------------------
      - uid: sec-common-ssh-authfail
        title: "SSH auth failures spiking"
        condition: threshold
        for: 5m
        # Parse/eval failure must FAIL the rule loudly, not mask as no-data — masking is
        # how the LogQL exprs sat broken since provisioning.
        execErrState: Error
        labels: { tenant: common, severity: warning, kind: security }
        annotations:
          summary: "Elevated SSH auth failures on the prod VPS (possible brute force)."
        data:
          - refId: rate
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: ${LOKI_UID}
            model:
              expr: 'instance:prod-podcast unit:ssh.service ("Failed password" OR "authentication failure" OR "Invalid user") | stats count() as n'
              queryType: stats
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: rate
              conditions: [{ evaluator: { type: gt, params: [20] } }]

      # --- fail2ban ban (any ban is worth surfacing) ------------------------------
      - uid: sec-common-fail2ban-ban
        title: "fail2ban issued a ban"
        condition: threshold
        for: 0m
        execErrState: Error
        labels: { tenant: common, severity: info, kind: security }
        annotations:
          summary: "fail2ban banned a host — someone tripped a jail."
        data:
          - refId: rate
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: ${LOKI_UID}
            model:
              expr: 'instance:prod-podcast unit:fail2ban.service " Ban " | stats count() as n'
              queryType: stats
          - refId: threshold
            datasourceUid: __expr__
            model:
              type: threshold
              expression: rate
              conditions: [{ evaluator: { type: gt, params: [0] } }]

# NOT YET COVERED (deliberately — each needs plumbing or live tuning, tracked so
# it isn't a silent gap; #1160 / ADR-117 §Sequencing):
#   - Caddy edge 5xx anomaly + GlitchTip ingest flood: REMOVED as rules (2026-08-25,
#     #1819). Caddy's access logs exist only as size-rotated FILES on the box
#     (/var/log/caddy/access-*.log) — no Alloy pipeline ships them, so both rules had
#     no data source and could never fire: a check that cannot fail reads as coverage.
#     Prerequisite to restore them: an Alloy file source for /var/log/caddy/access.log
#     (host pipeline), then re-add the rules with LogsQL over the shipped fields.
#   - metadata-egress DROP hits: block-metadata-egress.sh DROPs silently (no LOG
#     target), so there's no signal to alert on. Adding it needs an iptables
#     `-j LOG` rule + kmsg/journal shipping in Alloy BEFORE a rule can fire.
#   - host disk-full / inode / cert-expiry: these are Prometheus (node_exporter)
#     metrics, not log rules — add under a `prometheus`-datasource rule group.
#   - per-tenant app-security (auth-fail spikes, per-app 4xx/5xx, egress anomalies)
#     is Goals 2/3 (each tenant owns its own alerts/<tenant>/ file).
# Thresholds above are conservative starters — retune against real traffic (measured
# 2026-08-25: both rules read TRUE zero over 7 days; the box journal agrees).
