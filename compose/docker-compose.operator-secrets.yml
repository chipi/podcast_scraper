# Operator secret delivery overlay — ADR-115 Option A (files-in-tmpfs), mirroring
# docker-compose.player-secrets.yml scoped to the OPERATOR-PUBLIC tenant.
#
# Joined by deploy-operator.sh ONLY when OPERATOR_SECRETS_VIA_FILES=1. The operator-public
# api runs the same image as the player/operator api, whose baked entrypoint is the shim
# (docker/secrets-shim.sh, ENTRYPOINT ["/secrets-shim.sh"]): it reads /run/secrets/*, exports
# each file as its UPPERCASED env var, then execs the real entrypoint. So a file
# `app_session_secret` becomes env `APP_SESSION_SECRET` — no secret in the host/compose env
# and none at rest on disk (source files live in /dev/shm = RAM).
#
# Per-tenant isolation (ADR-115 §2): the operator's plaintext source files live in
# /dev/shm/operator-secrets/ — DISTINCT from the player's /dev/shm/player-secrets/ and the
# privileged stack's /dev/shm/podcast-secrets/ — staged fresh from GH Secrets on every deploy
# (deploy-operator.yml "Stage tmpfs secret files"). GH Secrets stays the private source of
# truth (public repo → no sops ciphertext committed, Option A).
#
# Runtime secrets moved off .env.operator: the Google OAuth client secret (the player's
# client, reused per RFC-108), the session signing secret, and the backend Sentry DSN. These
# are the exact three the deploy DROPS from .env.operator under Option A.

services:
  api:
    secrets:
      - app_oauth_google_client_secret
      - app_session_secret
      - podcast_sentry_dsn_api

secrets:
  app_oauth_google_client_secret:
    file: /dev/shm/operator-secrets/app_oauth_google_client_secret
  app_session_secret:
    file: /dev/shm/operator-secrets/app_session_secret
  podcast_sentry_dsn_api:
    file: /dev/shm/operator-secrets/podcast_sentry_dsn_api
