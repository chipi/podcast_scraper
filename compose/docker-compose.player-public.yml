# Public consumer player (#1163 / ADR-116 — player-first launch).
#
# A STANDALONE composition (do NOT merge with the privileged operator stack): the
# consumer player + a LOW-PRIVILEGE app-only backend. The backend runs with
# PODCAST_SERVE_APP_ONLY=1 so it mounts ONLY /api/app/* + health — no operator/read
# /api/* surface — and therefore carries **no docker.sock and no provider keys**. That
# is what makes it safe to expose on the public edge (ADR-114) behind the player domain.
#
#   docker compose -f compose/docker-compose.player-public.yml up -d --build
#
# The operator/kg-gi surface stays on the tailnet stack, untouched. Corpus is shared
# read-only from the operator stack's volume.

services:
  # Low-privilege consumer API backend. Named `api` so the player's baked nginx upstream
  # (http://api:8000) resolves to it — NOT the privileged operator api (absent here).
  api:
    image: ghcr.io/chipi/podcast-scraper-stack-api:${PODCAST_IMAGE_TAG:-main}
    restart: unless-stopped
    ports:
      # Tailnet-only delivery-outbox seam (#1412 / ADR-145): the homelab delivery worker
      # polls /internal/outbox/* here over the tailnet (token-gated by INTERNAL_OUTBOX_TOKEN).
      # PLAYER_OUTBOX_LISTEN is set to the box's OWN tailnet IP by deploy-player.sh; the
      # loopback default means NO exposure when unset. This is the low-privilege app-only api
      # (no docker.sock, no LLM keys — the separate least-privilege plane), so binding it to
      # the trusted tailnet is safe and is the sanctioned seam transport (NOT the public edge).
      - "${PLAYER_OUTBOX_LISTEN:-127.0.0.1}:${PLAYER_OUTBOX_PORT:-8099}:8000"
    environment:
      PODCAST_SERVE_APP_ONLY: "1"
      # NOTE: this app_only backend does NOT run the in-process job scheduler — app.py force-
      # disables enable_jobs_api under app_only (ADR-116 belt-and-suspenders), so it never reads
      # a scheduled_jobs config. The "Your Week" digest cadence is owned by the `digest-scheduler`
      # sidecar below (it calls the same assembler on an interval). Do NOT re-add a
      # PODCAST_SERVE_CONFIG_FILE here expecting it to schedule — it would be inert.
      # Real Google OIDC in prod (NEVER APP_OAUTH_PROVIDER=mock). provider_from_env()
      # selects Google when these creds are present. Redirect URI to register in Google:
      #   https://<player-domain>/api/app/auth/callback
      # The two SECRET values (session secret, Google client secret) are staged securely
      # at deploy (GH secret -> env now; ADR-115 sops file-mounts later). client_id is
      # not secret. APP_ADMIN_EMAILS is unset — player users are listeners/creators.
      # Explicit provider switch (this is the prod player — always Google, never mock).
      APP_OAUTH_PROVIDER: google
      APP_OAUTH_GOOGLE_CLIENT_ID: ${APP_OAUTH_GOOGLE_CLIENT_ID:-}
      APP_OAUTH_GOOGLE_CLIENT_SECRET: ${APP_OAUTH_GOOGLE_CLIENT_SECRET:-}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-}
      # Delivery seam (#1412/#1415): the infra worker authenticates to /internal/outbox/*
      # with this shared token (X-Internal-Token); empty → the endpoints 503 (disabled).
      # APP_VAPID_PUBLIC_KEY is the PUBLIC half of the worker's VAPID key, served to the
      # browser by GET /api/app/push/vapid-key so push subscriptions bind to the worker's
      # keypair (the private half never leaves the homelab worker). Public value.
      INTERNAL_OUTBOX_TOKEN: ${INTERNAL_OUTBOX_TOKEN:-}
      APP_VAPID_PUBLIC_KEY: ${APP_VAPID_PUBLIC_KEY:-}
      APP_SESSION_COOKIE_SECURE: "true"
      # Trust X-Forwarded-* — this backend is only reachable via its own nginx proxy on
      # the compose network, so uvicorn can honor the forwarded scheme/host and derive the
      # OAuth callback as https://<player-domain>/... (#1163).
      FORWARDED_ALLOW_IPS: "*"
      APP_DATA_DIR: /app/appdata
      PODCAST_SENTRY_DSN_API: ${PODCAST_SENTRY_DSN_API:-}
      # Tags backend Sentry events as prod (sentry_init reads PODCAST_ENV, default dev).
      # Must be listed here — the --env-file only feeds compose interpolation, not the
      # container env, so a var absent from this block never reaches the process.
      PODCAST_ENV: ${PODCAST_ENV:-dev}
      # Sign-in access policy (server/app_access.py). The backend default is
      # allowlist + EMPTY list = DEFAULT-DENY: every account gets "This account is not
      # allowed to sign in." Must be listed here (see note above) or the values in
      # .env.player never reach the process. `allowlist` = only APP_ALLOWED_EMAILS /
      # APP_ALLOWED_DOMAINS may sign in; `open` = any successful Google login is allowed.
      APP_SIGNUP_MODE: ${APP_SIGNUP_MODE:-allowlist}
      APP_ALLOWED_EMAILS: ${APP_ALLOWED_EMAILS:-}
      APP_ALLOWED_DOMAINS: ${APP_ALLOWED_DOMAINS:-}
      # Bootstrap admins (CSV of emails). Applied on login (admin allowlist > creator grant >
      # existing role; never downgraded) → the listed accounts hold `admin` durably, which is what
      # gates the operator surfaces + granting `mcp_access`. Empty → no bootstrap admins.
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:-}
      # Remote MCP (RFC-112). This app-only backend hosts the OAuth 2.1 authorization server
      # (/api/app/mcp/oauth/*, /.well-known/oauth-authorization-server) AND the internal verify
      # seam (/internal/mcp/verify — reached by the `mcp` service over the compose network only,
      # NOT via the public nginx). INTERNAL_MCP_TOKEN gates that seam (unset → 503, so the seam is
      # off by default). Issuer = this player origin; resource = the mcp subdomain (shown by
      # /api/app/mcp/config). Empty INTERNAL_MCP_TOKEN keeps the whole MCP surface inert.
      INTERNAL_MCP_TOKEN: ${INTERNAL_MCP_TOKEN:-}
      APP_MCP_ISSUER_URL: ${APP_MCP_ISSUER_URL:-}
      APP_MCP_RESOURCE_URL: ${APP_MCP_RESOURCE_URL:-}
      # OTEL distributed tracing (ADR-119) — mirror the operator (vps-prod.yml). The api
      # image already wraps the process in `opentelemetry-instrument` (auto FastAPI + HTTP
      # spans); flipping the exporter to otlp + pointing at the homelab VictoriaTraces OTLP
      # ingest turns player API request spans ON, so a user-triggered error on the player
      # surface pivots to its trace. Exporter + endpoint + homelab tailnet IP are staged
      # host-side by deploy-player.sh (never hardcoded); default `none` = tracing off, and
      # an unreachable endpoint is non-fatal (the SDK logs + drops, the app keeps serving).
      OTEL_SERVICE_NAME: player-api
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      # Metrics/logs OTLP export OFF (like the operator, stack.yml): metrics already flow via
      # Alloy scrape, and — crucially — the default OTLP exporter is gRPC (`otlp_proto_grpc`),
      # which is NOT installed (only the http/protobuf exporter is). Leaving these at their
      # `otlp` default made `opentelemetry-instrument` abort ALL init ("Requested component
      # 'otlp_proto_grpc' not found") → the player exported no traces at all. Only traces
      # export, over http/protobuf.
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      # G1: stamp the active trace_id/span_id on every request log line (LoggingInstrumentor)
      # so a player log pivots to its trace. G4: drop /health spans so probe traffic doesn't
      # drown real user requests in VictoriaTraces. Inert unless tracing is on.
      OTEL_PYTHON_LOG_CORRELATION: "true"
      OTEL_PYTHON_FASTAPI_EXCLUDED_URLS: "health"
    extra_hosts:
      # VictoriaTraces (+ GlitchTip) are addressed by Tailscale MagicDNS name `homelab`,
      # which Docker's embedded DNS can't resolve — static hosts entry, IP resolved fresh at
      # deploy by deploy-player.sh (`tailscale ip -4 homelab`), never hardcoded. Default is
      # loopback so compose interpolation never fails when tracing is off.
      - "homelab:${HOMELAB_TAILNET_IP:-127.0.0.1}"
    volumes:
      # Corpus is READ-ONLY here — the consumer plane reads it; per-user data is separate.
      - corpus_data:/app/output:ro
      # Per-user consumer data (playback/notes/favorites) — a HOST bind mount (like the
      # corpus) so it lives on the host FS: backupable (backup-player-appdata-prod.yml),
      # survives a container/volume prune, and operator-visible. #3.
      - ${PLAYER_APPDATA_HOST_PATH:-/srv/podcast-scraper/player-appdata}:/app/appdata
    # Hardening (#1160 T-04): no sock, no keys, drop caps. NOT read_only (entrypoint
    # chown + app-data writes). Boot profile matches the operator api (verified there).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID

  # Remote MCP server (RFC-112) — the SAME low-privilege api image, but run as the corpus MCP
  # over Streamable HTTP instead of the app. It authenticates every connection by presenting the
  # bearer to `api`'s tailnet-only /internal/mcp/verify (it never mounts the user store) and serves
  # the read-only corpus tools. Fronted publicly by its own vhost (mcp.<domain>, Caddy → :8009);
  # bearer-auth is enforced in-process. No docker.sock, no provider keys (app-only image), corpus RO.
  # Inert unless INTERNAL_MCP_TOKEN is set (verify fails closed → every connect 401s).
  mcp:
    image: ghcr.io/chipi/podcast-scraper-stack-api:${PODCAST_IMAGE_TAG:-main}
    restart: unless-stopped
    command:
      - "python"
      - "-m"
      - "podcast_scraper.cli"
      - "mcp"
      - "--transport"
      - "http"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8009"
      - "--corpus"
      - "/app/output"
    environment:
      # Where the bearer is verified (compose-network DNS name `api`, never the public edge).
      APP_MCP_VERIFY_URL: http://api:8000/internal/mcp/verify
      INTERNAL_MCP_TOKEN: ${INTERNAL_MCP_TOKEN:-}
      # This server's own public URL (the OAuth `resource`) + the authorization server (the app).
      APP_MCP_RESOURCE_URL: ${APP_MCP_RESOURCE_URL:-}
      APP_MCP_ISSUER_URL: ${APP_MCP_ISSUER_URL:-}
      # Optional browser DNS-rebind guard. claude.ai connects server-side (no Origin), so leaving
      # this empty is safe; set it (e.g. https://claude.ai) to lock the browser surface down.
      APP_MCP_ALLOWED_ORIGINS: ${APP_MCP_ALLOWED_ORIGINS:-}
      PODCAST_ENV: ${PODCAST_ENV:-dev}
      # o11y parity with the api (#1505). Traces: init_otel() + inbound ASGI spans + per-tool
      # spans (mcp/telemetry.py) export over http/protobuf to the homelab VictoriaTraces OTLP
      # ingest. Errors: its own GlitchTip DSN (per-surface split). Default `none`/empty = off;
      # deploy-player.sh stages the exporter + endpoint + DSN host-side (never hardcoded).
      OTEL_SERVICE_NAME: player-mcp
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_PYTHON_LOG_CORRELATION: "true"
      # Env-tag traces so staging (laptop) and prod (VPS) split in Grafana (parity with the
      # GlitchTip `environment` tag, which init_sentry already sets from PODCAST_ENV).
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
      PODCAST_SENTRY_DSN_MCP: ${PODCAST_SENTRY_DSN_MCP:-}
      # Umami server-side analytics (#1505): each tool call is an event, like a page view. Website
      # id + collect URL from deploy; both empty → no-op. Hostname stamps the event's origin.
      PODCAST_MCP_UMAMI_WEBSITE_ID: ${PODCAST_MCP_UMAMI_WEBSITE_ID:-}
      PODCAST_MCP_UMAMI_URL: ${PODCAST_MCP_UMAMI_URL:-}
      PODCAST_MCP_UMAMI_HOSTNAME: ${APP_MCP_RESOURCE_URL:-mcp}
    extra_hosts:
      # VictoriaTraces + GlitchTip via Tailscale MagicDNS `homelab` (Docker DNS can't resolve it);
      # static hosts entry, IP staged fresh at deploy. Loopback default so interpolation never
      # fails when tracing is off. Mirrors the api service.
      - "homelab:${HOMELAB_TAILNET_IP:-127.0.0.1}"
    ports:
      # Loopback only — the Caddy edge (mcp.caddy) is the public front (ADR-114).
      - "127.0.0.1:${MCP_PORT:-8009}:8009"
    volumes:
      # Read-only corpus — the MCP tools only read; per-user data stays on `api` (verify seam).
      - corpus_data:/app/output:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    # Liveness: the public discovery doc must answer 200 (it also proves the ASGI app + auth
    # middleware booted). Without this a crash-looping mcp would still get a public vhost pointing at
    # a dead upstream → 502s on a public surface (review M3).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8009/.well-known/oauth-protected-resource"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  # Observability-control-plane MCP (#803, #56) — the SECOND MCP on the VPS. An agent
  # (claude.ai) connects to see prod health: metrics/logs/traces/errors/alerts/deploys.
  # Own image (podcast-obs), own public vhost (obs.caddy), but the SAME admin-gated verify
  # seam as the content mcp above: it presents the bearer to `api`'s /internal/mcp/verify and
  # requires the ADMIN grant (APP_MCP_REQUIRE_ADMIN=true) — so only the operator can reach it.
  obs:
    image: ghcr.io/chipi/podcast-obs:${PODCAST_IMAGE_TAG:-main}
    restart: unless-stopped
    command:
      - "serve"
      - "--transport"
      - "http"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8848"
    environment:
      # Admin-gated remote-MCP auth — SAME seam as the content mcp, one extra requirement.
      APP_MCP_VERIFY_URL: http://api:8000/internal/mcp/verify
      INTERNAL_MCP_TOKEN: ${INTERNAL_MCP_TOKEN:-}
      APP_MCP_REQUIRE_ADMIN: "true"
      APP_MCP_RESOURCE_URL: ${OBS_MCP_RESOURCE_URL:-}
      APP_MCP_ISSUER_URL: ${APP_MCP_ISSUER_URL:-}
      APP_MCP_ALLOWED_ORIGINS: ${APP_MCP_ALLOWED_ORIGINS:-}
      PODCAST_ENV: ${PODCAST_ENV:-dev}
      # What obs reads. The YAML uses `<field>_env:` indirection so tokens stay out of the file;
      # deploy stages the config + these tokens. Backends are homelab (over Tailscale MagicDNS
      # `homelab`) — VictoriaMetrics/VictoriaLogs are tailnet-open; GlitchTip reuses the existing
      # SENTRY_AUTH_TOKEN; Grafana needs its own SA read token; GitHub is optional. Each source
      # degrades to "not configured" when its token is absent (config/observability.example.yaml).
      PODCAST_OBS_CONFIG: /config/observability.yaml
      PODCAST_OBS_GRAFANA_TOKEN: ${PODCAST_OBS_GRAFANA_TOKEN:-}
      PODCAST_OBS_GITHUB_TOKEN: ${PODCAST_OBS_GITHUB_TOKEN:-}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
    extra_hosts:
      # Reach the homelab observability backends (Grafana/VM/VLogs/GlitchTip) via Tailscale
      # MagicDNS `homelab`; Docker DNS can't resolve it, so a static entry, IP staged at deploy.
      - "homelab:${HOMELAB_TAILNET_IP:-127.0.0.1}"
    ports:
      # Loopback only — the Caddy edge (obs.caddy) is the public front (ADR-114).
      - "127.0.0.1:${OBS_MCP_PORT:-8848}:8848"
    volumes:
      # The observability targets/sources config (read-only). No corpus mount — obs never
      # touches the corpus; it only reads the observability backends. Compose resolves a relative
      # host path against THIS file's dir (compose/), so `../observability.yaml` = the repo/box
      # root beside the compose file — the same `../` convention as the other services here, and it
      # MUST match where deploy-player.yml scp's the config (/srv/podcast-scraper/observability.yaml).
      - ${OBS_CONFIG_HOST_PATH:-../observability.yaml}:/config/observability.yaml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Liveness: the public discovery doc must answer 200 (also proves the ASGI app + admin auth
    # middleware booted). Without it a crash-looping obs would still get a public vhost → 502s.
    # python probe, NOT curl — the obs image is bare python:3.12-slim (no curl). urlopen raises on
    # 503/refused, so this also proves the middleware booted AND is configured.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8848/.well-known/oauth-protected-resource', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

  # Consumer player PWA (static SPA + nginx proxying ONLY /api/app/* to `api`).
  learning-app:
    build:
      context: ../web/learning-player
      dockerfile: Dockerfile
      args:
        # Browser error reporting DSN, baked into the bundle at build time.
        # Empty by default (no-op); prod sets it from PROD_SENTRY_DSN_PLAYER_WEB
        # via the deploy .env render → GlitchTip through the public ingest edge.
        # (The backend DSN is the separate PROD_SENTRY_DSN_PLAYER_API — split per surface.)
        VITE_SENTRY_DSN_PLAYER: ${VITE_SENTRY_DSN_PLAYER:-}
        # Umami analytics (cookieless). website-id is public; src is the tracking
        # script on the analytics ingest edge. Empty by default -> no-op bundle.
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
        VITE_UMAMI_SRC: ${VITE_UMAMI_SRC:-}
    # PULLED, NOT BUILT ON THE BOX (2026-08-19). This was the only prod surface whose image
    # was local and untagged, so the player could not be pinned or rolled back — and on
    # 2026-08-19 its api containers ran sha-cd22625 while the UI beside them had been built
    # from main. Published by stack-test's publish job alongside api/viewer/pipeline-llm, so
    # ${PODCAST_IMAGE_TAG} now pins every container in this file to one sha.
    image: ghcr.io/chipi/podcast-scraper-learning-app:${PODCAST_IMAGE_TAG:-main}
    restart: unless-stopped
    ports:
      # Loopback only — the Caddy edge (player.caddy) is the public front (ADR-114).
      - "127.0.0.1:${PLAYER_PORT:-8092}:80"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    read_only: true
    tmpfs:
      # nginx runtime scratch only. Do NOT tmpfs /etc/nginx/conf.d — the image bakes the
      # server block (default.conf: listen 80 + SPA root + /api/app proxy) there, and there
      # are no *.template files to regenerate it, so an empty tmpfs masks it and nginx starts
      # with zero server blocks → listens on nothing → unhealthy (prod incident 2026-07-23).
      # conf.d is static baked content nginx only reads; read_only rootfs is fine.
      - /var/cache/nginx
      - /var/run
      - /tmp
    depends_on:
      api:
        condition: service_healthy

  # Digest scheduler sidecar (#1412 / #1415). The app_only `api` above CANNOT run the in-process
  # scheduler (enable_jobs_api is force-disabled under app_only), so this owns the "Your Week"
  # digest cadence: the SAME low-privilege image, run as a tiny loop that wakes each interval and
  # calls app_digest_personal.enqueue_due_digests (per-user consent + slot gated, per-period
  # idempotent) to drop DeliveryEnvelopes into the shared appdata outbox. The homelab delivery
  # worker drains + sends. Maximally isolated: network_mode none (pure filesystem — never talks to
  # anything), no ports, no docker.sock, no provider keys, read-only rootfs, cap_drop ALL.
  digest-scheduler:
    image: ghcr.io/chipi/podcast-scraper-stack-api:${PODCAST_IMAGE_TAG:-main}
    restart: unless-stopped
    # Run as the image's non-root podcast uid directly. The entrypoint's privileged branch does
    # `setpriv --reuid=podcast`, which needs CAP_SETUID/SETGID — dropped here — so we must NOT go
    # through it; a plain `user:` makes entrypoint.sh take its non-root `exec "$@"` path. uid 1000
    # matches the api's post-drop identity, keeping appdata file ownership uniform.
    user: "1000:1000"
    command: ["python", "/app/digest_scheduler.py"]
    environment:
      APP_DATA_DIR: /app/appdata
      DIGEST_CORPUS_ROOT: /app/output
      DIGEST_INTERVAL_SECONDS: "3600"
      DIGEST_HEARTBEAT_FILE: /heartbeat/tick
      # Context only (log lines). No Sentry/OTEL init in the runner — network none makes them dead
      # weight, and `command:` bypasses the image's opentelemetry-instrument wrapper.
      PODCAST_ENV: ${PODCAST_ENV:-dev}
    # No network at all — the runner only touches mounted filesystems.
    network_mode: none
    volumes:
      # Same read-only corpus + shared appdata bind mount the api uses (writes go through the
      # per-envelope FileLock the api also honors — multi-process-safe, verified 2026-08-07).
      - corpus_data:/app/output:ro
      - ${PLAYER_APPDATA_HOST_PATH:-/srv/podcast-scraper/player-appdata}:/app/appdata
      # The committed runner, read-only (present on every box after the deploy's git reset).
      - ../infra/deploy/digest_scheduler.py:/app/digest_scheduler.py:ro
    read_only: true
    tmpfs:
      - /tmp
      - /heartbeat
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 64
    # Liveness = the loop is cycling: the runner rewrites /heartbeat/tick each cycle. Unhealthy if
    # it hasn't beaten within ~2 intervals → visible in `docker ps`. (The homelab dead-man alert
    # covers the 'healthy but enqueuing nothing' case.) CMD-SHELL, no curl (network none): mtime.
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y /heartbeat/tick 2>/dev/null || echo 0) )) -lt 7200"]
      interval: 5m
      timeout: 10s
      start_period: 2m
      retries: 2
    depends_on:
      api:
        condition: service_started

volumes:
  # Shared read-only with the operator stack. Set PODCAST_CORPUS_VOLUME to that stack's
  # external volume name on the VPS (e.g. compose_corpus_data).
  corpus_data:
    external: true
    name: ${PODCAST_CORPUS_VOLUME:-compose_corpus_data}
  # (player_appdata is now a HOST bind mount on the api service — see above — so it is
  # backupable and durable; no Docker-managed volume declaration.)
