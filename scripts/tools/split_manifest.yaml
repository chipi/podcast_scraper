# What the private split (ADR-166) copies into ./apps/<repo>/, read by
# scripts/tools/split_copy.py. Python modules listed under `modules` move to a new
# package and every import of them is rewritten; `trees` and `files` are copied
# verbatim. Everything not listed stays public.
#
# Kept public on purpose (do not add here): the corpus read-models
# (kg_view, gi_view, relational_view, catalog_cache, corpus_access, content_source,
# slugs, artwork, kg_index; renamed out of the app_ namespace), the app_ modules platform code
# reaches (app_moments from the app and content_source; app_episode_search, app_audio_drift and
# app_audio_bridge from audio_sync, which the pipeline runs; app_umbrellas from the read-models), the
# kernel (sessions, users, roles, csrf, access, magic link, outbox, push, audit,
# operator guard, account deletion, user seed and CLI, oauth protocol + mock, comms
# consent store, released-app-version store), and
# what the operator viewer calls under /api/app (auth, preferences, admin,
# graph-events, profile). The five enrichers with no IP stay public (ADR-166 decision 5):
# insight_density, guest_coappearance, insight_sentiment, grounding_rate,
# topic_cooccurrence_corpus, with the grounding_rate scorer.

player:
  package: closelistening_player
  # Appended to the scaffold .gitignore: the public repo keeps these in its root .gitignore under
  # web/learning-player/, which the copy does not carry. The fastlane, keystore and .p8 lines are
  # the secret backstops.
  gitignore:
    - node_modules/
    - .env
    - .env.local*
    - .env.*.local
    - "!.env*.example"
    - web/dist/
    - web/dist-ssr/
    - web/logs/
    - web/**/*.log
    - web/*.local
    - web/.idea/
    - web/test-results/
    - web/playwright-report/
    - web/e2e-results.json
    - web/blob-report/
    - web/playwright/.cache/
    - web/validation-results/
    - web/design-results/
    - web/.e2e-corpus/
    - web/e2e/.app-state/
    - web/e2e/.design-state/
    - web/e2e/.telemetry-state/
    - web/e2e/telemetry/.report.json
    - web/e2e/telemetry/.diag/
    - web/ios/uitests/*.xcodeproj/
    - web/ios/vendor/
    - web/ios/.bundle/
    - web/android/vendor/
    - web/android/.bundle/
    - "**/fastlane/*.json"
    - "**/fastlane/.env"
    - "*.jks"
    - "*.keystore"
    - "**/android/keystore.properties"
    - "*.p8"
    - "**/fastlane/report.xml"
    - "**/fastlane/Preview.html"
    - "**/fastlane/test_output/"
    - "**/fastlane/screenshots/"
    - "**/fastlane/README.md"
    - "**/.podcast_scraper/corpus-art/derived/"
    - "**/.viewer/jobs.jsonl.lock"
  entry_points:
    player: podcast_scraper.server.app_player_extension:EXTENSION
  modules:
    # The capability audit measures Discover: every section walks the corpus through the
    # player's own feature extraction (app_discover_view._episode_features).
    podcast_scraper:
      - capability_audit
    podcast_scraper.server:
      - app_player_extension
      - app_another_view_rail
      - app_auto_picks
      - app_board_view
      - app_cache_warm
      - app_capture_export
      - app_captured_rail
      - app_collections_store
      - app_corpus_revision
      - app_corpus_strength
      - app_digest_common
      - app_digest_daily_recap
      - app_digest_dispatch
      - app_digest_health
      - app_digest_job
      - app_digest_personal
      - app_digest_recommendations
      - app_digest_sections
      - app_discover_rails
      - app_discover_view
      - app_email_episode
      - app_engagement_series
      - app_episode_notes
      - app_favorites_view
      - app_goal_reel
      - app_graph_refs
      - app_guided_shows
      - app_key_voices
      - app_learning_path
      - app_new_episode_alerts
      - app_new_episode_digest
      - app_notifications_store
      - app_people_rail
      - app_pkm_export
      - app_rail_turns
      - app_ranking_config
      - app_ranking_config_store
      - app_ranking_telemetry
      - app_reasons
      - app_recap
      - app_recap_view
      - app_reference_client
