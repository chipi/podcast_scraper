# Common is two subpackages (ADR-166 decision 1): identity (who you are: MCP sign-in
# and tokens) and intelligence (what the corpus knows: enrichers, MCP tool servers).
# identity never imports intelligence, so an app that needs sign-in alone can use
# it on its own; split_probe.py checks that.
common:
  package: closelistening_common
  # Registered under the podcast_scraper.extensions entry-point group (ADR-166 decision 4);
  # the module path is rewritten like any moved module.
  entry_points:
    mcp: podcast_scraper.server.app_mcp_extension:EXTENSION
    intelligence: podcast_scraper.enrichment.intelligence_extension:EXTENSION
  subpackages:
    identity:
      modules:
        podcast_scraper.server:
          - app_oauth_providers
          - app_mcp_tokens
          - app_oauth_server
          - app_rate_limit
          - app_mcp_extension
        podcast_scraper.server.routes:
          - app_mcp
          - mcp_oauth
          - internal_mcp
    intelligence:
      modules:
        podcast_scraper.enrichment.enrichers:
          - org_web
          - person_web
          - temporal_velocity
          - topic_consensus
          - topic_similarity
          - topic_theme_clusters
        podcast_scraper.enrichment.query_enrichers:
          - query_topic_relatedness
        podcast_scraper.enrichment.eval.scorers:
          - topic_similarity
        podcast_scraper.enrichment.scorers:
          - consensus
        podcast_scraper.enrichment:
          - ml_wiring
          - intelligence_extension
        # Tier-A features (ADR-166 decision 5, operator decisions 2026-10-08): storylines,
        # consensus and cluster search operators, semantic topic clusters, momentum/trending.
        podcast_scraper.search:
          - storylines
          - storyline_registry
          - storyline_history
          - clustering_history
          - stable_cluster_ids
          - operators
          - topic_clusters
          - topic_clusters_cli
        podcast_scraper.server:
          - app_momentum
        podcast_scraper.server.routes:
          - corpus_storylines
          - corpus_trending
          - corpus_topic_clusters
        # ADR-166 decision 3: the observability data layer (config, result, _http,
        # sources, aggregate) stays public for the operator Ops view; the MCP server,
        # its CLI and its auth move.
        podcast_obs:
          - mcp_server
          - cli
          - auth
          - __main__
      packages:
        podcast_scraper.mcp: mcp
        podcast_scraper.enrichment.provider_types.consensus: provider_types.consensus
  files:
    - scripts/mcp_e2e_pivot_chain.py
    - scripts/eval/replay_storylines.py
    - docs/prd/PRD-034-generic-mcp-server.md
    - docs/rfc/RFC-093-litm-context-packs.md
    - docs/rfc/RFC-095-generic-mcp-server.md
    - docs/rfc/RFC-112-remote-mcp-transport-and-auth.md
    - docs/rfc/RFC-128-durable-storylines.md
    - docs/adr/ADR-153-mcp-stays-read-only-over-http.md
    - docs/adr/ADR-108-nli-disagreement-enrichers-gated-dark.md
    - docs/guides/EXPLORATION_MCP.md
    - docs/guides/LOCAL_MCP_SERVERS.md
    - docs/guides/MCP_SERVER_GUIDE.md
    - docs/guides/OBS_MCP_HOMELAB_DEPLOY.md
    - docs/guides/OBSERVABILITY_CONTROL_PLANE.md
    - docs/wip/OBS-MCP-ON-VPS-PLAN.md
    - docs/wip/ENRICHER-HARDENING-ROADMAP.md
    - docs/wip/ONBOARDING-SHOWS-FOR-ENRICHER-VALUE.md
    - docs/wip/2026-09-02-enricher-reenable-prep.md
    - docs/wip/PUBLIC-EXPOSURE-AND-PRIVATE-SPLIT.md

# Studio is the full operator viewer as a private app (ADR-166 decision 2). The public
# repo keeps its own viewer, stripped of the tier-A features (consensus and cluster search,
# storylines, themes, the private lenses, trending, the MCP panel, the enriched answer and the
# panels on velocity, consensus and topic similarity); Studio keeps all of them, with the UI, unit tests, e2e specs and fixtures its first copy brought.
studio:
  package: closelistening_studio
  own_source: true
  # Seeded from web/gi-kg-viewer (first copy at c2321f0a8, last sync at 0f72e7f8c). Since the
  # public viewer lost its tier-A features, Studio is its own source and nothing is copied into
  # it: a re-run of split_copy.py must not overwrite it with the stripped viewer.
