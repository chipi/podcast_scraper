      - app_user_state
      # Boards and storylines summarised for the player, and the guard on the references a
      # listener's saved state holds.
      - board_summaries
      - storyline_summaries
      - reference_integrity
      - rekey_references
    podcast_scraper.server.routes:
      - app_artwork
      - app_capture
      - app_collections
      - app_comms
      - app_consolidation
      - app_corpus
      - app_discover
